                container: document.getElementById('gameContainer'),
            };
            this._msgTimer = null;
            this._abortController = new AbortController();
        }

        bindInputs(dispatch) {
            const canvas = document.getElementById('canvas');
            const sig = { signal: this._abortController.signal };
            canvas.addEventListener('mousemove', e => dispatch({ type: InputActionType.CANVAS_MOUSE_MOVE, event: e }), sig);
            canvas.addEventListener('mousedown', e => dispatch({ type: InputActionType.CANVAS_MOUSE_DOWN, event: e }), sig);
            canvas.addEventListener('mouseup',   e => dispatch({ type: InputActionType.CANVAS_MOUSE_UP,   event: e }), sig);
            canvas.addEventListener('click',     e => dispatch({ type: InputActionType.CANVAS_CLICK,      event: e }), sig);
            document.addEventListener('keydown',  e => dispatch({ type: InputActionType.KEY_DOWN,          event: e }), sig);
        }

        bindControls({ onReset, onNext }) {
            const sig = { signal: this._abortController.signal };
            this._els.resetBtn.addEventListener('click', onReset, sig);
            this._els.nextBtn.addEventListener('click',  onNext,  sig);
        }

        initModeSwitcher(currentMode, onSwitch) {
            const existing = document.querySelector('.mode-switcher');
            if (existing) existing.remove();

            const bar = document.createElement('div');
            bar.className = 'mode-switcher';
            const modes = ['play', 'inspector', 'creator'];
            for (const m of modes) {
                const btn = document.createElement('button');
                btn.textContent = m.charAt(0).toUpperCase() + m.slice(1);
                btn.className = m === currentMode ? 'active' : '';
                btn.addEventListener('click', () => {
                    for (const b of bar.querySelectorAll('button')) b.classList.remove('active');
                    btn.classList.add('active');
                    onSwitch(m);
                });
                bar.appendChild(btn);
            }
            document.body.appendChild(bar);
            this._modeSwitcherBar = bar;
        }

        setModeSwitcherActive(mode) {
            if (!this._modeSwitcherBar) return;
            const modes = ['play', 'inspector', 'creator'];
            const btns = this._modeSwitcherBar.querySelectorAll('button');
            btns.forEach((btn, i) => {
                btn.classList.toggle('active', modes[i] === mode);
            });
        }

        renderHUD({ level, shotCount, maxShots, unlimited, score }) {
            if (level    != null && this._els.levelNum)  this._els.levelNum.textContent  = String(level);
            if (score    != null && this._els.score)      this._els.score.textContent      = String(score);
            if (shotCount != null && this._els.shotCount) this._els.shotCount.textContent  = String(shotCount);
            if (this._els.maxShots) {
                this._els.maxShots.textContent = unlimited ? '∞' : String(maxShots);
            }
        }

        showMessage(text, duration = 0) {
            const el = this._els.message;
            if (!el) return;
            el.textContent = text;
            el.classList.add('show');
            clearTimeout(this._msgTimer);
            if (duration > 0) {
                this._msgTimer = setTimeout(() => el.classList.remove('show'), duration);
            }
        }

        hideMessage() {
            const el = this._els.message;
            if (el) el.classList.remove('show');
        }

        showNextButton() {
            if (this._els.nextBtn) this._els.nextBtn.style.display = '';
        }

        hideNextButton() {
            if (this._els.nextBtn) this._els.nextBtn.style.display = 'none';
        }

        setTitle(text) {
            if (this._els.header) this._els.header.textContent = text;
            document.title = text;
        }

        cleanup() {
            this._abortController.abort();
        }
    }

    // ─── Mode Controllers ─────────────────────────────────────────────────────────

    class BaseModeController {
        constructor(deps) { this._deps = deps; }
        enter() {}
        handleAction(_action) { return false; }
        update() {}
        exit() {
            document.getElementById('inspectorGrid')?.remove();
            document.getElementById('creatorToolSidebar')?.remove();
            document.body.style.overflow = 'hidden';
        }
    }

    class PlayModeController extends BaseModeController {
        enter() {
            const { engine, ui, modeState } = this._deps;
            engine.loadLevel(modeState.currentLevel);
            ui.setTitle('Bouncing Ball');
            ui.hideNextButton();
            const s = engine.getSnapshot();
            ui.renderHUD({
                level: modeState.currentLevel + 1,
                shotCount: s.shotsFired,
                maxShots: s.activeMaxShots,
                unlimited: s.activeUnlimitedShots,
                score: s.score
            });
        }

        handleAction(action) {
            const { engine } = this._deps;
            if (action.type === InputActionType.RESET_LEVEL) { engine.resetLevel(); return true; }
            if (action.type === InputActionType.NEXT_LEVEL)  { engine.nextLevel();  return true; }
            return false;
        }
    }

    class InspectorModeController extends BaseModeController {
        enter() {
            const { engine, renderer, urlStateService, ui, canvas, modeState } = this._deps;
            const s = engine.getSnapshot();
            s.phase = 'inspector';
            document.body.style.overflow = 'auto';
            ui.setTitle('Bouncing Ball Inspector');

            const controls = document.getElementById('controls');
            controls.innerHTML = '';

            const startInput = document.createElement('input');
            startInput.type = 'number'; startInput.min = '1';
            startInput.value = String(modeState.inspectorStart);
            startInput.style.width = '110px'; startInput.title = 'Start level';

            const countInput = document.createElement('input');
            countInput.type = 'number'; countInput.min = '1'; countInput.max = '120';
            countInput.value = '18'; countInput.style.width = '110px'; countInput.title = 'How many levels';

            const renderBtn = document.createElement('button');
            renderBtn.textContent = 'Render';

            const help = document.createElement('span');
            help.textContent = 'Tip: add ?mode=inspector to URL. Click a card to play that level.';
            help.style.fontSize = '12px'; help.style.color = '#9cc4d3';

            controls.appendChild(startInput);
            controls.appendChild(countInput);
            controls.appendChild(renderBtn);
            controls.appendChild(help);

            const container = document.getElementById('gameContainer');
            const grid = document.createElement('div');
            grid.id = 'inspectorGrid';
            grid.style.width = '800px';
            grid.style.display = 'grid';
            grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(250px, 1fr))';
            grid.style.gap = '10px';
            grid.style.marginTop = '10px';
            container.appendChild(grid);

            const renderInspector = () => {
                const start = Math.max(1, parseInt(startInput.value, 10) || 1);
                const count = Math.max(1, Math.min(120, parseInt(countInput.value, 10) || 18));
                startInput.value = String(start); countInput.value = String(count);
                grid.innerHTML = '';

                for (let ln = start; ln < start + count; ln++) {
                    const idx = ln - 1;
                    const level = engine.getLevel(idx);
                    const source = idx < LevelService._levels.length ? 'Defined' : `Seeded #${ln}`;

                    const card = document.createElement('article');
                    card.style.background = '#10182f'; card.style.border = '1px solid #23345f';
                    card.style.borderRadius = '10px'; card.style.padding = '10px';
                    card.style.cursor = 'pointer'; card.title = 'Click to play this level';
                    card.addEventListener('click', () => urlStateService.navigateToLevel(ln, engine.getProceduralConfig()));

                    const titleEl = document.createElement('div');
                    titleEl.style.fontSize = '13px'; titleEl.style.color = '#9ce8ff';
                    titleEl.style.marginBottom = '6px';
                    titleEl.textContent = `Level ${ln} · ${source}`;
                    card.appendChild(titleEl);

                    const previewCanvas = document.createElement('canvas');
                    previewCanvas.width = 240; previewCanvas.height = 180;
                    previewCanvas.style.width = '100%';
                    previewCanvas.style.border = '1px solid #1f2d56';
                    previewCanvas.style.borderRadius = '6px';
                    renderer.renderPreview(level, { levelNumber: ln }, previewCanvas);
                    card.appendChild(previewCanvas);

                    const stat = document.createElement('div');
                    stat.style.marginTop = '6px'; stat.style.fontSize = '12px'; stat.style.color = '#afcddf';
                    stat.textContent = `Targets ${level.targets.length} · Features ${level.features.length} · Max shots ${formatMaxShots(level.maxShots, !!(level.launcher && level.launcher.special))}`;
                    card.appendChild(stat);
                    grid.appendChild(card);
                }
            };

            renderBtn.addEventListener('click', renderInspector);
            renderInspector();
        }
    }

    class CreatorModeController extends BaseModeController {
        constructor(deps) {
            super(deps);
            this._es = {
                creatorLevel: null,
                creatorTool: 'target',
                creatorPortalStart: null,
                creatorDragStart: null,
                creatorTubeDraft: null,
                creatorDirty: false,
                creatorToolButtons: []
            };
        }

        enter() {
            const { engine, levelService, urlStateService, ui, modeState } = this._deps;
            const s = engine.getSnapshot();
            s.phase = 'creator';
            ui.setTitle('Bouncing Ball Creator');

            let loadedFromSnapshot = false;
            if (modeState.useLiveSnapshot) {
                try {
                    const raw = sessionStorage.getItem(CREATOR_SNAPSHOT_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        this._es.creatorLevel = this._cloneLevel(levelService.normalizeLevelConfig(parsed));
                        loadedFromSnapshot = true;
                    }
                    sessionStorage.removeItem(CREATOR_SNAPSHOT_KEY);
                } catch { /* ignore */ }
            }

            if (!loadedFromSnapshot) {
                this._es.creatorLevel = this._cloneLevel(engine.getLevel(modeState.currentLevel));
            }
            const cl = this._es.creatorLevel;
            if (!cl.launcher) cl.launcher = { x: 100, y: 500, special: false };
            cl.launcher.special   = !!cl.launcher.special;
            cl.launcher.orbCount  = normalizeSpecialLauncherOrbCount(cl.launcher.orbCount);
            this._es.creatorTool         = 'target';
            this._es.creatorPortalStart  = null;
            this._es.creatorDragStart    = null;
            this._es.creatorTubeDraft    = null;
            this._es.creatorDirty        = false;

            const controls = document.getElementById('controls');
            controls.innerHTML = '';
            this._createSidebar();

            const shotsInput = document.createElement('input');
            shotsInput.type = 'number'; shotsInput.min = '1';
            shotsInput.value = String(cl.maxShots); shotsInput.style.width = '90px';
            shotsInput.title = 'Max shots';
            shotsInput.addEventListener('change', () => {
                this._es.creatorLevel.maxShots = Math.max(1, parseInt(shotsInput.value, 10) || 1);
                this._refreshScene();
            });

            const orbCountInput = document.createElement('input');
            orbCountInput.type = 'number'; orbCountInput.min = '1'; orbCountInput.max = '9';
            orbCountInput.value = String(normalizeSpecialLauncherOrbCount(cl.launcher.orbCount));
            orbCountInput.style.width = '110px'; orbCountInput.title = 'Special launcher orbs per click (1-99)';
            orbCountInput.addEventListener('change', () => {
                this._es.creatorLevel.launcher.orbCount = normalizeSpecialLauncherOrbCount(orbCountInput.value);
                orbCountInput.value = String(this._es.creatorLevel.launcher.orbCount);
                this._refreshScene();
            });

            const playBtn = document.createElement('button');
            playBtn.textContent = 'Play Test';
            playBtn.addEventListener('click', () => {
                if (engine.getSnapshot().phase === 'creator') {
                    this._refreshScene('aiming');
                    playBtn.textContent = 'Back To Edit';
                } else {
                    this._refreshScene('creator');
                    playBtn.textContent = 'Play Test';
                }
            });

            const undoBtn = document.createElement('button');
            undoBtn.textContent = 'Undo Last';
            undoBtn.addEventListener('click', () => {
                if (this._es.creatorLevel.features.length > 0) {
                    this._es.creatorLevel.features.pop(); this._es.creatorDirty = true; this._refreshScene();
                } else if (this._es.creatorLevel.targets.length > 0) {
                    this._es.creatorLevel.targets.pop(); this._es.creatorDirty = true; this._refreshScene();
                }
            });

            const clearBtn = document.createElement('button');
            clearBtn.textContent = 'Clear';
            clearBtn.addEventListener('click', () => {
                this._es.creatorLevel.targets = []; this._es.creatorLevel.features = [];
                this._es.creatorPortalStart = null; this._es.creatorDragStart = null; this._es.creatorTubeDraft = null;
                this._es.creatorDirty = true; this._refreshScene();
            });

            const exportBtn = document.createElement('button');
            exportBtn.textContent = 'Export JSON';
            exportBtn.addEventListener('click', () => this._exportLevel());

            controls.appendChild(shotsInput);
            controls.appendChild(orbCountInput);
            controls.appendChild(playBtn);
            controls.appendChild(undoBtn);
            controls.appendChild(clearBtn);
            controls.appendChild(exportBtn);

            this._refreshScene('creator');
        }

        handleAction(action) {
            const { engine } = this._deps;
            const s = engine.getSnapshot();

            if (action.type === InputActionType.CANVAS_MOUSE_MOVE) {
                const pts = this._canvasPoint(action.event);
                engine.updateMousePos(pts.x, pts.y);
                if (s.phase === 'creator' && this._es.creatorTool === 'tube' && this._es.creatorTubeDraft) {
                    const last = this._es.creatorTubeDraft[this._es.creatorTubeDraft.length - 1];
                    if (Math.hypot(pts.x - last.x, pts.y - last.y) >= 6) {
                        this._es.creatorTubeDraft.push({ x: pts.x, y: pts.y });
                    }
                }
                return true;
            }

            if (action.type === InputActionType.CANVAS_MOUSE_DOWN) {
                if (s.phase !== 'creator') return false;
                const pts = this._canvasPoint(action.event);
                const dragTools = ['wall', 'duplicatorWall', 'dangerWall', 'orbCatcher', 'obstacle'];
                if (dragTools.includes(this._es.creatorTool)) {
                    this._es.creatorDragStart = pts;
                    return true;
                }
                if (this._es.creatorTool === 'tube') {
                    this._es.creatorTubeDraft = [pts];
                    return true;
                }
                return false;
            }

            if (action.type === InputActionType.CANVAS_MOUSE_UP) {
                if (s.phase !== 'creator') return false;
                if (this._es.creatorTool === 'tube' && this._es.creatorTubeDraft) {
                    this._finalizeTube(); return true;
                }
                if (!this._es.creatorDragStart) return false;
                const pts = this._canvasPoint(action.event);
                this._finalizeDrag(pts.x, pts.y); return true;
            }

            if (action.type === InputActionType.CANVAS_CLICK) {
                if (s.phase === 'creator') { this._placeClick(this._canvasPoint(action.event)); return true; }
                return false;
            }

            if (action.type === InputActionType.RESET_LEVEL) {
                if (s.phase === 'creator') {
                    this._refreshScene('creator');
                } else {
                    this._refreshScene('aiming');
                }
                return true;
            }

            return false;
        }

        getOverlayConfig() {
            const { engine } = this._deps;
            const s = engine.getSnapshot();
            if (s.phase !== 'creator') return null;
            return { type: 'creatorGuides', editorState: this._es };
        }

        // ── Private ──────────────────────────────────────────────────────────────

        _canvasPoint(event) {
            const canvas = document.getElementById('canvas');
            const rect = canvas.getBoundingClientRect();
            return { x: event.clientX - rect.left, y: event.clientY - rect.top };
        }

        _cloneLevel(level) {
            return {
                launcher: { ...level.launcher, special: !!level.launcher.special, orbCount: normalizeSpecialLauncherOrbCount(level.launcher.orbCount) },
                maxShots: level.maxShots,
                targets: level.targets.map(t => ({ ...t })),
                features: level.features.map(f => { const c = { ...f }; delete c.plugin; return c; })
            };
        }

        _refreshScene(mode) {
            const { engine, levelService } = this._deps;
            const phase = mode ?? (engine.getSnapshot().phase === 'creator' ? 'creator' : 'aiming');
            engine.applyLevelConfig(levelService.normalizeLevelConfig(this._es.creatorLevel), phase);
            const { ui, modeState } = this._deps;
            ui.renderHUD({ level: 'C', shotCount: 0, maxShots: this._es.creatorLevel.maxShots, unlimited: false, score: 0 });
        }

        _placeClick({ x, y }) {
            const es = this._es;
            const oc = normalizeSpecialLauncherOrbCount(es.creatorLevel.launcher && es.creatorLevel.launcher.orbCount);
            if (es.creatorTool === 'launcher') {
                es.creatorLevel.launcher = { x: Math.round(x), y: Math.round(y), special: false, orbCount: oc };
                es.creatorDirty = true; this._refreshScene(); return;
            }
            if (es.creatorTool === 'specialLauncher') {
                es.creatorLevel.launcher = { x: Math.round(x), y: Math.round(y), special: true, orbCount: oc };
                es.creatorDirty = true; this._refreshScene(); return;
            }
            if (es.creatorTool === 'gravityWell') {
                es.creatorLevel.features.push({ type: 'gravityWell', x: Math.round(x), y: Math.round(y), radius: 120, strength: 12000 });
                es.creatorDirty = true; this._refreshScene(); return;
            }
            if (es.creatorTool === 'target') {
                es.creatorLevel.targets.push({ x: Math.round(x), y: Math.round(y), radius: 18 });
                es.creatorDirty = true; this._refreshScene(); return;
            }
            if (es.creatorTool === 'portal') {
                if (!es.creatorPortalStart) {
                    es.creatorPortalStart = { x, y };
                } else {
                    es.creatorLevel.features.push({
                        type: 'portal',
                        x1: Math.round(es.creatorPortalStart.x), y1: Math.round(es.creatorPortalStart.y),
                        x2: Math.round(x), y2: Math.round(y), radius: 22
                    });
                    es.creatorPortalStart = null; es.creatorDirty = true; this._refreshScene();
                }
                return;
            }
            if (es.creatorTool === 'erase') {
                this._removeNearest(x, y); es.creatorDirty = true; this._refreshScene();
            }
        }

        _finalizeDrag(endX, endY) {
            const es = this._es;
            if (!es.creatorDragStart) return;
            const { canvas } = this._deps;
            const rect = getRectFromPoints(es.creatorDragStart, { x: endX, y: endY });
            if (es.creatorTool === 'wall') es.creatorLevel.features.push({ type: 'wall', ...rect });
            else if (es.creatorTool === 'duplicatorWall') es.creatorLevel.features.push({ type: 'duplicatorWall', ...rect });
            else if (es.creatorTool === 'dangerWall') es.creatorLevel.features.push({ type: 'dangerWall', ...rect });
            else if (es.creatorTool === 'orbCatcher') es.creatorLevel.features.push({ type: 'orbCatcher', ...rect });
            else if (es.creatorTool === 'obstacle') {
                const cH = document.getElementById('canvas').height;
                es.creatorLevel.features.push({
                    type: 'obstacle', ...rect, vy: 2,
                    minY: Math.max(0, rect.y - 90),
                    maxY: Math.min(cH - rect.h, rect.y + 90)
                });
            }
            es.creatorDragStart = null; es.creatorDirty = true; this._refreshScene();
        }

        _finalizeTube() {
            const es = this._es;
            if (!es.creatorTubeDraft || es.creatorTubeDraft.length < 3) { es.creatorTubeDraft = null; return; }
            es.creatorLevel.features.push({
                type: 'tube',
                points: es.creatorTubeDraft.map(p => ({ x: Math.round(p.x), y: Math.round(p.y) })),
                thickness: 14
            });
            es.creatorTubeDraft = null; es.creatorDirty = true; this._refreshScene();
        }

        _removeNearest(x, y) {
            const es = this._es;
            let best = { kind: null, idx: -1, dist: Infinity };
            for (let i = 0; i < es.creatorLevel.targets.length; i++) {
                const t = es.creatorLevel.targets[i];
                const d = Math.hypot(x - t.x, y - t.y);
                if (d < best.dist) best = { kind: 'target', idx: i, dist: d };
            }
            for (let i = 0; i < es.creatorLevel.features.length; i++) {
                const f = es.creatorLevel.features[i];
                let d;
                if (f.type === 'portal') {
                    const r = f.radius || 22;
                    d = Math.min(
                        Math.hypot(x - f.x1, y - f.y1) - r,
                        Math.hypot(x - f.x2, y - f.y2) - r,
                        distancePointToSegment(x, y, f.x1, f.y1, f.x2, f.y2) - 10
                    );
                } else if (f.type === 'tube' && Array.isArray(f.points) && f.points.length > 1) {
                    d = Infinity;
                    for (let j = 0; j < f.points.length - 1; j++) {
                        const ds = distancePointToSegment(x, y, f.points[j].x, f.points[j].y, f.points[j+1].x, f.points[j+1].y) - ((f.thickness || 14) * 0.5 + 8);
                        if (ds < d) d = ds;
                    }
                } else {
                    const c = featureCenter(f);
                    d = Math.hypot(x - c.x, y - c.y);
                }
                if (d < best.dist) best = { kind: 'feature', idx: i, dist: d };
            }
            const ld = Math.hypot(x - es.creatorLevel.launcher.x, y - es.creatorLevel.launcher.y);
            if (ld < best.dist) best = { kind: 'launcher', idx: -1, dist: ld };

            if (best.dist > 40) return;
            if (best.kind === 'target')  es.creatorLevel.targets.splice(best.idx, 1);
            if (best.kind === 'feature') es.creatorLevel.features.splice(best.idx, 1);
            if (best.kind === 'launcher') es.creatorLevel.launcher = { x: 100, y: 500, special: false, orbCount: 1 };
        }

        _exportLevel() {
            const payload = {
                launcher: { ...this._es.creatorLevel.launcher },
                maxShots: this._es.creatorLevel.maxShots,
                targets:  this._es.creatorLevel.targets.map(t => ({ ...t })),
                features: this._es.creatorLevel.features.map(f => ({ ...f }))
            };
            const text = JSON.stringify(payload, null, 2);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => this._deps.ui.showMessage('Level JSON copied', 1200));
            } else {
                window.prompt('Copy level JSON:', text);
            }
        }

        _drawToolPreview(previewCanvas, tool) {
            const pctx = previewCanvas.getContext('2d');
            const w = previewCanvas.width, h = previewCanvas.height;
            pctx.clearRect(0, 0, w, h); pctx.fillStyle = '#0f1a33'; pctx.fillRect(0, 0, w, h);
            if (tool === 'launcher') {
                pctx.fillStyle = '#00e5ff'; pctx.beginPath(); pctx.arc(w/2, h/2, 8, 0, Math.PI*2); pctx.fill();
            } else if (tool === 'specialLauncher') {
                pctx.fillStyle = '#ffe083'; pctx.beginPath(); pctx.arc(w/2, h/2, 8, 0, Math.PI*2); pctx.fill();
                pctx.strokeStyle = 'rgba(255,224,131,0.95)'; pctx.lineWidth = 2;
                pctx.beginPath(); pctx.arc(w/2, h/2, 12, 0, Math.PI*2); pctx.stroke();
            } else if (tool === 'target') {
                pctx.strokeStyle = '#00e5ff'; pctx.lineWidth = 2;
                pctx.beginPath(); pctx.arc(w/2, h/2, 10, 0, Math.PI*2); pctx.stroke();
                pctx.fillStyle = '#00e5ff'; pctx.beginPath(); pctx.arc(w/2, h/2, 2.5, 0, Math.PI*2); pctx.fill();
            } else if (tool === 'wall') {
                pctx.fillStyle = '#2a2a5a'; pctx.fillRect(14, 11, w-28, h-22);
            } else if (tool === 'duplicatorWall') {
                pctx.fillStyle = 'rgba(144,95,255,0.82)'; pctx.fillRect(14, 11, w-28, h-22);
                pctx.strokeStyle = 'rgba(208,188,255,0.95)'; pctx.lineWidth = 1.5; pctx.strokeRect(14, 11, w-28, h-22);
            } else if (tool === 'dangerWall') {
                pctx.fillStyle = 'rgba(220,45,45,0.85)'; pctx.fillRect(14, 11, w-28, h-22);
            } else if (tool === 'orbCatcher') {
                pctx.fillStyle = 'rgba(255,130,40,0.82)'; pctx.fillRect(14, 11, w-28, h-22);
                pctx.strokeStyle = 'rgba(255,190,110,0.95)'; pctx.lineWidth = 1.5; pctx.strokeRect(14, 11, w-28, h-22);
            } else if (tool === 'gravityWell') {
                const gx = w/2, gy = h/2, gr = Math.min(w,h)*0.38;
                const grad = pctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
                grad.addColorStop(0, 'rgba(255,235,160,0.95)'); grad.addColorStop(0.3, 'rgba(255,196,70,0.6)'); grad.addColorStop(1, 'rgba(255,196,70,0)');
                pctx.fillStyle = grad; pctx.beginPath(); pctx.arc(gx, gy, gr, 0, Math.PI*2); pctx.fill();
                pctx.fillStyle = '#ffd27a'; pctx.beginPath(); pctx.arc(gx, gy, 3.5, 0, Math.PI*2); pctx.fill();
            } else if (tool === 'obstacle') {
                pctx.fillStyle = '#7f3838'; pctx.fillRect(22, 8, w-44, h-16);
                pctx.strokeStyle = '#ff4444'; pctx.lineWidth = 1.5; pctx.strokeRect(22, 8, w-44, h-16);
            } else if (tool === 'portal') {
                pctx.strokeStyle = 'rgba(255,80,255,0.8)'; pctx.lineWidth = 2;
                pctx.beginPath(); pctx.moveTo(16, h/2); pctx.lineTo(w-16, h/2); pctx.stroke();
                pctx.beginPath(); pctx.arc(16, h/2, 7, 0, Math.PI*2); pctx.stroke();
                pctx.beginPath(); pctx.arc(w-16, h/2, 7, 0, Math.PI*2); pctx.stroke();
            } else if (tool === 'tube') {
                pctx.strokeStyle = 'rgba(120,220,255,0.95)'; pctx.lineWidth = 9;
                pctx.lineJoin = 'round'; pctx.lineCap = 'round';
                pctx.beginPath(); pctx.moveTo(10, h-8); pctx.lineTo(20, 10); pctx.lineTo(34, 13); pctx.lineTo(44, h-9); pctx.stroke();
            } else if (tool === 'erase') {
                pctx.fillStyle = '#c0c8d8'; pctx.fillRect(16, h/2-5, w-32, 10);
                pctx.strokeStyle = '#0f1a33'; pctx.lineWidth = 3;
                pctx.beginPath(); pctx.moveTo(16, 10); pctx.lineTo(w-16, h-10); pctx.stroke();
            }
        }

        _updateToolSelectionUI() {
            for (const entry of this._es.creatorToolButtons) {
                const active = entry.tool === this._es.creatorTool;
                entry.button.style.borderColor = active ? '#00e5ff' : '#2b3c66';
                entry.button.style.background  = active ? 'rgba(0,229,255,0.14)' : 'rgba(8,14,30,0.9)';
            }
        }

        _createSidebar() {
            document.getElementById('creatorToolSidebar')?.remove();
            const sidebar = document.createElement('div');
            sidebar.id = 'creatorToolSidebar';
            Object.assign(sidebar.style, {
                position: 'fixed', right: '12px', top: '58px', zIndex: '70',
                display: 'flex', flexDirection: 'column', gap: '8px', padding: '8px',
                background: 'rgba(8,14,30,0.88)', border: '1px solid #2b3c66', borderRadius: '10px'
            });

            this._es.creatorToolButtons = [];
            const tools = ['launcher','specialLauncher','target','wall','duplicatorWall','dangerWall','orbCatcher','gravityWell','obstacle','portal','tube','erase'];
            for (const tool of tools) {
                const btn = document.createElement('button');
                btn.type = 'button';
                Object.assign(btn.style, { display: 'flex', alignItems: 'center', gap: '8px', padding: '6px 8px', minWidth: '150px', textTransform: 'none' });

                const preview = document.createElement('canvas');
                preview.width = 54; preview.height = 34;
                preview.style.border = '1px solid #2b3c66'; preview.style.borderRadius = '4px';
                this._drawToolPreview(preview, tool);

                const label = document.createElement('span');
                const labelMap = { specialLauncher: 'special launcher', duplicatorWall: 'duplicator wall', orbCatcher: 'orb catcher', gravityWell: 'gravity well' };
                label.textContent = labelMap[tool] || tool;
                label.style.fontSize = '12px';

                btn.appendChild(preview); btn.appendChild(label);
                btn.addEventListener('click', () => {
                    this._es.creatorTool = tool;
                    this._es.creatorPortalStart = null; this._es.creatorDragStart = null; this._es.creatorTubeDraft = null;
                    this._updateToolSelectionUI();
                });
                sidebar.appendChild(btn);
                this._es.creatorToolButtons.push({ tool, button: btn });
            }
            document.body.appendChild(sidebar);
            this._updateToolSelectionUI();
        }
    }

    // ─── App Controller ───────────────────────────────────────────────────────────
    // Wires all modules. Owns mode state. Handles the rAF loop.

    class AppController {
        constructor({ canvas }) {
            this._canvas = canvas;

            const featureRegistry = new FeatureRegistry();
            this._registerBuiltins(featureRegistry);

            const levelService    = new LevelService();
            const urlStateService = new UrlStateService();

            // Parse URL before creating engine so LevelService gets patched first
            const opts = urlStateService.parseStartupOptions(levelService);

            this._modeState = {
                currentMode:     opts.mode,
                currentLevel:    opts.currentLevel,
                inspectorStart:  opts.inspectorStart,
                useLiveSnapshot: opts.useLiveSnapshot
            };

            this._engine = new GameEngine({ featureRegistry, levelService, canvas });
            this._renderer = new GameRenderer({ canvas, featureRegistry });
            this._ui = new UIController();
            this._urlStateService = urlStateService;
            this._levelService    = levelService;
            this._featureRegistry = featureRegistry;

            const modeState = this._modeState;
            const modeDeps = {
                engine:           this._engine,
                renderer:         this._renderer,
                levelService:     this._levelService,
                urlStateService:  this._urlStateService,
                ui:               this._ui,
                modeState,
                canvas
            };

            this._modeControllers = {
                play:      new PlayModeController(modeDeps),
                inspector: new InspectorModeController(modeDeps),
                creator:   new CreatorModeController(modeDeps)
            };
            this._activeModeController = null;
            this._loopId = null;
        }

        _registerBuiltins(registry) {
            registry.register({ type: 'wall', bucket: 'walls', FeatureClass: WallFeature });
            registry.register({
                type: 'duplicatorWall',
                bucket: 'duplicatorWalls',
                FeatureClass: DuplicatorWallFeature,
                drawPreview(feature, { ctx, sx, sy }) {
                    ctx.fillStyle = 'rgba(144, 95, 255, 0.7)';
                    ctx.fillRect(feature.x * sx, feature.y * sy, feature.w * sx, feature.h * sy);
                    ctx.strokeStyle = 'rgba(208, 188, 255, 0.9)';
                    ctx.lineWidth = 1.2;
                    ctx.strokeRect(feature.x * sx, feature.y * sy, feature.w * sx, feature.h * sy);
                }
            });
            registry.register({ type: 'dangerWall', bucket: 'dangerWalls', FeatureClass: DangerWallFeature });
            registry.register({ type: 'obstacle', bucket: 'obstacles', FeatureClass: MovingObstacleFeature });
            registry.register({ type: 'portal', bucket: 'portals', FeatureClass: PortalFeature });
            registry.register({
                type: 'orbCatcher',
                bucket: 'orbCatchers',
                FeatureClass: OrbCatcherFeature,
                drawPreview(feature, { ctx, sx, sy }) {
                    ctx.fillStyle = 'rgba(255, 130, 40, 0.7)';
                    ctx.fillRect(feature.x * sx, feature.y * sy, feature.w * sx, feature.h * sy);
                    ctx.strokeStyle = 'rgba(255, 190, 110, 0.9)';
                    ctx.lineWidth = 1.2;
                    ctx.strokeRect(feature.x * sx, feature.y * sy, feature.w * sx, feature.h * sy);
                }
            });
            registry.register({
                type: 'gravityWell',
                bucket: 'gravityWells',
                FeatureClass: GravityWellFeature,
                create(cfg) {
                    return {
                        ...cfg,
                        x: Number(cfg.x) || 0,
                        y: Number(cfg.y) || 0,
                        radius: Number.isFinite(cfg.radius) ? cfg.radius : 120,
                        strength: Number.isFinite(cfg.strength) ? cfg.strength : 12000
                    };
                },
                drawPreview(feature, { ctx, sx, sy, scale }) {
                    const x = feature.x * sx;
                    const y = feature.y * sy;
                    const r = scale(feature.radius || 120);
                    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
                    grad.addColorStop(0, 'rgba(255, 235, 160, 0.9)');
                    grad.addColorStop(0.22, 'rgba(255, 196, 70, 0.55)');
                    grad.addColorStop(1, 'rgba(255, 196, 70, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffd27a';
                    ctx.beginPath();
                    ctx.arc(x, y, Math.max(2, r * 0.07), 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            registry.register({
                type: 'tube',
                FeatureClass: TubeFeature,
                create(cfg) {
                    const points = (cfg.points || []).map(p => ({ x: Number(p.x) || 0, y: Number(p.y) || 0 }));
                    const geom = computeTubeGeometry(points);
                    return {
                        ...cfg,
                        points,
                        thickness: Number.isFinite(cfg.thickness) ? cfg.thickness : 14,
                        endRadius: Number.isFinite(cfg.endRadius) ? cfg.endRadius : 22,
                        segmentLengths: geom.segmentLengths,
                        totalLength: geom.totalLength
                    };
                },
                drawPreview(feature, { ctx, sx, sy }) {
                    if (!feature.points || feature.points.length < 2) return;
                    const outer = Math.max(2, (feature.thickness || 14) * sx * 0.55);
                    const inner = Math.max(1, outer - 2.5);

                    ctx.strokeStyle = 'rgba(120, 220, 255, 0.9)';
                    ctx.lineWidth = outer;
                    ctx.lineJoin = 'round';
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(feature.points[0].x * sx, feature.points[0].y * sy);
                    for (let i = 1; i < feature.points.length; i++) {
                        ctx.lineTo(feature.points[i].x * sx, feature.points[i].y * sy);
                    }
                    ctx.stroke();

                    ctx.strokeStyle = '#0b1222';
                    ctx.lineWidth = inner;
                    ctx.lineJoin = 'round';
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(feature.points[0].x * sx, feature.points[0].y * sy);
                    for (let i = 1; i < feature.points.length; i++) {
                        ctx.lineTo(feature.points[i].x * sx, feature.points[i].y * sy);
                    }
                    ctx.stroke();

                    const r = (feature.endRadius || 22) * sx;
                    ctx.strokeStyle = 'rgba(180, 245, 255, 0.95)';
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.arc(feature.points[0].x * sx, feature.points[0].y * sy, r, 0, Math.PI * 2);
                    ctx.stroke();
                    const end = feature.points[feature.points.length - 1];
                    ctx.beginPath();
                    ctx.arc(end.x * sx, end.y * sy, r, 0, Math.PI * 2);
                    ctx.stroke();
                }
            });
        }

        bootstrap() {
            const { _engine: engine, _ui: ui, _modeState: ms } = this;

            // Wire engine events
            engine.on('win', () => {
                ui.showMessage('Clear!');
                ui.showNextButton();
            });
            engine.on('lose', ({ message, delay }) => {
                ui.showMessage(message, delay);
                setTimeout(() => this.dispatch({ type: InputActionType.RESET_LEVEL }), delay);
            });
            engine.on('targetHit', ({ score }) => {
                const s = engine.getSnapshot();
                ui.renderHUD({ score, shotCount: s.shotsFired, maxShots: s.activeMaxShots, unlimited: s.activeUnlimitedShots, level: s.currentLevel + 1 });
            });
            engine.on('shotFired', ({ shotsFired }) => {
                const s = engine.getSnapshot();
                ui.renderHUD({ shotCount: shotsFired, maxShots: s.activeMaxShots, unlimited: s.activeUnlimitedShots, score: s.score, level: s.currentLevel + 1 });
            });
            engine.on('levelApplied', ({ levelIdx }) => {
                const s = engine.getSnapshot();
                ui.renderHUD({ level: levelIdx + 1, shotCount: 0, maxShots: s.activeMaxShots, unlimited: s.activeUnlimitedShots, score: s.score });
                ui.hideNextButton();
                ui.hideMessage();
            });

            // Wire UI
            ui.bindInputs(action => this.dispatch(action));
            ui.bindControls({
                onReset: () => this.dispatch({ type: InputActionType.RESET_LEVEL }),
                onNext:  () => this.dispatch({ type: InputActionType.NEXT_LEVEL })
            });
            ui.initModeSwitcher(ms.currentMode, nextMode => this.switchMode(nextMode));

            this.switchMode(ms.currentMode);
            if (ms.currentMode !== 'inspector') this._startLoop();
        }

        dispatch(action) {
            if (!action || !action.type) return;

            // Give active mode controller first crack
            if (this._activeModeController && this._activeModeController.handleAction(action)) return;

            const { _engine: engine } = this;
            const s = engine.getSnapshot();

            if (action.type === InputActionType.CANVAS_MOUSE_MOVE) {
                const pts = this._canvasPoint(action.event);
                engine.updateMousePos(pts.x, pts.y);
                return;
            }
            if (action.type === InputActionType.CANVAS_CLICK) {
                engine.shoot(); return;
            }
            if (action.type === InputActionType.KEY_DOWN) {
                const e = action.event;
                if (!e) return;
                if (e.key === 'r' || e.key === 'R') { this.dispatch({ type: InputActionType.RESET_LEVEL }); return; }
                if (e.key === ' ' && s.phase === 'aiming') { e.preventDefault(); engine.shoot(); return; }
                if (e.key === 'Enter' && s.phase === 'won') { this.dispatch({ type: InputActionType.NEXT_LEVEL }); return; }
                return;
            }
            if (action.type === InputActionType.RESET_LEVEL) { engine.resetLevel(); return; }
            if (action.type === InputActionType.NEXT_LEVEL)  { engine.nextLevel();  return; }
        }

        switchMode(nextMode) {
            if (this._activeModeController) this._activeModeController.exit();
            this._modeState.currentMode = nextMode;
            this._modeState.useLiveSnapshot = false; // consumed on first enter
            this._activeModeController = this._modeControllers[nextMode] || this._modeControllers.play;
            this._activeModeController.enter();
            this._ui.setModeSwitcherActive(nextMode);

            // Inspector has its own static render — no rAF loop
            if (nextMode === 'inspector') {
                if (this._loopId != null) { cancelAnimationFrame(this._loopId); this._loopId = null; }
            } else if (this._loopId == null) {
                this._startLoop();
            }
        }

        _startLoop() {
            const frame = () => {
                this._engine.step();
                const snapshot = this._engine.getSnapshot();
                this._renderer.renderMain(snapshot);

                const overlayConfig = this._activeModeController instanceof CreatorModeController
                    ? this._activeModeController.getOverlayConfig()
                    : null;
                if (overlayConfig) this._renderer.renderOverlay(snapshot, overlayConfig);

                this._loopId = requestAnimationFrame(frame);
            };
            this._loopId = requestAnimationFrame(frame);
        }

        _canvasPoint(event) {
            if (!event) return { x: 0, y: 0 };
            const rect = this._canvas.getBoundingClientRect();
            return { x: event.clientX - rect.left, y: event.clientY - rect.top };
        }
    }

    // ─── Bootstrap ────────────────────────────────────────────────────────────────

    const canvas = document.getElementById('canvas');
    new AppController({ canvas }).bootstrap();

})();
</script>
