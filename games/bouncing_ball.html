    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            color: #fff;
        }
        #gameContainer {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 0 10px;
        }
        #header h1 {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #00e5ff;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
        }
        .stat {
            font-size: 14px;
            color: #aaa;
            letter-spacing: 2px;
        }
        .stat span {
            color: #00e5ff;
            font-weight: bold;
            font-size: 18px;
        }
        canvas {
            border: 1px solid #1a1a3a;
            border-radius: 8px;
            cursor: crosshair;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.1);
        }
        #controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        button {
            background: transparent;
            border: 1px solid #00e5ff;
            color: #00e5ff;
            padding: 8px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s;

        button:hover {
            background: rgba(0, 229, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
        }
        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 12px;
            text-transform: uppercase;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            text-shadow: 0 0 30px rgba(0, 229, 255, 0.8);
            z-index: 10;
        }
        #message.show { opacity: 1; }
        .back-link {
            position: fixed;
            top: 15px;
            left: 15px;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 2px;
            transition: color 0.3s;
        }
        .back-link:hover { color: #00e5ff; }
        .mode-switcher {
            position: fixed;
            top: 12px;

            border-radius: 8px;
            backdrop-filter: blur(4px);
        }
        .mode-switcher button {

            letter-spacing: 1px;
            text-transform: none;
        }
        .mode-switcher button.active {

        }

<body>
    <a href="../index.html" class="back-link">← BACK</a>
    <div id="gameContainer">
        <div id="header">
            <h1>Bouncing Ball</h1>
            <div style="display:flex; gap:30px;">
                <div class="stat">Level <span id="levelNum">1</span></div>
                <div class="stat">Shots <span id="shotCount">0</span> / <span id="maxShots">1</span></div>
                <div class="stat">Score <span id="score">0</span></div>
            </div>
        </div>
        <canvas id="canvas" width="800" height="600"></canvas>
        <div id="controls">
            <button id="resetBtn">Reset</button>
            <button id="nextBtn" style="display:none">Next Level →</button>
        </div>
        <div id="message"></div>
    </div>

<script>
(() => {
    'use strict';

    // ─── Pure utility / geometry helpers (stateless, no side effects) ────────────

    function formatMaxShots(maxShots, unlimited = false) {
        if (unlimited) return '∞';
        return String(Math.max(1, Math.floor(Number(maxShots) || 1)));
    }

    function normalizeSpecialLauncherOrbCount(rawValue) {
        const count = Math.floor(Number(rawValue));
        if (!Number.isFinite(count)) return 1;
        return Math.max(1, Math.min(99, count));
    }

    function parseIntParam(params, key) {
        const raw = params.get(key);
        if (raw === null) return null;
        const value = parseInt(raw, 10);
        return Number.isFinite(value) ? value : null;
    }

    function closestPointOnSegment(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1, dy = y2 - y1;
        const len2 = dx * dx + dy * dy;
        if (len2 < 0.0001) return { x: x1, y: y1, t: 0 };
        const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2));
        return { x: x1 + t * dx, y: y1 + t * dy, t };
    }

    function computeTubeGeometry(points) {
        const segmentLengths = [];
        let totalLength = 0;
        for (let i = 0; i < points.length - 1; i++) {
            const a = points[i], b = points[i + 1];
            const len = Math.hypot(b.x - a.x, b.y - a.y);
            segmentLengths.push(len);
            totalLength += len;
        }
        return { segmentLengths, totalLength };
    }

    function pointAtTubeDistance(feature, distance) {
        const points = feature.points || [];
        const lengths = feature.segmentLengths || [];
        if (points.length === 0) return { x: 0, y: 0, tx: 1, ty: 0 };
        if (points.length === 1) return { x: points[0].x, y: points[0].y, tx: 1, ty: 0 };
        let d = Math.max(0, Math.min(feature.totalLength || 0, distance));
        for (let i = 0; i < lengths.length; i++) {
            const segLen = lengths[i] || 0;
            const a = points[i], b = points[i + 1];
            if (d <= segLen || i === lengths.length - 1) {
                const t = segLen < 0.0001 ? 0 : d / segLen;
                const x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t;
                const tx = segLen < 0.0001 ? 1 : (b.x - a.x) / segLen;
                const ty = segLen < 0.0001 ? 0 : (b.y - a.y) / segLen;
                return { x, y, tx, ty };
            }
            d -= segLen;
        }
        const last = points[points.length - 1];
        return { x: last.x, y: last.y, tx: 1, ty: 0 };
    }

    function rectCircleCollision(circle, rect) {
        const cx = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
        const cy = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
        return Math.hypot(circle.x - cx, circle.y - cy) < circle.radius;
    }

    function lineRectIntersection(x1, y1, x2, y2, rect, radius = 6) {
        const r = radius;
        const rx = rect.x - r, ry = rect.y - r;
        const rw = rect.w + r * 2, rh = rect.h + r * 2;
        const dx = x2 - x1, dy = y2 - y1;
        let tmin = 0, tmax = 1;
        if (Math.abs(dx) > 0.0001) {
            let t1 = (rx - x1) / dx, t2 = (rx + rw - x1) / dx;
            if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
            tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
            if (tmin > tmax) return false;
        } else if (x1 < rx || x1 > rx + rw) return false;
        if (Math.abs(dy) > 0.0001) {
            let t1 = (ry - y1) / dy, t2 = (ry + rh - y1) / dy;
            if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
            tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
            if (tmin > tmax) return false;
        } else if (y1 < ry || y1 > ry + rh) return false;
        return true;
    }

    function resolveRectCollision(circle, rect) {
        const cx = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
        const cy = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
        const dx = circle.x - cx, dy = circle.y - cy;
        const dist = Math.hypot(dx, dy);
        if (dist === 0) {
            // Ball center is fully inside the rect — push out through nearest face
            const leftDist  = circle.x - rect.x,  rightDist = (rect.x + rect.w) - circle.x;
            const topDist   = circle.y - rect.y,  botDist   = (rect.y + rect.h) - circle.y;
            const minDist   = Math.min(leftDist, rightDist, topDist, botDist);
            if (minDist === leftDist)  { circle.x = rect.x - circle.radius; circle.vx = -Math.abs(circle.vx); }
            else if (minDist === rightDist) { circle.x = rect.x + rect.w + circle.radius; circle.vx = Math.abs(circle.vx); }
            else if (minDist === topDist)   { circle.y = rect.y - circle.radius; circle.vy = -Math.abs(circle.vy); }
            else                            { circle.y = rect.y + rect.h + circle.radius; circle.vy = Math.abs(circle.vy); }
            circle.vx *= 0.98; circle.vy *= 0.98;
            return;
        }
        const overlap = circle.radius - dist;
        if (overlap <= 0) return;

        // Detect corner hit: closest point is exactly a rect vertex (both x and y are clamped).
        // Reflecting off the diagonal corner normal can trap the ball — it bounces repeatedly in
        // the corner as gravity pulls it back. Instead, pick the face the ball arrived from based
        // on its dominant velocity axis, giving a clean axis-aligned deflection.
        const onCornerX = (cx === rect.x || cx === rect.x + rect.w);
        const onCornerY = (cy === rect.y || cy === rect.y + rect.h);

        let nx, ny;
        if (onCornerX && onCornerY) {
            if (Math.abs(circle.vx) >= Math.abs(circle.vy)) {
                // Ball travelling more horizontally — bounce off vertical (side) face
                nx = cx === rect.x ? -1 : 1;
                ny = 0;
                circle.x = cx + nx * (circle.radius + 0.1);
            } else {
                // Ball travelling more vertically — bounce off horizontal (top/bottom) face
                nx = 0;
                ny = cy === rect.y ? -1 : 1;
                circle.y = cy + ny * (circle.radius + 0.1);
            }
        } else {
            nx = dx / dist;
            ny = dy / dist;
            circle.x += nx * (overlap + 0.1);
            circle.y += ny * (overlap + 0.1);
        }

        const speedBefore = Math.hypot(circle.vx, circle.vy);
        const dot = circle.vx * nx + circle.vy * ny;
        if (dot < 0) {
            circle.vx -= 2 * dot * nx;
            circle.vy -= 2 * dot * ny;
            circle.vx *= 0.995; circle.vy *= 0.995;
        }
        // Always enforce minimum speed retention after any collision
        const speedAfter = Math.hypot(circle.vx, circle.vy);
        if (speedAfter > 0.0001 && speedAfter < speedBefore * 0.96) {
            const scale = (speedBefore * 0.96) / speedAfter;
            circle.vx *= scale; circle.vy *= scale;
        }
    }

    function resolveOrbCollision(a, b) {
        if (!a || !b || !a.alive || !b.alive) return false;
        let dx = b.x - a.x, dy = b.y - a.y;
        const minDist = (a.radius || 0) + (b.radius || 0);
        let dist = Math.hypot(dx, dy);
        if (dist >= minDist) return false;
        if (dist < 0.0001) { dx = 1; dy = 0; dist = 1; }
        const nx = dx / dist, ny = dy / dist;
        const overlap = minDist - dist;
        a.x -= nx * overlap * 0.5; a.y -= ny * overlap * 0.5;
        b.x += nx * overlap * 0.5; b.y += ny * overlap * 0.5;
        const relVx = b.vx - a.vx, relVy = b.vy - a.vy;
        const velAlongNormal = relVx * nx + relVy * ny;
        if (velAlongNormal > 0) return true;
        const restitution = 0.98;
        const impulse = -((1 + restitution) * velAlongNormal) / 2;
        const impulseX = impulse * nx, impulseY = impulse * ny;
        a.vx -= impulseX; a.vy -= impulseY;
        b.vx += impulseX; b.vy += impulseY;
        return true;
    }

    function segmentIntersectsRect(x1, y1, x2, y2, rect, pad = 0) {
        const rx = rect.x - pad, ry = rect.y - pad;
        const rw = rect.w + pad * 2, rh = rect.h + pad * 2;
        const dx = x2 - x1, dy = y2 - y1;
        let tmin = 0, tmax = 1;
        if (Math.abs(dx) > 0.0001) {
            let t1 = (rx - x1) / dx, t2 = (rx + rw - x1) / dx;
            if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
            tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
            if (tmin > tmax) return false;
        } else if (x1 < rx || x1 > rx + rw) return false;
        if (Math.abs(dy) > 0.0001) {
            let t1 = (ry - y1) / dy, t2 = (ry + rh - y1) / dy;
            if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
            tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
            if (tmin > tmax) return false;
        } else if (y1 < ry || y1 > ry + rh) return false;
        return true;
    }

    function circleIntersectsRect(cx, cy, radius, rect) {
        const px = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
        const py = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
        return Math.hypot(cx - px, cy - py) < radius;
    }

    function rectsOverlap(a, b) {
        return !(a.x + a.w <= b.x || b.x + b.w <= a.x || a.y + a.h <= b.y || b.y + b.h <= a.y);
    }

    function getRectFromPoints(a, b) {
        const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
        const w = Math.max(12, Math.abs(a.x - b.x)), h = Math.max(12, Math.abs(a.y - b.y));
        return { x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h) };
    }

    function featureCenter(f) {
        if (f.type === 'portal') return { x: (f.x1 + f.x2) / 2, y: (f.y1 + f.y2) / 2 };
        if (f.type === 'tube' && Array.isArray(f.points) && f.points.length > 0) {
            let sx = 0, sy = 0;
            for (const p of f.points) { sx += p.x; sy += p.y; }
            return { x: sx / f.points.length, y: sy / f.points.length };
        }
        return { x: f.x + (f.w || 0) / 2, y: f.y + (f.h || 0) / 2 };
    }

    function distancePointToSegment(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1, dy = y2 - y1;
        const len2 = dx * dx + dy * dy;
        if (len2 < 0.0001) return Math.hypot(px - x1, py - y1);
        const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2));
        return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
    }

    // Seeded random for reproducible procedural levels — takes config explicitly
    function seededRandom(seed, lcgMultiplier, lcgModulus) {
        let s = seed;
        const mult = Math.max(2, Math.floor(lcgMultiplier));
        const mod  = Math.max(3, Math.floor(lcgModulus));
        return function() {
            s = (s * mult + 0) % mod;
            return (s - 1) / (mod - 1);
        };
    }

    // ─── Constants ───────────────────────────────────────────────────────────────

    const CREATOR_SNAPSHOT_KEY = 'ricochet_creator_snapshot';

    const InputActionType = {
        CANVAS_MOUSE_MOVE:  'CANVAS_MOUSE_MOVE',
        CANVAS_MOUSE_DOWN:  'CANVAS_MOUSE_DOWN',
        CANVAS_MOUSE_UP:    'CANVAS_MOUSE_UP',
        CANVAS_CLICK:       'CANVAS_CLICK',
        KEY_DOWN:           'KEY_DOWN',
        RESET_BUTTON_CLICK: 'RESET_BUTTON_CLICK',
        NEXT_BUTTON_CLICK:  'NEXT_BUTTON_CLICK',
        RESET_LEVEL:        'RESET_LEVEL',
        NEXT_LEVEL:         'NEXT_LEVEL'
    };

    // ─── Core Game Feature System ────────────────────────────────────────────────

    class GameFeature {
        constructor(config = {}, plugin = null) {
            Object.assign(this, config);
            this.type = config.type || this.type;
            this.plugin = plugin;
            this.bucket = plugin && plugin.bucket ? plugin.bucket : null;
        }

        update() {
        }

        draw() {
        }
    }

    class BallFeature extends GameFeature {
        // Called each substep before movement. Modify ball.vx / ball.vy in place.
        applyForces(ball, dt) {}

        // Called in the multi-pass collision loop.
        // ctx: { pass, prevX, prevY, solidResolved, availableSpawnSlots }
        // Return null (no collision) or:
        // { handled, bounce, solid, kill, killMessage, spawnBalls,
        //   teleported, teleportParticlesAt, passThrough }
        resolveCollision(ball, ctx) { return null; }

        // Called once per substep after collision resolution.
        onBallStep() { return null; }
    }

    class LauncherFeature extends GameFeature {
        onLaunch() {
            return null;
        }
    }

    class ObstacleFeature extends BallFeature {
        collidesWithBall(ballObj) {
            return rectCircleCollision(ballObj, this);
        }

        intersectsBallPath(prevX, prevY, ballObj) {
            return lineRectIntersection(prevX, prevY, ballObj.x, ballObj.y, this, ballObj.radius);
        }

        resolveBallCollision(ballObj) {
            resolveRectCollision(ballObj, this);
        }

        resolveCollision(ball, { pass, prevX, prevY }) {
            const hitO = this.collidesWithBall(ball);
            const hitP = pass === 0 && this.intersectsBallPath(prevX, prevY, ball);
            if (!hitO && !hitP) return null;
            this.resolveBallCollision(ball);
            return { handled: true, bounce: true, solid: true };
        }
    }

    class PluginBackedFeature extends BallFeature {
        update(context) {
            if (this.plugin && this.plugin.update) {
                this.plugin.update(this, context);
            }
        }

        draw(context) {
            if (this.plugin && this.plugin.draw) {
                this.plugin.draw(this, context);
            }
        }

        applyForces(ball, dt) {
            if (this.plugin && this.plugin.applyForces) {
                this.plugin.applyForces(this, ball, dt);
            }
        }

        resolveCollision(ball, ctx) {
            if (this.plugin && this.plugin.resolveCollision) {
                return this.plugin.resolveCollision(this, ball, ctx) || null;
            }
            return null;
        }

        onBallStep(context) {
            if (this.plugin && this.plugin.onBallStep) {
                return this.plugin.onBallStep(this, context) || null;
            }
            return null;
        }

        onLaunch(context) {
            if (this.plugin && this.plugin.onLaunch) {
                return this.plugin.onLaunch(this, context) || null;
            }
            return null;
        }
    }

    class FeatureRegistry {
        constructor() {
            this.plugins = new Map();
        }

        register(plugin) {
            if (!plugin || !plugin.type) return;
            this.plugins.set(plugin.type, {
                FeatureClass: PluginBackedFeature,
                ...plugin
            });
        }

        get(type) {
            return this.plugins.get(type) || null;
        }

        instantiate(cfg, viewport) {
            if (!cfg || !cfg.type) return null;
            const plugin = this.get(cfg.type);
            const source = plugin && plugin.create
                ? plugin.create({ ...cfg }, viewport)
                : { ...cfg };
            const FeatureClass = plugin && plugin.FeatureClass ? plugin.FeatureClass : PluginBackedFeature;
            const instance = new FeatureClass({ ...source, type: cfg.type }, plugin);
            instance.plugin = plugin;
            instance.bucket = plugin && plugin.bucket ? plugin.bucket : null;
            return instance;
        }
    }

    class WallFeature extends ObstacleFeature {
        isSolid() {
            return true;
        }
    }

    class DuplicatorWallFeature extends ObstacleFeature {
        draw({ ctx, time }) {
            const pulse = 0.65 + Math.sin(time * 5.5) * 0.25;
            ctx.fillStyle = `rgba(144, 95, 255, ${0.45 + pulse * 0.2})`;
            ctx.fillRect(this.x, this.y, this.w, this.h);
            ctx.strokeStyle = `rgba(196, 171, 255, ${0.75 + pulse * 0.2})`;
            ctx.lineWidth = 2;
            ctx.strokeRect(this.x, this.y, this.w, this.h);
        }

        resolveCollision(ball, { pass, prevX, prevY, availableSpawnSlots }) {
            const hitO = this.collidesWithBall(ball);
            const hitP = pass === 0 && this.intersectsBallPath(prevX, prevY, ball);
            if (!hitO && !hitP) return null;
            this.resolveBallCollision(ball);
            const result = { handled: true, bounce: true, solid: true, spawnBalls: [] };
            if ((ball.dupCooldown || 0) <= 0 && availableSpawnSlots > 0) {
                const spd = Math.hypot(ball.vx, ball.vy);
                const baseA = Math.atan2(ball.vy, ball.vx);
                const jitter = (Math.random() * 0.24) - 0.12;
                result.spawnBalls.push({
                    x: ball.x, y: ball.y,
                    vx: Math.cos(baseA + jitter) * spd,
                    vy: Math.sin(baseA + jitter) * spd,
                    radius: ball.radius, alive: true,
                    portalCooldown: ball.portalCooldown || 0,
                    bounceCount: ball.bounceCount, slowFrames: 0, dupCooldown: 14
                });
                ball.dupCooldown = 10;
            }
            return result;
        }
    }

    class DangerWallFeature extends ObstacleFeature {
        resolveCollision(ball, { pass, prevX, prevY, solidResolved }) {
            const hitO = this.collidesWithBall(ball);
            const hitP = !solidResolved && pass === 0 && this.intersectsBallPath(prevX, prevY, ball);
            if (!hitO && !hitP) return null;
            return { handled: true, kill: true, killMessage: 'Danger!' };
        }
    }

    class MovingObstacleFeature extends ObstacleFeature {
        resolveCollision(ball, { pass, prevX, prevY, solidResolved }) {
            const hitO = this.collidesWithBall(ball);
            const hitP = !solidResolved && pass === 0 && this.intersectsBallPath(prevX, prevY, ball);
            if (!hitO && !hitP) return null;
            return { handled: true, kill: true, killMessage: 'Danger!' };
        }
    }

    class PortalFeature extends BallFeature {
        resolveCollision(ball, { pass }) {
            if (pass !== 0) return null;
            const inZone =
                Math.hypot(ball.x - this.x1, ball.y - this.y1) < this.radius * 1.5 ||
                Math.hypot(ball.x - this.x2, ball.y - this.y2) < this.radius * 1.5;
            if (!inZone) return null;

            if ((ball.portalCooldown || 0) <= 0) {
                const d1 = Math.hypot(ball.x - this.x1, ball.y - this.y1);
                if (d1 < this.radius) {
                    ball.x = this.x2; ball.y = this.y2;
                    ball.portalCooldown = Math.ceil(this.radius * 2 / 2) + 5;
                    return { handled: true, teleported: true, teleportParticlesAt: { x: this.x2, y: this.y2 } };
                }
                const d2 = Math.hypot(ball.x - this.x2, ball.y - this.y2);
                if (d2 < this.radius) {
                    ball.x = this.x1; ball.y = this.y1;
                    ball.portalCooldown = Math.ceil(this.radius * 2 / 2) + 5;
                    return { handled: true, teleported: true, teleportParticlesAt: { x: this.x1, y: this.y1 } };
                }
            }
            // In extended zone but not at teleport threshold — suppress solid collision
            return { handled: true, passThrough: true };
        }
    }

    class OrbCatcherFeature extends ObstacleFeature {
        draw({ ctx, time }) {
            const pulse = 0.65 + Math.sin(time * 5) * 0.25;
            ctx.fillStyle = `rgba(255, 130, 40, ${0.45 + pulse * 0.2})`;
            ctx.fillRect(this.x, this.y, this.w, this.h);
            ctx.strokeStyle = `rgba(255, 185, 100, ${0.7 + pulse * 0.2})`;
            ctx.lineWidth = 2;
            ctx.strokeRect(this.x, this.y, this.w, this.h);
        }

        resolveCollision(ball, { pass, prevX, prevY }) {
            const hitO = this.collidesWithBall(ball);
            const hitP = pass === 0 && this.intersectsBallPath(prevX, prevY, ball);
            if (!hitO && !hitP) return null;
            return { handled: true, kill: true, killMessage: 'Caught!' };
        }
    }

    class GravityWellFeature extends BallFeature {
        applyForces(ball, dt) {
            const dxg = this.x - ball.x, dyg = this.y - ball.y;
            const distSq = dxg * dxg + dyg * dyg;
            if (distSq < 1) return;
            const dist = Math.sqrt(distSq);
            const radius = Math.max(20, this.radius || 120);
            if (dist > radius) return;
            const influence = 1 - (dist / radius);
            const accelMag = ((this.strength || 12000) * (0.35 + influence * 1.35)) / Math.max(40, distSq);
            ball.vx += (dxg / dist) * accelMag * dt;
            ball.vy += (dyg / dist) * accelMag * dt;
        }

        draw({ ctx, time }) {
            const pulse = 0.7 + Math.sin(time * 3.5) * 0.2;
            const r = this.radius || 120;

            const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
            grad.addColorStop(0, 'rgba(255, 235, 160, 0.85)');
            grad.addColorStop(0.22, 'rgba(255, 196, 70, 0.55)');
            grad.addColorStop(1, 'rgba(255, 196, 70, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = `rgba(255, 214, 120, ${0.45 + pulse * 0.35})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(this.x, this.y, r * (0.45 + pulse * 0.05), 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#ffd27a';
            ctx.beginPath();
            ctx.arc(this.x, this.y, 6 + pulse * 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    class TubeFeature extends BallFeature {
        draw({ ctx }) {
            if (!this.points || this.points.length < 2) return;
            const outer = this.thickness || 14;
            const inner = Math.max(2, outer - 6);

            ctx.strokeStyle = 'rgba(120, 220, 255, 0.85)';
            ctx.lineWidth = outer;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(this.points[0].x, this.points[0].y);
            for (let i = 1; i < this.points.length; i++) {
                ctx.lineTo(this.points[i].x, this.points[i].y);
            }
            ctx.stroke();

            ctx.save();
            ctx.globalCompositeOperation = 'destination-out';
            ctx.strokeStyle = 'rgba(0,0,0,1)';
            ctx.lineWidth = inner;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(this.points[0].x, this.points[0].y);
            for (let i = 1; i < this.points.length; i++) {
                ctx.lineTo(this.points[i].x, this.points[i].y);
            }
            ctx.stroke();
            ctx.restore();

            ctx.strokeStyle = 'rgba(0, 229, 255, 0.45)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(this.points[0].x, this.points[0].y);
            for (let i = 1; i < this.points.length; i++) {
                ctx.lineTo(this.points[i].x, this.points[i].y);
            }
            ctx.stroke();

            const endRadius = this.endRadius || 22;
            ctx.strokeStyle = 'rgba(180, 245, 255, 0.9)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(this.points[0].x, this.points[0].y, endRadius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(this.points[this.points.length - 1].x, this.points[this.points.length - 1].y, endRadius, 0, Math.PI * 2);
            ctx.stroke();
        }

        onBallStep(context) {
            const points = this.points || [];
            if (points.length < 2 || !context.ball || !context.ball.alive) return null;

            if (context.ball.tubeCooldown > 0) {
                context.ball.tubeCooldown--;
            }
            if (context.ball.tubeTransit) return null;

            const start = points[0];
            const end = points[points.length - 1];
            const catchRadius = this.endRadius || 22;
            const dStart = Math.hypot(context.ball.x - start.x, context.ball.y - start.y);
            const dEnd = Math.hypot(context.ball.x - end.x, context.ball.y - end.y);

            if ((context.ball.tubeCooldown || 0) <= 0) {
                const speed = Math.max(2.5, Math.hypot(context.ball.vx, context.ball.vy));
                if (dStart <= catchRadius + context.ball.radius) {
                    context.ball.tubeTransit = { feature: this, distance: 0, dir: 1, speed };
                    return { stopProcessing: true };
                }
                if (dEnd <= catchRadius + context.ball.radius) {
                    context.ball.tubeTransit = { feature: this, distance: this.totalLength, dir: -1, speed };
                    return { stopProcessing: true };
                }
            }

            let best = { dist: Infinity, point: null, a: null, b: null };
            for (let i = 0; i < points.length - 1; i++) {
                const a = points[i];
                const b = points[i + 1];
                const cp = closestPointOnSegment(context.ball.x, context.ball.y, a.x, a.y, b.x, b.y);
                const dist = Math.hypot(context.ball.x - cp.x, context.ball.y - cp.y);
                if (dist < best.dist) best = { dist, point: cp, a, b };
            }

            const nearHole = dStart <= catchRadius || dEnd <= catchRadius;
            const tubeHalf = (this.thickness || 14) * 0.5;

            if (!nearHole && best.point && best.dist < tubeHalf + context.ball.radius) {
                let nx = context.ball.x - best.point.x;
                let ny = context.ball.y - best.point.y;
                let nlen = Math.hypot(nx, ny);
                if (nlen < 0.0001 && best.a && best.b) {
                    const sx = best.b.x - best.a.x;
                    const sy = best.b.y - best.a.y;
                    nx = -sy;
                    ny = sx;
                    nlen = Math.hypot(nx, ny);
                }
                if (nlen > 0.0001) {
                    nx /= nlen;
                    ny /= nlen;
                    const overlap = tubeHalf + context.ball.radius - best.dist + 0.2;
                    context.ball.x += nx * overlap;
                    context.ball.y += ny * overlap;

                    const dot = context.ball.vx * nx + context.ball.vy * ny;
                    context.ball.vx -= 2 * dot * nx;
                    context.ball.vy -= 2 * dot * ny;
                    context.ball.vx *= 0.98;
                    context.ball.vy *= 0.98;
                    if (context.spawnBounceParticles) {
                        context.spawnBounceParticles(context.ball.x, context.ball.y);
                    }
                }
            }

            return null;
        }
    }

        constructor(proceduralConfigPatch = {}) {
            this._cfg = {
                seedMultiplier: 7919,
                seedOffset:     1337,
                lcgMultiplier:  16807,
                lcgModulus:     2147483647,
                ...proceduralConfigPatch
            };
        }

        getProceduralConfig() { return { ...this._cfg }; }

        applyProceduralConfigPatch(patch) {
            if (patch.seedMultiplier != null) this._cfg.seedMultiplier = patch.seedMultiplier;
            if (patch.seedOffset     != null) this._cfg.seedOffset     = patch.seedOffset;
            if (patch.lcgMultiplier  != null) this._cfg.lcgMultiplier  = Math.max(2, Math.floor(patch.lcgMultiplier));
            if (patch.lcgModulus     != null) this._cfg.lcgModulus     = Math.max(3, Math.floor(patch.lcgModulus));
        }

        getLevel(idx) {
            const levelDef = idx < LevelService._levels.length ? LevelService._levels[idx] : this._generateLevel(idx);
            const resolved = this._resolveLevelDefinition(levelDef, idx);
            return this.normalizeLevelConfig(resolved);
        }

        getLevelSnapshot(idx) {
            const level = this.getLevel(idx);
            return {
                launcher: { ...level.launcher },
                maxShots: level.maxShots,
                targets:  level.targets.map(t => ({ ...t })),
                features: level.features.map(f => ({ ...f }))
            };
        }

        normalizeLevelConfig(level) {
            const normalized = {
                launcher: {
                    ...(level.launcher || { x: 100, y: 500 }),
                    special:   !!(level.launcher && level.launcher.special),
                    orbCount:  normalizeSpecialLauncherOrbCount(level && level.launcher ? level.launcher.orbCount : 1)
                },
                maxShots: Number.isFinite(level.maxShots) ? level.maxShots : 2,
                targets:  (level.targets || []).map(t => ({ ...t })),
                features: []
            };
            if (Array.isArray(level.features) && level.features.length > 0) {
                normalized.features = level.features.map(f => ({ ...f }));
            } else {
                normalized.features = this._buildLegacyFeatures(level);
            }
            return normalized;
        }

        _computeSeed(idx) {
            return idx * this._cfg.seedMultiplier + this._cfg.seedOffset;
        }

        _resolveLevelDefinition(levelDef, fallbackIdx) {
            if (!levelDef || typeof levelDef !== 'object') return this._generateLevel(fallbackIdx);
            const proceduralLevel = levelDef.proceduralLevel ?? levelDef.seedLevel;
            if (Number.isFinite(proceduralLevel)) {
                return this._generateLevel(Math.max(0, Math.floor(proceduralLevel) - 1));
            }
            const proceduralIdx = levelDef.proceduralIdx ?? levelDef.seedIdx;
            if (Number.isFinite(proceduralIdx)) {
                return this._generateLevel(Math.max(0, Math.floor(proceduralIdx)));
            }
            return levelDef;
        }

        _buildLegacyFeatures(level) {
            const out = [];
            for (const w of (level.walls         || [])) out.push({ type: 'wall',          ...w });
            for (const dw of (level.duplicatorWalls || [])) out.push({ type: 'duplicatorWall', ...dw });
            for (const dw of (level.dangerWalls   || [])) out.push({ type: 'dangerWall',    ...dw });
            for (const o of (level.obstacles      || [])) out.push({ type: 'obstacle',      ...o });
            for (const p of (level.portals        || [])) out.push({ type: 'portal',        ...p });
            for (const c of (level.orbCatchers    || [])) out.push({ type: 'orbCatcher',    ...c });
            for (const g of (level.gravityWells   || [])) out.push({ type: 'gravityWell',   ...g });
            return out;
        }

        _generateLevel(idx) {
            const rng = seededRandom(this._computeSeed(idx), this._cfg.lcgMultiplier, this._cfg.lcgModulus);
            const difficulty = Math.min(idx - 10, 40);
            const margin = 60;
            const W = 800, H = 600;

            const launcherPositions = [
                { x: margin, y: H - margin }, { x: W / 2, y: H - margin },
                { x: margin, y: H / 2 },      { x: W - margin, y: H - margin },
                { x: W / 2, y: margin }
            ];
            const lp = launcherPositions[Math.floor(rng() * launcherPositions.length)];

            const numTargets = Math.min(1 + Math.floor(rng() * (1 + difficulty / 10)), 4);
            const targs = [];
            for (let i = 0; i < numTargets; i++) {
                let tx, ty, tooClose, attempts = 0;
                do {
                    tx = margin + rng() * (W - margin * 2);
                    ty = margin + rng() * (H - margin * 2);
                    tooClose = Math.hypot(tx - lp.x, ty - lp.y) < 150;
                    for (const t of targs) { if (Math.hypot(tx - t.x, ty - t.y) < 80) tooClose = true; }
                    attempts++;
                } while (tooClose && attempts < 50);
                targs.push({ x: tx, y: ty, radius: Math.max(12, 22 - difficulty * 0.2) });
            }

            const numWalls = 1 + Math.floor(rng() * Math.min(2 + difficulty / 8, 5));
            const wls = [];
            for (let i = 0; i < numWalls; i++) {
                const vertical = rng() > 0.35;
                let wx, wy, ww, wh;
                if (vertical) { ww = 24; wh = 120 + rng() * 280; wx = margin + rng() * (W - margin * 2 - ww); wy = rng() * (H - wh); }
                else           { ww = 120 + rng() * 280; wh = 24; wx = rng() * (W - ww); wy = margin + rng() * (H - margin * 2 - wh); }
                wls.push({ x: Math.round(wx), y: Math.round(wy), w: Math.round(ww), h: Math.round(wh) });
            }

            const numDanger = difficulty >= 3 ? Math.min(Math.floor(rng() * (1 + difficulty / 10)), 3) : 0;
            const dws = [];
            for (let i = 0; i < numDanger; i++) {
                const vertical = rng() > 0.4;
                let dx, dy, dw, dh;
                if (vertical) { dw = 20; dh = 80 + rng() * 180; dx = margin + rng() * (W - margin * 2 - dw); dy = margin + rng() * (H - margin * 2 - dh); }
                else          { dw = 80 + rng() * 180; dh = 20; dx = margin + rng() * (W - margin * 2 - dw); dy = margin + rng() * (H - margin * 2 - dh); }
                dws.push({ x: Math.round(dx), y: Math.round(dy), w: Math.round(dw), h: Math.round(dh) });
            }

            const numObs = difficulty >= 2 ? Math.min(Math.floor(rng() * (1 + difficulty / 12)), 2) : 0;
            const obs = [];
            for (let i = 0; i < numObs; i++) {
                const ox = margin + rng() * (W - margin * 2 - 30);
                const oy = margin + rng() * (H / 2);
                const spd = 1 + rng() * 1.5;
                obs.push({ x: Math.round(ox), y: Math.round(oy), w: 28, h: 80 + rng() * 60, vy: rng() > 0.5 ? spd : -spd, minY: margin, maxY: H - margin - 80 });
            }

            const numPortals = difficulty >= 5 ? Math.min(Math.floor(rng() * 2) + 1, 2) : (rng() > 0.7 ? 1 : 0);
            const pts = [];
            for (let i = 0; i < numPortals; i++) {
                pts.push({ x1: margin + rng() * (W / 2 - margin * 2), y1: margin + rng() * (H - margin * 2), x2: W / 2 + rng() * (W / 2 - margin), y2: margin + rng() * (H - margin * 2), radius: 22 });
            }

            this._enforceStraightShotChallenge(lp, targs, wls, dws, rng, difficulty, margin, W, H);

            return {
                launcher: lp,
                maxShots: Math.max(1, numTargets + 1 - Math.floor(difficulty / 15)),
                targets: targs, walls: wls, dangerWalls: dws, obstacles: obs, portals: pts
            };
        }

        _enforceStraightShotChallenge(launcherPos, targetsList, wallsList, dangerList, rng, difficulty, margin, W, H) {
            if (difficulty < 2) return;
            const blockers = () => [...wallsList, ...dangerList];
            const pad = 10;
            for (const t of targetsList) {
                const openLine = !blockers().some(b => segmentIntersectsRect(launcherPos.x, launcherPos.y, t.x, t.y, b, pad));
                if (!openLine) continue;
                const dx = t.x - launcherPos.x, dy = t.y - launcherPos.y;
                const needsVertical = Math.abs(dx) >= Math.abs(dy);
                let inserted = false;
                for (let attempt = 0; attempt < 8; attempt++) {
                    const progress = 0.35 + rng() * 0.3;
                    const jitter   = (rng() - 0.5) * 110;
                    const mx = launcherPos.x + dx * progress;
                    const my = launcherPos.y + dy * progress;
                    let candidate;
                    if (needsVertical) {
                        const h = 130 + rng() * 170;
                        candidate = { x: Math.round(Math.max(margin, Math.min(W - margin - 24, mx + jitter - 12))), y: Math.round(Math.max(margin, Math.min(H - margin - h, my - h / 2))), w: 24, h: Math.round(h) };
                    } else {
                        const w = 130 + rng() * 170;
                        candidate = { x: Math.round(Math.max(margin, Math.min(W - margin - w, mx - w / 2))), y: Math.round(Math.max(margin, Math.min(H - margin - 24, my + jitter - 12))), w: Math.round(w), h: 24 };
                    }
                    if (circleIntersectsRect(launcherPos.x, launcherPos.y, 26, candidate)) continue;
                    if (circleIntersectsRect(t.x, t.y, t.radius + 12, candidate)) continue;
                    if (blockers().some(b => rectsOverlap(candidate, b))) continue;
                    if (segmentIntersectsRect(launcherPos.x, launcherPos.y, t.x, t.y, candidate, 8)) {
                        wallsList.push(candidate);
                        inserted = true;
                        break;
                    }
                }
                if (!inserted) {
                    wallsList.push({
                        x: Math.round(Math.max(margin, Math.min(W - margin - 24, launcherPos.x + dx * 0.5 - 12))),
                        y: Math.round(Math.max(margin, Math.min(H - margin - 120, launcherPos.y + dy * 0.5 - 60))),
                        w: 24, h: 120
                    });
                }
            }
        }
    }


    // ─── URL State Service ────────────────────────────────────────────────────────

    class UrlStateService {
        parseStartupOptions(levelService) {
            const params = new URLSearchParams(window.location.search);
            const mode = params.get('mode') || 'play';

            const patch = {};
            const sm = parseIntParam(params, 'seedMultiplier');
            const so = parseIntParam(params, 'seedOffset');
            const lm = parseIntParam(params, 'lcgMultiplier');
            const lmod = parseIntParam(params, 'lcgModulus');
            if (sm  != null) patch.seedMultiplier = sm;
            if (so  != null) patch.seedOffset     = so;
            if (lm  != null) patch.lcgMultiplier  = lm;
            if (lmod!= null) patch.lcgModulus      = lmod;
            if (Object.keys(patch).length > 0) levelService.applyProceduralConfigPatch(patch);

            const levelParam = parseIntParam(params, 'level');
            const currentLevel = levelParam != null ? Math.max(0, levelParam - 1) : 0;
            const inspectorStart = Math.max(1, parseIntParam(params, 'start') ?? 1);
            const useLiveSnapshot = params.get('snapshot') === '1';

            return { mode, currentLevel, inspectorStart, useLiveSnapshot };
        }

        navigateToMode(mode, { currentLevel = 0, activeMode = 'play', engine = null } = {}) {
            const params = new URLSearchParams();
            if (mode !== 'play') params.set('mode', mode);
            if (mode === 'creator' && activeMode !== 'creator' && engine) {
                const snapshot = engine.getSceneLevelConfig();
                try {
                    sessionStorage.setItem(CREATOR_SNAPSHOT_KEY, JSON.stringify(snapshot));
                    params.set('snapshot', '1');
                } catch { /* ignore */ }
            }
            if (mode === 'play' || mode === 'inspector') {
                params.set('level', String(currentLevel + 1));
                if (engine) {
                    const cfg = engine.getProceduralConfig();
                    this._appendProceduralParams(params, cfg);
                }
            }
            window.location.search = params.toString();
        }

        navigateToLevel(levelNumber, proceduralConfig) {
            const params = new URLSearchParams();
            params.set('level', String(levelNumber));
            if (proceduralConfig) this._appendProceduralParams(params, proceduralConfig);
            window.location.search = params.toString();
        }

        _appendProceduralParams(params, cfg) {
            if (!cfg) return;
            if (cfg.seedMultiplier != null) params.set('seedMultiplier', String(cfg.seedMultiplier));
            if (cfg.seedOffset     != null) params.set('seedOffset',     String(cfg.seedOffset));
            if (cfg.lcgMultiplier  != null) params.set('lcgMultiplier',  String(cfg.lcgMultiplier));
            if (cfg.lcgModulus     != null) params.set('lcgModulus',     String(cfg.lcgModulus));
        }
    }

    // ─── Game Engine ──────────────────────────────────────────────────────────────
    // Owns all simulation state. Emits events. Never touches the DOM or canvas.

    class GameEngine {
        constructor({ featureRegistry, levelService, canvas }) {
            this._featureRegistry = featureRegistry;
            this._levelService    = levelService;
            this._canvas          = canvas;
            this._state           = this._createInitialState();
            this._handlers        = {};
        }

        // ── Public API ──────────────────────────────────────────────────────────

        getProceduralConfig() { return this._levelService.getProceduralConfig(); }
        getLevel(idx)         { return this._levelService.getLevel(idx); }
        getLevelSnapshot(idx) { return this._levelService.getLevelSnapshot(idx); }

        /** Live reference to simulation state — read-only from outside. */
        getSnapshot() { return this._state; }

        /** Current scene exported as a reproducible LevelConfig. */
        getSceneLevelConfig() {
            const s = this._state;
            return {
                launcher: { ...s.launcher },
                maxShots: s.activeMaxShots,
                targets:  s.targets.map(t => ({ x: t.x, y: t.y, radius: t.radius })),
                features: s.levelFeatures.map(f => {
                    const copy = { ...f };
                    delete copy.plugin;
                    return copy;
                })
            };
        }

        applyLevelConfig(level, phase = 'aiming') {
            const s = this._state;
            s.launcher = { ...level.launcher };
            s.ball     = null;
            s.balls    = [];
            s.trail    = [];
            s.particles = [];
            s.shotsFired  = 0;
            s.bounceCount = 0;
            s.hitTargets  = 0;
            s.phase = phase;

            s.targets       = level.targets.map(t => ({ ...t, hit: false, alpha: 1, pulsePhase: Math.random() * Math.PI * 2 }));
            s.totalTargets  = s.targets.length;
            s.levelFeatures = this._instantiateLevelFeatures(level.features);
            this._syncFeatureBuckets();

            s.activeMaxShots      = level.maxShots;
            s.activeUnlimitedShots = !!(level.launcher && level.launcher.special);
            this._emit('levelApplied', { levelIdx: s.currentLevel, progress: { shotsFired: 0, score: s.score } });
        }

        loadLevel(idx) {
            const level = this._levelService.getLevel(idx);
            this._state.currentLevel = idx;
            this.applyLevelConfig(level, 'aiming');
        }

        resetLevel() {
            this.loadLevel(this._state.currentLevel);
        }

        nextLevel() {
            this._state.currentLevel++;
            this.loadLevel(this._state.currentLevel);
        }

        getCurrentLevelIdx() { return this._state.currentLevel; }

        updateMousePos(x, y) {
            this._state.mousePos.x = x;
            this._state.mousePos.y = y;
        }

        shoot() {
            const s = this._state;
            const isSpecial = !!(s.launcher && s.launcher.special);
            if (!isSpecial) {
                if (s.shotsFired >= s.activeMaxShots) return;
                if (s.phase !== 'aiming') return;
            } else {
                if (s.phase === 'won' || s.phase === 'lost' || s.phase === 'creator') return;
            }

            const dx = s.mousePos.x - s.launcher.x;
            const dy = s.mousePos.y - s.launcher.y;
            let angle = Math.atan2(dy, dx);
            let power = Math.min(Math.hypot(dx, dy) / 20, 18);
            let orbCount = isSpecial ? normalizeSpecialLauncherOrbCount(s.launcher.orbCount) : 1;

            const launchContext = {
                angle, power, orbCount,
                launcher: s.launcher,
                mousePos: s.mousePos,
                state: s.phase,
                cancel: false
            };
            this._runFeatureLaunchHooks(launchContext);
            if (launchContext.cancel) return;

            angle  = launchContext.angle;
            power  = launchContext.power;
            orbCount = isSpecial ? normalizeSpecialLauncherOrbCount(launchContext.orbCount) : 1;

            const newBalls = [];
            const spreadStep = orbCount <= 1 ? 0 : Math.min(0.06, 0.7 / (orbCount - 1));
            for (let i = 0; i < orbCount; i++) {
                const ao = orbCount <= 1 ? 0 : (i - (orbCount - 1) / 2) * spreadStep;
                newBalls.push({
                    x: s.launcher.x, y: s.launcher.y,
                    vx: Math.cos(angle + ao) * power,
                    vy: Math.sin(angle + ao) * power,
                    radius: 6, alive: true,
                    portalCooldown: 0, bounceCount: 0, slowFrames: 0
                });
            }

            if (isSpecial) {
                s.balls.push(...newBalls);
            } else {
                s.balls = newBalls;
                s.trail = [];
            }
            s.ball = s.balls[0] || null;
            s.shotsFired++;
            s.phase = 'shooting';
            this._emit('shotFired', { shotsFired: s.shotsFired });
        }

        /** One simulation tick — call once per animation frame. */
        step() {
            const s = this._state;
            if (s.phase === 'inspector') return;
            if (s.phase !== 'creator') this._updateObstacles();
            if (s.phase === 'shooting') this._updateBall();
            this._updateParticles();
        }

        on(eventName, handler) {
            if (!this._handlers[eventName]) this._handlers[eventName] = [];
            this._handlers[eventName].push(handler);
        }

        // ── Private ─────────────────────────────────────────────────────────────

        _emit(eventName, data) {
            for (const h of (this._handlers[eventName] || [])) h(data);
        }

        _createInitialState() {
            return {
                phase: 'aiming',
                launcher: { x: 100, y: 500, special: false, orbCount: 1 },
                ball: null, balls: [], trail: [], particles: [],
                targets: [], levelFeatures: [],
                walls: [], duplicatorWalls: [], dangerWalls: [],
                obstacles: [], portals: [], orbCatchers: [], gravityWells: [], tubes: [],
                mousePos: { x: 400, y: 300 },
                shotsFired: 0, bounceCount: 0, hitTargets: 0, totalTargets: 0,
                activeMaxShots: 1, activeUnlimitedShots: false,
                score: 0, maxBounces: 500, currentLevel: 0,
            };
        }

        _instantiateLevelFeatures(featuresConfig) {
            const instances = [];
            for (const cfg of featuresConfig) {
                const instance = this._featureRegistry.instantiate(cfg, { width: this._canvas.width, height: this._canvas.height });
                if (instance) instances.push(instance);
            }
            return instances;
        }

        _syncFeatureBuckets() {
            const s = this._state;
            s.walls = []; s.duplicatorWalls = []; s.dangerWalls = [];
            s.obstacles = []; s.portals = []; s.orbCatchers = [];
            s.gravityWells = []; s.tubes = [];
            for (const f of s.levelFeatures) {
                if (f instanceof WallFeature)            s.walls.push(f);
                else if (f instanceof DuplicatorWallFeature) s.duplicatorWalls.push(f);
                else if (f instanceof DangerWallFeature) s.dangerWalls.push(f);
                else if (f instanceof MovingObstacleFeature) s.obstacles.push(f);
                else if (f instanceof PortalFeature)     s.portals.push(f);
                else if (f instanceof OrbCatcherFeature) s.orbCatchers.push(f);
                else if (f instanceof GravityWellFeature) s.gravityWells.push(f);
                else if (f instanceof TubeFeature)       s.tubes.push(f);
            }
        }

        _runFeatureLaunchHooks(ctx) {
            for (const f of this._state.levelFeatures) {
                if (typeof f.onLaunch === 'function') f.onLaunch(ctx);
                if (ctx.cancel) return;
            }
        }

        _runFeatureBallStepHooks(ctx) {
            for (const f of this._state.levelFeatures) {
                if (typeof f.onBallStep === 'function') {
                    const result = f.onBallStep(ctx);
                    if (result && result.kill) return result;
                }
            }
            return null;
        }

        _runFeatureUpdateHooks() {
            for (const f of this._state.levelFeatures) {
                if (typeof f.update === 'function') f.update();
            }
        }

        _updateObstacles() {
            for (const o of this._state.obstacles) {
                if (o.vy === 0) continue;
                o.y += o.vy;
                if (o.y <= o.minY || o.y + o.h >= o.maxY + o.h) o.vy *= -1;
            }
            this._runFeatureUpdateHooks();
        }

        _updateParticles() {
            const ps = this._state.particles;
            for (let i = ps.length - 1; i >= 0; i--) {
                const p = ps[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.96; p.vy *= 0.96;
                p.life -= p.decay;
                if (p.life <= 0) ps.splice(i, 1);
            }
        }

        _spawnBounceParticles(x, y) {
            for (let i = 0; i < 6; i++) {
                this._state.particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4,
                    life: 1, decay: 0.03 + Math.random() * 0.02,
                    color: '#00e5ff', size: 2 + Math.random() * 2
                });
            }
        }

        _spawnTargetParticles(x, y) {
            for (let i = 0; i < 20; i++) {
                const a = (Math.PI * 2 * i) / 20;
                const spd = 2 + Math.random() * 4;
                this._state.particles.push({
                    x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
                    life: 1, decay: 0.015 + Math.random() * 0.01,
                    color: `hsl(${Math.random() * 60 + 150}, 100%, 60%)`,
                    size: 3 + Math.random() * 3
                });
            }
        }

        _spawnPortalParticles(x, y) {
            for (let i = 0; i < 12; i++) {
                const a = (Math.PI * 2 * i) / 12;
                this._state.particles.push({
                    x, y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3,
                    life: 1, decay: 0.03, color: '#ff00ff', size: 3
                });
            }
        }

        _spawnDangerParticles(x, y) {
            for (let i = 0; i < 25; i++) {
                const a = (Math.PI * 2 * i) / 25;
                const spd = 2 + Math.random() * 5;
                this._state.particles.push({
                    x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
                    life: 1, decay: 0.02 + Math.random() * 0.01,
                    color: `hsl(${Math.random() * 20}, 100%, ${50 + Math.random() * 20}%)`,
                    size: 3 + Math.random() * 4
                });
            }
        }

        _handleLose(ballX, ballY, message, delay) {
            this._state.phase = 'lost';
            this._spawnDangerParticles(ballX, ballY);
            this._emit('lose', { message: message || 'Danger!', delay: delay || 1500 });
        }

        _advanceBallTubeTransit(ball, dt) {
            const tube = ball.tubeTransit.tube;
            ball.tubeTransit.distance += ball.tubeTransit.speed * dt;
            const total = tube.totalLength || 0;
            if (ball.tubeTransit.distance >= total) {
                const exit = tube.points[tube.points.length - 1];
                ball.x = exit.x; ball.y = exit.y;
                ball.vx = ball.tubeTransit.exitVx;
                ball.vy = ball.tubeTransit.exitVy;
                ball.tubeTransit = null;
            } else {
                const pos = pointAtTubeDistance(tube, ball.tubeTransit.distance);
                ball.x = pos.x; ball.y = pos.y;
            }
        }

        _updateBall() {
            const s = this._state;
            if (!s.balls.length) return;
            const cW = this._canvas.width, cH = this._canvas.height;
            const maxStep = 2;
            const spawnedBalls = [];
            const maxActiveOrbs = 600;

            for (let i = 0; i < s.balls.length; i++) {
                const b = s.balls[i];
                if (!b.alive || s.phase === 'won' || s.phase === 'lost') continue;

                const speed = Math.hypot(b.vx, b.vy);
                const substeps = Math.max(1, Math.ceil(speed / maxStep));
                const dt = 1 / substeps;
                const gravityPerStep = 0.04 * dt;

                for (let step = 0; step < substeps; step++) {
                    if (!b.alive || s.phase === 'won' || s.phase === 'lost') break;

                    if (b.tubeTransit) { this._advanceBallTubeTransit(b, dt); continue; }
                    if (b.dupCooldown > 0) b.dupCooldown--;
                    if (b.portalCooldown > 0) b.portalCooldown--;

                    const prevX = b.x, prevY = b.y;

                    // 1. Feature forces (gravity wells, etc.)
                    for (const f of s.levelFeatures) {
                        if (f.applyForces) f.applyForces(b, dt);
                    }

                    // 2. Physics step
                    b.vy += gravityPerStep;
                    b.x += b.vx * dt;
                    b.y += b.vy * dt;

                    // 3. Canvas edge bouncing (engine-owned)
                    if (b.x - b.radius <= 0) {
                        b.x = b.radius; b.vx = Math.abs(b.vx) * 0.98;
                        b.bounceCount++; this._spawnBounceParticles(b.x, b.y);
                    } else if (b.x + b.radius >= cW) {
                        b.x = cW - b.radius; b.vx = -Math.abs(b.vx) * 0.98;
                        b.bounceCount++; this._spawnBounceParticles(b.x, b.y);
                    }
                    if (b.y - b.radius <= 0) {
                        b.y = b.radius; b.vy = Math.abs(b.vy) * 0.98;
                        b.bounceCount++; this._spawnBounceParticles(b.x, b.y);
                    } else if (b.y + b.radius >= cH) {
                        b.y = cH - b.radius; b.vy = -Math.abs(b.vy) * 0.98;
                        b.bounceCount++; this._spawnBounceParticles(b.x, b.y);
                    }

                    // 4. Feature collision passes
                    const collCtx = {
                        prevX, prevY,
                        solidResolved: false,
                        availableSpawnSlots: maxActiveOrbs - s.balls.length - spawnedBalls.length
                    };
                    let solidBounced = false;
                    let teleported = false;
                    let collisionDone = false;

                    for (let pass = 0; pass < 3 && !collisionDone; pass++) {
                        collCtx.pass = pass;
                        let anyHandled = false;
                        for (const f of s.levelFeatures) {
                            const r = f.resolveCollision ? f.resolveCollision(b, collCtx) : null;
                            if (!r || !r.handled) continue;
                            anyHandled = true;
                            if (r.spawnBalls && r.spawnBalls.length) spawnedBalls.push(...r.spawnBalls);
                            if (r.bounce) { solidBounced = true; this._spawnBounceParticles(b.x, b.y); }
                            if (r.solid) collCtx.solidResolved = true;
                            if (r.kill) {
                                b.alive = false;
                                this._handleLose(b.x, b.y, r.killMessage || 'Danger!', 1500);
                                collisionDone = true; break;
                            }
                            if (r.teleported) {
                                this._spawnPortalParticles(r.teleportParticlesAt.x, r.teleportParticlesAt.y);
                                teleported = true; collisionDone = true; break;
                            }
                            if (r.passThrough) { collisionDone = true; break; }
                        }
                        if (!anyHandled) break;
                    }

                    if (!b.alive || s.phase === 'lost') break;
                    if (solidBounced) b.bounceCount++;
                    if (teleported) continue; // skip rest of substep

                    // 5. Orb-to-orb (engine physics)
                    if (!b.tubeTransit) {
                        for (let j = i + 1; j < s.balls.length; j++) {
                            const ob = s.balls[j];
                            if (!ob.alive || ob.tubeTransit) continue;
                            if (resolveOrbCollision(b, ob)) {
                                b.bounceCount++; ob.bounceCount++;
                                this._spawnBounceParticles((b.x + ob.x) * 0.5, (b.y + ob.y) * 0.5);
                            }
                        }
                    }

                    // 6. onBallStep hooks (TubeFeature, etc.)
                    const pluginResult = this._runFeatureBallStepHooks({
                        ball: b, prevX, prevY, state: s.phase,
                        canvas: this._canvas, particles: s.particles,
                        spawnBounceParticles: (x, y) => this._spawnBounceParticles(x, y)
                    });
                    if (pluginResult && pluginResult.kill) {
                        b.alive = false;
                        this._handleLose(b.x, b.y, pluginResult.message || 'Danger!', 1500);
                        break;
                    }
                    if (!b.alive || s.phase === 'lost') break;

                    // 7. Target collision (engine win condition)
                    for (const t of s.targets) {
                        if (t.hit) continue;
                        if (Math.hypot(b.x - t.x, b.y - t.y) < t.radius + b.radius) {
                            t.hit = true;
                            s.hitTargets++;
                            s.score += 100 + b.bounceCount * 10;
                            this._spawnTargetParticles(t.x, t.y);
                            this._emit('targetHit', { score: s.score });

                            if (s.hitTargets === s.totalTargets) {
                                s.phase = 'won';
                                b.alive = false;
                                this._emit('win', {});
                            }
                        }
                    }
                }

                if (!b.alive || s.phase === 'won' || s.phase === 'lost') continue;

                s.trail.push({ x: b.x, y: b.y, age: 0 });
                if (s.trail.length > 200) s.trail.shift();

                const finalSpeed = Math.hypot(b.vx, b.vy);
                if (finalSpeed < 0.3) {
                    b.slowFrames = (b.slowFrames || 0) + 1;
                } else {
                    b.slowFrames = 0;
                }
                if (b.bounceCount > s.maxBounces || (b.slowFrames || 0) > 45) {
                    b.alive = false;
                }
            }

            if (spawnedBalls.length > 0) s.balls.push(...spawnedBalls);
            s.balls = s.balls.filter(x => x.alive);
            s.ball  = s.balls.length > 0 ? s.balls[0] : null;

            if (s.phase === 'won' || s.phase === 'lost') return;

            if (s.balls.length === 0 && s.hitTargets < s.totalTargets) {
                if (!s.activeUnlimitedShots && s.shotsFired >= s.activeMaxShots) {
                    s.phase = 'lost';
                    this._emit('lose', { message: 'Try Again', delay: 2000 });
                } else {
                    s.phase = 'aiming';
                }
            }
        }
    }

    // ─── Game Renderer ────────────────────────────────────────────────────────────
    // Pure read-from-snapshot renderer. Never owns state.

    class GameRenderer {
        constructor({ canvas, featureRegistry }) {
            this._canvas = canvas;
            this._ctx    = canvas.getContext('2d');
            this._featureRegistry = featureRegistry;
        }

        renderMain(snapshot) {
            const ctx = this._ctx;
            const cW  = this._canvas.width;
            const cH  = this._canvas.height;
            const s   = snapshot;

            ctx.clearRect(0, 0, cW, cH);

            // Background grid
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x < cW; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cH); ctx.stroke();
            }
            for (let y = 0; y < cH; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cW, y); ctx.stroke();
            }

            const time = Date.now() / 1000;

            // Walls
            for (const w of s.walls) {
                ctx.fillStyle = '#2a2a5a';
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.strokeStyle = '#4a4a8a'; ctx.lineWidth = 1;
                ctx.strokeRect(w.x, w.y, w.w, w.h);
            }

            // Moving obstacles
            for (const o of s.obstacles) {
                ctx.fillStyle = '#5a2a2a'; ctx.fillRect(o.x, o.y, o.w, o.h);
                ctx.strokeStyle = '#ff4444'; ctx.lineWidth = 1.5;
                ctx.strokeRect(o.x, o.y, o.w, o.h);
            }

            // Danger walls
            for (const dw of s.dangerWalls) {
                const pulse = 0.7 + Math.sin(time * 4) * 0.3;
                ctx.fillStyle = `rgba(200, 20, 20, ${0.6 + pulse * 0.2})`;
                ctx.fillRect(dw.x, dw.y, dw.w, dw.h);
                ctx.strokeStyle = `rgba(255, 60, 60, ${pulse})`; ctx.lineWidth = 2;
                ctx.strokeRect(dw.x, dw.y, dw.w, dw.h);
                ctx.shadowColor = '#ff2222'; ctx.shadowBlur = 12 * pulse;
                ctx.strokeRect(dw.x, dw.y, dw.w, dw.h);
                ctx.shadowBlur = 0;
            }

            // Portals
            for (const p of s.portals) {
                p.phase = (p.phase || 0) + 0.05;
                this._drawPortal(ctx, p.x1, p.y1, p.radius, p.phase);
                this._drawPortal(ctx, p.x2, p.y2, p.radius, p.phase + Math.PI);
                ctx.strokeStyle = 'rgba(255, 0, 255, 0.1)'; ctx.lineWidth = 1;
                ctx.setLineDash([5, 10]);
                ctx.beginPath(); ctx.moveTo(p.x1, p.y1); ctx.lineTo(p.x2, p.y2); ctx.stroke();
                ctx.setLineDash([]);
            }

            // Feature draw hooks
            const drawPortalBound = (x, y, radius, phase) => this._drawPortal(ctx, x, y, radius, phase);
            for (const f of s.levelFeatures) {
                if (typeof f.draw === 'function') f.draw({ ctx, time, drawPortal: drawPortalBound });
            }

            // Targets
            for (const t of s.targets) {
                if (t.hit) continue;
                t.pulsePhase += 0.04;
                const pulse = 1 + Math.sin(t.pulsePhase) * 0.15;
                const r = t.radius * pulse;

                const grad = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, r * 2.5);
                grad.addColorStop(0, 'rgba(0, 229, 255, 0.3)');
                grad.addColorStop(1, 'rgba(0, 229, 255, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(t.x, t.y, r * 2.5, 0, Math.PI * 2); ctx.fill();

                ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI * 2); ctx.stroke();
                ctx.fillStyle = '#00e5ff';
                ctx.beginPath(); ctx.arc(t.x, t.y, 3, 0, Math.PI * 2); ctx.fill();

                ctx.strokeStyle = 'rgba(0, 229, 255, 0.4)'; ctx.lineWidth = 1;
                const ch = r + 5;
                ctx.beginPath(); ctx.moveTo(t.x - ch, t.y); ctx.lineTo(t.x - r + 5, t.y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(t.x + r - 5, t.y); ctx.lineTo(t.x + ch, t.y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(t.x, t.y - ch); ctx.lineTo(t.x, t.y - r + 5); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(t.x, t.y + r - 5); ctx.lineTo(t.x, t.y + ch); ctx.stroke();
            }

            // Launcher
            const lpulse = 1 + Math.sin(time * 3) * 0.1;
            const lcolor = s.launcher.special ? '#ffe083' : '#00e5ff';
            ctx.fillStyle = lcolor;
            ctx.beginPath(); ctx.arc(s.launcher.x, s.launcher.y, 8 * lpulse, 0, Math.PI * 2); ctx.fill();

            const lgrad = ctx.createRadialGradient(s.launcher.x, s.launcher.y, 0, s.launcher.x, s.launcher.y, 20);
            if (s.launcher.special) {
                lgrad.addColorStop(0, 'rgba(255, 224, 131, 0.4)');
                lgrad.addColorStop(1, 'rgba(255, 224, 131, 0)');
            } else {
                lgrad.addColorStop(0, 'rgba(0, 229, 255, 0.3)');
                lgrad.addColorStop(1, 'rgba(0, 229, 255, 0)');
            }
            ctx.fillStyle = lgrad;
            ctx.beginPath(); ctx.arc(s.launcher.x, s.launcher.y, 20, 0, Math.PI * 2); ctx.fill();

            if (s.launcher.special) {
                ctx.strokeStyle = 'rgba(255, 224, 131, 0.95)'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(s.launcher.x, s.launcher.y, 13, 0, Math.PI * 2); ctx.stroke();
            }

            // Aim line
            if (s.phase === 'aiming') {
                const dx = s.mousePos.x - s.launcher.x;
                const dy = s.mousePos.y - s.launcher.y;
                const angle = Math.atan2(dy, dx);
                const power = Math.min(Math.hypot(dx, dy) / 20, 18);
                const len   = power * 12;

                ctx.strokeStyle = 'rgba(0, 229, 255, 0.4)'; ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 8]);
                ctx.beginPath();
                ctx.moveTo(s.launcher.x, s.launcher.y);
                ctx.lineTo(s.launcher.x + Math.cos(angle) * len, s.launcher.y + Math.sin(angle) * len);
                ctx.stroke();
                ctx.setLineDash([]);

                const powerPct = power / 18;
                const bW = 60, bH = 4;
                const bX = s.launcher.x - bW / 2, bY = s.launcher.y + 25;
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.fillRect(bX, bY, bW, bH);
                ctx.fillStyle = powerPct < 0.5 ? '#00e5ff' : powerPct < 0.8 ? '#ffaa00' : '#ff4444';
                ctx.fillRect(bX, bY, bW * powerPct, bH);

                this._drawTrajectoryPreview(ctx, s, angle, power);
            }

            // Trail
            for (const t of s.trail) {
                t.age++;
                const alpha = Math.max(0, 1 - t.age / 60);
                const sz = Math.max(0.5, 3 * alpha);
                ctx.fillStyle = `rgba(0, 229, 255, ${alpha * 0.6})`;
                ctx.beginPath(); ctx.arc(t.x, t.y, sz, 0, Math.PI * 2); ctx.fill();
            }

            // Balls
            for (const b of s.balls) {
                if (!b.alive) continue;
                const bg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.radius * 3);
                bg.addColorStop(0, 'rgba(0, 229, 255, 0.5)');
                bg.addColorStop(1, 'rgba(0, 229, 255, 0)');
                ctx.fillStyle = bg;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius * 3, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
            }

            // Particles
            for (const p of s.particles) {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        renderPreview(levelConfig, previewConfig = {}, targetCanvas) {
            if (!targetCanvas || !levelConfig) return;
            const levelNumber = previewConfig.levelNumber || 1;
            const pctx = targetCanvas.getContext('2d');
            const pw = targetCanvas.width, ph = targetCanvas.height;
            const sx = pw / this._canvas.width, sy = ph / this._canvas.height;
            const scale = (v) => v * sx;

            pctx.clearRect(0, 0, pw, ph);
            pctx.fillStyle = '#0b1222'; pctx.fillRect(0, 0, pw, ph);
            pctx.strokeStyle = 'rgba(255,255,255,0.05)';
            for (let gx = 0; gx < pw; gx += 20) {
                pctx.beginPath(); pctx.moveTo(gx, 0); pctx.lineTo(gx, ph); pctx.stroke();
            }
            for (let gy = 0; gy < ph; gy += 20) {
                pctx.beginPath(); pctx.moveTo(0, gy); pctx.lineTo(pw, gy); pctx.stroke();
            }

            for (const f of (levelConfig.features || [])) {
                const plugin = this._featureRegistry.plugins ? this._featureRegistry.plugins.get(f.type) : null;
                if (plugin && plugin.drawPreview) {
                    plugin.drawPreview(f, { ctx: pctx, sx, sy, scale, width: pw, height: ph });
                    continue;
                }
                if (f.type === 'wall') {
                    pctx.fillStyle = '#2a2a5a'; pctx.fillRect(f.x*sx, f.y*sy, f.w*sx, f.h*sy);
                } else if (f.type === 'dangerWall') {
                    pctx.fillStyle = 'rgba(220, 45, 45, 0.8)'; pctx.fillRect(f.x*sx, f.y*sy, f.w*sx, f.h*sy);
                } else if (f.type === 'obstacle') {
                    pctx.fillStyle = '#7f3838'; pctx.fillRect(f.x*sx, f.y*sy, f.w*sx, f.h*sy);
                } else if (f.type === 'portal') {
                    pctx.strokeStyle = 'rgba(255, 80, 255, 0.4)'; pctx.lineWidth = 1;
                    pctx.beginPath(); pctx.moveTo(f.x1*sx, f.y1*sy); pctx.lineTo(f.x2*sx, f.y2*sy); pctx.stroke();
                    pctx.beginPath(); pctx.arc(f.x1*sx, f.y1*sy, scale(f.radius), 0, Math.PI*2); pctx.stroke();
                    pctx.beginPath(); pctx.arc(f.x2*sx, f.y2*sy, scale(f.radius), 0, Math.PI*2); pctx.stroke();
                }
            }

            const lc = levelConfig.launcher;
            pctx.fillStyle = lc && lc.special ? '#ffe083' : '#00e5ff';
            pctx.beginPath(); pctx.arc(lc.x*sx, lc.y*sy, 4, 0, Math.PI*2); pctx.fill();

            pctx.strokeStyle = '#00e5ff'; pctx.lineWidth = 1.1;
            for (const t of (levelConfig.targets || [])) {
                pctx.beginPath(); pctx.arc(t.x*sx, t.y*sy, scale(t.radius), 0, Math.PI*2); pctx.stroke();
            }

            pctx.fillStyle = 'rgba(255,255,255,0.7)';
            pctx.font = '11px sans-serif';
            pctx.fillText(`#${levelNumber}`, 6, 14);
        }

        renderOverlay(snapshot, overlayConfig = {}) {
            const ctx = this._ctx;
            if (!overlayConfig || overlayConfig.type !== 'creatorGuides') return;
            const es = overlayConfig.editorState;
            if (!es) return;
            const s = snapshot;

            if (es.creatorDragStart) {
                const rect = getRectFromPoints(es.creatorDragStart, s.mousePos);
                ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
                ctx.setLineDash([]);
            }

            if (es.creatorPortalStart) {
                ctx.strokeStyle = 'rgba(255, 0, 255, 0.7)'; ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(es.creatorPortalStart.x, es.creatorPortalStart.y);
                ctx.lineTo(s.mousePos.x, s.mousePos.y);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(es.creatorPortalStart.x, es.creatorPortalStart.y, 5, 0, Math.PI * 2);
                ctx.stroke();
            }

            if (es.creatorTubeDraft && es.creatorTubeDraft.length > 0) {
                ctx.strokeStyle = 'rgba(120, 220, 255, 0.85)'; ctx.lineWidth = 14;
                ctx.lineJoin = 'round'; ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(es.creatorTubeDraft[0].x, es.creatorTubeDraft[0].y);
                for (let i = 1; i < es.creatorTubeDraft.length; i++) {
                    ctx.lineTo(es.creatorTubeDraft[i].x, es.creatorTubeDraft[i].y);
                }
                ctx.stroke();
            }

            ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(8, 8, 420, 60);
            ctx.fillStyle = '#cfefff'; ctx.font = '13px sans-serif';
            ctx.fillText(`Creator • Tool: ${es.creatorTool} • Targets: ${es.creatorLevel.targets.length} • Features: ${es.creatorLevel.features.length}`, 16, 30);
            ctx.fillText('Click place. Drag wall/dupe/danger/catcher/obstacle/tube. Gravity well is click-place. Portal uses 2 clicks.', 16, 50);
        }

        _drawPortal(ctx, x, y, radius, phase) {
            for (let i = 0; i < 3; i++) {
                const r = radius - i * 4;
                if (r <= 0) continue;
                ctx.strokeStyle = `rgba(255, 0, 255, ${0.6 - i * 0.15})`; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(x, y, r, phase + i * 0.5, phase + i * 0.5 + Math.PI * 1.5); ctx.stroke();
            }
            const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
            grad.addColorStop(0, 'rgba(255, 0, 255, 0.3)');
            grad.addColorStop(1, 'rgba(255, 0, 255, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
        }

        _drawTrajectoryPreview(ctx, snapshot, angle, power) {
            const cW = this._canvas.width, cH = this._canvas.height;
            let px = snapshot.launcher.x, py = snapshot.launcher.y;
            let pvx = Math.cos(angle) * power, pvy = Math.sin(angle) * power;
            ctx.fillStyle = 'rgba(0, 229, 255, 0.15)';
            for (let i = 0; i < 40; i++) {
                pvy += 0.04; px += pvx; py += pvy;
                if (px <= 0 || px >= cW) pvx *= -1;
                if (py <= 0 || py >= cH) pvy *= -1;
                px = Math.max(0, Math.min(cW, px));
                py = Math.max(0, Math.min(cH, py));
                if (i % 2 === 0) {
                    ctx.beginPath(); ctx.arc(px, py, 1.5, 0, Math.PI * 2); ctx.fill();
                }
            }
        }
    }

    // ─── UI Controller ────────────────────────────────────────────────────────────
    // Owns DOM element references. Dispatches InputActions. Never mutates engine state.

    class UIController {
        constructor() {
            this._els = {
                levelNum:  document.getElementById('levelNum'),
                shotCount: document.getElementById('shotCount'),
                maxShots:  document.getElementById('maxShots'),
                score:     document.getElementById('score'),
                nextBtn:   document.getElementById('nextBtn'),
                resetBtn:  document.getElementById('resetBtn'),
                message:   document.getElementById('message'),
                header:    document.querySelector('#header h1'),
                controls:  document.getElementById('controls'),
