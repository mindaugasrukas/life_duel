    // Seeded random for reproducible procedural levels
    function seededRandom(seed) {
        let s = seed;
        const mult = Math.max(2, Math.floor(proceduralConfig.lcgMultiplier));
        const mod = Math.max(3, Math.floor(proceduralConfig.lcgModulus));
        return function() {
            s = (s * mult + 0) % mod;
            return (s - 1) / (mod - 1);
        };
    }

    function segmentIntersectsRect(x1, y1, x2, y2, rect, pad = 0) {
        const rx = rect.x - pad;
        const ry = rect.y - pad;
        const rw = rect.w + pad * 2;
        const rh = rect.h + pad * 2;

        const dx = x2 - x1;
        const dy = y2 - y1;

        let tmin = 0;
        let tmax = 1;

        if (Math.abs(dx) > 0.0001) {
            let t1 = (rx - x1) / dx;
            let t2 = (rx + rw - x1) / dx;
            if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
            tmin = Math.max(tmin, t1);
            tmax = Math.min(tmax, t2);
            if (tmin > tmax) return false;
        } else if (x1 < rx || x1 > rx + rw) {
            return false;
        }

        if (Math.abs(dy) > 0.0001) {
            let t1 = (ry - y1) / dy;
            let t2 = (ry + rh - y1) / dy;
            if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
            tmin = Math.max(tmin, t1);
            tmax = Math.min(tmax, t2);
            if (tmin > tmax) return false;
        } else if (y1 < ry || y1 > ry + rh) {
            return false;
        }

        return true;
    }

    function circleIntersectsRect(cx, cy, radius, rect) {
        const px = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
        const py = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
        return Math.hypot(cx - px, cy - py) < radius;
    }

    function rectsOverlap(a, b) {
        return !(a.x + a.w <= b.x || b.x + b.w <= a.x || a.y + a.h <= b.y || b.y + b.h <= a.y);
    }

    function enforceStraightShotChallenge(launcherPos, targetsList, wallsList, dangerList, rng, difficulty, margin, W, H) {
        if (difficulty < 2) return;

        const blockers = () => [...wallsList, ...dangerList];
        const pad = 10;

        for (const t of targetsList) {
            const openLine = !blockers().some(b => segmentIntersectsRect(launcherPos.x, launcherPos.y, t.x, t.y, b, pad));
            if (!openLine) continue;

            const dx = t.x - launcherPos.x;
            const dy = t.y - launcherPos.y;
            const needsVertical = Math.abs(dx) >= Math.abs(dy);

            let inserted = false;
            for (let attempt = 0; attempt < 8; attempt++) {
                const progress = 0.35 + rng() * 0.3;
                const jitter = (rng() - 0.5) * 110;
                const mx = launcherPos.x + dx * progress;
                const my = launcherPos.y + dy * progress;

                let candidate;
                if (needsVertical) {
                    const h = 130 + rng() * 170;
                    candidate = {
                        x: Math.round(Math.max(margin, Math.min(W - margin - 24, mx + jitter - 12))),
                        y: Math.round(Math.max(margin, Math.min(H - margin - h, my - h / 2))),
                        w: 24,
                        h: Math.round(h)
                    };
                } else {
                    const w = 130 + rng() * 170;
                    candidate = {
                        x: Math.round(Math.max(margin, Math.min(W - margin - w, mx - w / 2))),
                        y: Math.round(Math.max(margin, Math.min(H - margin - 24, my + jitter - 12))),
                        w: Math.round(w),
                        h: 24
                    };
                }

                const hitsLauncher = circleIntersectsRect(launcherPos.x, launcherPos.y, 26, candidate);
                const hitsTarget = circleIntersectsRect(t.x, t.y, t.radius + 12, candidate);
                if (hitsLauncher || hitsTarget) continue;

                if (blockers().some(b => rectsOverlap(candidate, b))) {
                    continue;
                }

                if (segmentIntersectsRect(launcherPos.x, launcherPos.y, t.x, t.y, candidate, 8)) {
                    wallsList.push(candidate);
                    inserted = true;
                    break;
                }
            }

            if (!inserted) {
                const fallback = {
                    x: Math.round(Math.max(margin, Math.min(W - margin - 24, launcherPos.x + dx * 0.5 - 12))),
                    y: Math.round(Math.max(margin, Math.min(H - margin - 120, launcherPos.y + dy * 0.5 - 60))),
                    w: 24,
                    h: 120
                };
                wallsList.push(fallback);
            }
        }
    }

    function generateLevel(idx) {
        const rng = seededRandom(computeProceduralSeed(idx));
        const difficulty = Math.min(idx - 10, 40); // 0-40 difficulty scale
        const margin = 60;
        const W = canvas.width;
        const H = canvas.height;

        // Launcher position — varies
        const launcherPositions = [
            { x: margin, y: H - margin },
            { x: W / 2, y: H - margin },
            { x: margin, y: H / 2 },
            { x: W - margin, y: H - margin },
            { x: W / 2, y: margin }
        ];
        const lp = launcherPositions[Math.floor(rng() * launcherPositions.length)];

        // Targets: 1-4 based on difficulty
        const numTargets = Math.min(1 + Math.floor(rng() * (1 + difficulty / 10)), 4);
        const targs = [];
        for (let i = 0; i < numTargets; i++) {
            let tx, ty, tooClose;
            let attempts = 0;
            do {
                tx = margin + rng() * (W - margin * 2);
                ty = margin + rng() * (H - margin * 2);
                tooClose = Math.hypot(tx - lp.x, ty - lp.y) < 150;
                for (const t of targs) {
                    if (Math.hypot(tx - t.x, ty - t.y) < 80) tooClose = true;
                }
                attempts++;
            } while (tooClose && attempts < 50);
            targs.push({ x: tx, y: ty, radius: Math.max(12, 22 - difficulty * 0.2) });
        }

        // Walls: 1-5
        const numWalls = 1 + Math.floor(rng() * Math.min(2 + difficulty / 8, 5));
        const wls = [];
        for (let i = 0; i < numWalls; i++) {
            const vertical = rng() > 0.35;
            let wx, wy, ww, wh;
            if (vertical) {
                ww = 24;
                wh = 120 + rng() * 280;
                wx = margin + rng() * (W - margin * 2 - ww);
                wy = rng() * (H - wh);
            } else {
                ww = 120 + rng() * 280;
                wh = 24;
                wx = rng() * (W - ww);
                wy = margin + rng() * (H - margin * 2 - wh);
            }
            wls.push({ x: Math.round(wx), y: Math.round(wy), w: Math.round(ww), h: Math.round(wh) });
        }

        // Danger walls: 0-3 based on difficulty (introduced at difficulty 3+)
        const numDanger = difficulty >= 3 ? Math.min(Math.floor(rng() * (1 + difficulty / 10)), 3) : 0;
        const dws = [];
        for (let i = 0; i < numDanger; i++) {
            const vertical = rng() > 0.4;
            let dx, dy, dw, dh;
            if (vertical) {
                dw = 20;
                dh = 80 + rng() * 180;
                dx = margin + rng() * (W - margin * 2 - dw);
                dy = margin + rng() * (H - margin * 2 - dh);
            } else {
                dw = 80 + rng() * 180;
                dh = 20;
                dx = margin + rng() * (W - margin * 2 - dw);
                dy = margin + rng() * (H - margin * 2 - dh);
            }
            dws.push({ x: Math.round(dx), y: Math.round(dy), w: Math.round(dw), h: Math.round(dh) });
        }

        // Moving obstacles: 0-2 based on difficulty
        const numObs = difficulty >= 2 ? Math.min(Math.floor(rng() * (1 + difficulty / 12)), 2) : 0;
        const obs = [];
        for (let i = 0; i < numObs; i++) {
            const ox = margin + rng() * (W - margin * 2 - 30);
            const oy = margin + rng() * (H / 2);
            const spd = 1 + rng() * 1.5;
            obs.push({ x: Math.round(ox), y: Math.round(oy), w: 28, h: 80 + rng() * 60, vy: rng() > 0.5 ? spd : -spd, minY: margin, maxY: H - margin - 80 });
        }

        // Portals: 0-2 (introduced at difficulty 5+)
        const numPortals = difficulty >= 5 ? Math.min(Math.floor(rng() * 2) + 1, 2) : (rng() > 0.7 ? 1 : 0);
        const pts = [];
        for (let i = 0; i < numPortals; i++) {
            pts.push({
                x1: margin + rng() * (W / 2 - margin * 2),
                y1: margin + rng() * (H - margin * 2),
                x2: W / 2 + rng() * (W / 2 - margin),
                y2: margin + rng() * (H - margin * 2),
                radius: 22
            });
        }

        enforceStraightShotChallenge(lp, targs, wls, dws, rng, difficulty, margin, W, H);

        // Shots: more for more targets, fewer as difficulty rises
        const maxShots = Math.max(1, numTargets + 1 - Math.floor(difficulty / 15));

        return {
            launcher: lp,
            maxShots,
            targets: targs,
            walls: wls,
            dangerWalls: dws,
            obstacles: obs,
            portals: pts
        };
    }

    class LevelManager {
        getLevel(idx) {
            const levelDef = idx < levels.length ? levels[idx] : generateLevel(idx);
            const resolved = resolveLevelDefinition(levelDef, idx);
            return normalizeLevelConfig(resolved);
        }

        applyLevelConfig(level, mode = 'aiming') {
            launcher = { ...level.launcher };
            ball = null;
            balls = [];
            trail = [];
            particles = [];
            shotsFired = 0;
            bounceCount = 0;
            hitTargets = 0;
            state = mode;

            targets = level.targets.map(t => ({ ...t, hit: false, alpha: 1, pulsePhase: Math.random() * Math.PI * 2 }));
            totalTargets = targets.length;
            levelFeatures = instantiateLevelFeatures(level.features);
            syncFeatureBucketsFromLevelFeatures();

            activeMaxShots = level.maxShots;
            activeUnlimitedShots = !!(level.launcher && level.launcher.special);
            ui.hideNextButton();
            ui.setShotCount(0);
            ui.setMaxShots(activeMaxShots, activeUnlimitedShots);
            ui.setScore(score);
        }

        loadLevel(idx) {
            const level = this.getLevel(idx);
            this.applyLevelConfig(level, 'aiming');
            ui.setLevel(idx + 1);
        }

        resetLevel() {
            if (creatorMode && creatorLevel) {
                refreshCreatorScene(state === 'creator' ? 'creator' : 'aiming');
                return;
            }
            this.loadLevel(currentLevel);
        }

        nextLevel() {
            if (creatorMode) return;
            currentLevel++;
            this.loadLevel(currentLevel);
        }
    }

    const levelManager = new LevelManager();

    function getLevel(idx) {
        return levelManager.getLevel(idx);
    }

    function applyLevelConfig(level, mode = 'aiming') {
        levelManager.applyLevelConfig(level, mode);
    }

    function loadLevel(idx) {
        levelManager.loadLevel(idx);
    }

    function resetLevel() {
        levelManager.resetLevel();
    }

    function nextLevel() {
        levelManager.nextLevel();
    }

    function showMessage(text, duration = 2000) {
        ui.showMessage(text, duration);
    }

    // Shooting
    function shoot() {
        const isSpecialLauncher = !!(launcher && launcher.special);
        if (!isSpecialLauncher) {
            if (shotsFired >= activeMaxShots) return;
            if (state !== 'aiming') return;
        } else {
            if (state === 'won' || state === 'lost' || state === 'creator') return;
        }

        const dx = mousePos.x - launcher.x;
        const dy = mousePos.y - launcher.y;
        let angle = Math.atan2(dy, dx);
        let power = Math.min(Math.hypot(dx, dy) / 20, 18);
        let orbCount = isSpecialLauncher ? normalizeSpecialLauncherOrbCount(launcher.orbCount) : 1;

        const launchContext = { angle, power, orbCount, launcher, mousePos, state, gameState, cancel: false };
        const launchResult = runFeatureLaunchHooks(launchContext);
        if (launchResult && launchResult.cancel) return;

        angle = launchContext.angle;
        power = launchContext.power;
        orbCount = isSpecialLauncher ? normalizeSpecialLauncherOrbCount(launchContext.orbCount) : 1;

        const newBalls = [];
        const spreadStep = orbCount <= 1 ? 0 : Math.min(0.06, 0.7 / (orbCount - 1));
        for (let i = 0; i < orbCount; i++) {
            const angleOffset = orbCount <= 1 ? 0 : (i - (orbCount - 1) / 2) * spreadStep;
            const shotAngle = angle + angleOffset;
            newBalls.push({
                x: launcher.x,
                y: launcher.y,
                vx: Math.cos(shotAngle) * power,
                vy: Math.sin(shotAngle) * power,
                radius: 6,
                alive: true,
                portalCooldown: 0,
                bounceCount: 0
            });
        }

        if (isSpecialLauncher) {
            balls.push(...newBalls);
        } else {
            balls = newBalls;
            trail = [];
        }
        ball = balls[0] || null;

        shotsFired++;
        state = 'shooting';
        ui.setShotCount(shotsFired);
    }

    // Physics update — uses substeps to prevent tunneling through thin walls
    function updateBall() {
        if (!balls.length) return;

        const maxStep = 2; // never move more than 2px per substep — prevents tunneling through thin walls
        const spawnedBalls = [];
        const maxActiveOrbs = 600;

        for (let i = 0; i < balls.length; i++) {
            const currentBall = balls[i];
            if (!currentBall.alive || state === 'won' || state === 'lost') continue;

            // Determine how many substeps we need based on ball speed
            const speed = Math.hypot(currentBall.vx, currentBall.vy);
            const substeps = Math.max(1, Math.ceil(speed / maxStep));
            const dt = 1 / substeps;

            // Apply gravity once per frame (split across substeps)
            const gravityPerStep = 0.04 * dt;

            for (let step = 0; step < substeps; step++) {
                if (!currentBall.alive || state === 'won' || state === 'lost') break;

                if (currentBall.tubeTransit) {
                    advanceBallTubeTransit(currentBall, dt);
                    continue;
                }

                if (currentBall.dupCooldown > 0) {
                    currentBall.dupCooldown--;
                }

                const prevX = currentBall.x;
                const prevY = currentBall.y;

                // Gravity wells pull orbs like stars
                for (const gw of gravityWells) {
                    const dxg = gw.x - currentBall.x;
                    const dyg = gw.y - currentBall.y;
                    const distSq = dxg * dxg + dyg * dyg;
                    if (distSq < 1) continue;
                    const dist = Math.sqrt(distSq);
                    const radius = Math.max(20, gw.radius || 120);
                    if (dist > radius) continue;
                    const influence = 1 - (dist / radius);
                    const accelMag = ((gw.strength || 12000) * (0.35 + influence * 1.35)) / Math.max(40, distSq);
                    currentBall.vx += (dxg / dist) * accelMag * dt;
                    currentBall.vy += (dyg / dist) * accelMag * dt;
                }

                currentBall.vy += gravityPerStep;
                currentBall.x += currentBall.vx * dt;
                currentBall.y += currentBall.vy * dt;

                // Bounce off canvas edges
                if (currentBall.x - currentBall.radius <= 0) {
                    currentBall.x = currentBall.radius;
                    currentBall.vx = Math.abs(currentBall.vx) * 0.98;
                    currentBall.bounceCount++;
                    spawnBounceParticles(currentBall.x, currentBall.y);
                } else if (currentBall.x + currentBall.radius >= canvas.width) {
                    currentBall.x = canvas.width - currentBall.radius;
                    currentBall.vx = -Math.abs(currentBall.vx) * 0.98;
                    currentBall.bounceCount++;
                    spawnBounceParticles(currentBall.x, currentBall.y);
                }
                if (currentBall.y - currentBall.radius <= 0) {
                    currentBall.y = currentBall.radius;
                    currentBall.vy = Math.abs(currentBall.vy) * 0.98;
                    currentBall.bounceCount++;
                    spawnBounceParticles(currentBall.x, currentBall.y);
                } else if (currentBall.y + currentBall.radius >= canvas.height) {
                    currentBall.y = canvas.height - currentBall.radius;
                    currentBall.vy = -Math.abs(currentBall.vy) * 0.98;
                    currentBall.bounceCount++;
                    spawnBounceParticles(currentBall.x, currentBall.y);
                }

                // Portal check FIRST — so walls near portals don't steal the ball
                if (currentBall.portalCooldown > 0) {
                    currentBall.portalCooldown--;
                } else {
                    let teleported = false;
                    for (const p of portals) {
                        const d1 = Math.hypot(currentBall.x - p.x1, currentBall.y - p.y1);
                        if (d1 < p.radius) {
                            currentBall.x = p.x2;
                            currentBall.y = p.y2;
                            currentBall.portalCooldown = Math.ceil(p.radius * 2 / maxStep) + 5;
                            spawnPortalParticles(p.x2, p.y2);
                            teleported = true;
                            break;
                        }
                        const d2 = Math.hypot(currentBall.x - p.x2, currentBall.y - p.y2);
                        if (d2 < p.radius) {
                            currentBall.x = p.x1;
                            currentBall.y = p.y1;
                            currentBall.portalCooldown = Math.ceil(p.radius * 2 / maxStep) + 5;
                            spawnPortalParticles(p.x1, p.y1);
                            teleported = true;
                            break;
                        }
                    }
                    if (teleported) continue; // skip wall checks this substep after teleporting
                }

                // Check if ball is inside a portal zone — skip wall collision there
                let inPortalZone = false;
                for (const p of portals) {
                    if (Math.hypot(currentBall.x - p.x1, currentBall.y - p.y1) < p.radius * 1.5 ||
                        Math.hypot(currentBall.x - p.x2, currentBall.y - p.y2) < p.radius * 1.5) {
                        inPortalZone = true;
                        break;
                    }
                }

                // Bounce off walls (may need multiple passes to resolve overlaps)
                if (!inPortalZone) {
                    for (let pass = 0; pass < 3; pass++) {
                        let collided = false;
                        for (const w of walls) {
                            if (w.collidesWithBall(currentBall)) {
                                w.resolveBallCollision(currentBall);
                                currentBall.bounceCount++;
                                spawnBounceParticles(currentBall.x, currentBall.y);
                                collided = true;
                            }
                        }
                        if (!collided) break;
                    }
                }

                // Duplicator walls: bounce and spawn a cloned orb on hit
                if (!inPortalZone) {
                    for (let pass = 0; pass < 2; pass++) {
                        let collided = false;
                        for (const w of duplicatorWalls) {
                            if (w.collidesWithBall(currentBall)) {
                                w.resolveBallCollision(currentBall);
                                currentBall.bounceCount++;
                                spawnBounceParticles(currentBall.x, currentBall.y);
                                collided = true;

                                if ((currentBall.dupCooldown || 0) <= 0 && balls.length + spawnedBalls.length < maxActiveOrbs) {
                                    const speed = Math.hypot(currentBall.vx, currentBall.vy);
                                    const baseAngle = Math.atan2(currentBall.vy, currentBall.vx);
                                    const jitter = (Math.random() * 0.24) - 0.12;
                                    const cloneAngle = baseAngle + jitter;
                                    const clone = {
                                        x: currentBall.x,
                                        y: currentBall.y,
                                        vx: Math.cos(cloneAngle) * speed,
                                        vy: Math.sin(cloneAngle) * speed,
                                        radius: currentBall.radius,
                                        alive: true,
                                        portalCooldown: currentBall.portalCooldown || 0,
                                        bounceCount: currentBall.bounceCount,
                                        dupCooldown: 14
                                    };
                                    currentBall.dupCooldown = 10;
                                    spawnedBalls.push(clone);
                                }
                            }
                        }
                        if (!collided) break;
                    }
                }

                // Orb-to-orb collisions
                if (!currentBall.tubeTransit) {
                    for (let j = i + 1; j < balls.length; j++) {
                        const otherBall = balls[j];
                        if (!otherBall.alive || otherBall.tubeTransit) continue;
                        if (resolveOrbCollision(currentBall, otherBall)) {
                            currentBall.bounceCount++;
                            otherBall.bounceCount++;
                            spawnBounceParticles((currentBall.x + otherBall.x) * 0.5, (currentBall.y + otherBall.y) * 0.5);
                        }
                    }
                }

                // Orb catcher collision — destroys this orb only
                let caughtOrb = false;
                for (const catcher of orbCatchers) {
                    if (catcher.collidesWithBall(currentBall) || catcher.intersectsBallPath(prevX, prevY, currentBall)) {
                        currentBall.alive = false;
                        spawnDangerParticles(currentBall.x, currentBall.y);
                        caughtOrb = true;
                        break;
                    }
                }
                if (caughtOrb) break;

                // Danger wall collision — instant level restart
                // Check both current position AND swept line from previous position
                let hitDanger = false;
                for (const dw of dangerWalls) {
                    if (dw.collidesWithBall(currentBall) || dw.intersectsBallPath(prevX, prevY, currentBall)) {
                        hitDanger = true;
                        break;
                    }
                }
                // Moving obstacles (red) also kill
                if (!hitDanger) {
                    for (const o of obstacles) {
                        if (o.collidesWithBall(currentBall) || o.intersectsBallPath(prevX, prevY, currentBall)) {
                            hitDanger = true;
                            break;
                        }
                    }
                }
                if (hitDanger) {
                    currentBall.alive = false;
                    spawnDangerParticles(currentBall.x, currentBall.y);
                    state = 'lost';
                    showMessage('Danger!', 1500);
                    setTimeout(() => resetLevel(), 1500);
                }
                if (!currentBall.alive || state === 'lost') break;

                const pluginResult = runFeatureBallStepHooks({ ball: currentBall, prevX, prevY, state, canvas, particles, spawnBounceParticles });
                if (pluginResult && pluginResult.kill) {
                    currentBall.alive = false;
                    state = 'lost';
                    showMessage(pluginResult.message || 'Danger!', 1500);
                    setTimeout(() => resetLevel(), 1500);
                    break;
                }
                if (!currentBall.alive || state === 'lost') break;

                // Target collision
                for (const t of targets) {
                    if (t.hit) continue;
                    const dist = Math.hypot(currentBall.x - t.x, currentBall.y - t.y);
                    if (dist < t.radius + currentBall.radius) {
                        t.hit = true;
                        hitTargets++;
                        score += 100 + currentBall.bounceCount * 10;
                        ui.setScore(score);
                        spawnTargetParticles(t.x, t.y);

                        if (hitTargets === totalTargets) {
                            state = 'won';
                            currentBall.alive = false;
                            showMessage('Clear!');
                            ui.showNextButton();
                        }
                    }
                }
            }

            if (!currentBall.alive || state === 'won' || state === 'lost') {
                continue;
            }

            // Trail (once per frame)
            trail.push({ x: currentBall.x, y: currentBall.y, age: 0 });
            if (trail.length > 200) trail.shift();

            // Ball too slow or too many bounces -> die
            const finalSpeed = Math.hypot(currentBall.vx, currentBall.vy);
            if (finalSpeed < 0.3 || currentBall.bounceCount > maxBounces) {
                currentBall.alive = false;
            }
        }

        if (spawnedBalls.length > 0) {
            balls.push(...spawnedBalls);
        }

        balls = balls.filter(b => b.alive);
        ball = balls.length > 0 ? balls[0] : null;

        if (state === 'won' || state === 'lost') return;

        if (balls.length === 0 && hitTargets < totalTargets) {
            if (!activeUnlimitedShots && shotsFired >= activeMaxShots) {
                state = 'lost';
                showMessage('Try Again');
                setTimeout(() => resetLevel(), 2000);
            } else {
                state = 'aiming';
            }
        }
    }

    function resolveOrbCollision(a, b) {
        if (!a || !b || !a.alive || !b.alive) return false;

        let dx = b.x - a.x;
        let dy = b.y - a.y;
        const minDist = (a.radius || 0) + (b.radius || 0);
        let dist = Math.hypot(dx, dy);

        if (dist >= minDist) return false;

        if (dist < 0.0001) {
            dx = 1;
            dy = 0;
            dist = 1;
        }

        const nx = dx / dist;
        const ny = dy / dist;

        const overlap = minDist - dist;
        a.x -= nx * overlap * 0.5;
        a.y -= ny * overlap * 0.5;
        b.x += nx * overlap * 0.5;
        b.y += ny * overlap * 0.5;

        const relVx = b.vx - a.vx;
        const relVy = b.vy - a.vy;
        const velAlongNormal = relVx * nx + relVy * ny;

        if (velAlongNormal > 0) return true;

        const restitution = 0.98;
        const impulse = -((1 + restitution) * velAlongNormal) / 2;
        const impulseX = impulse * nx;
        const impulseY = impulse * ny;

        a.vx -= impulseX;
        a.vy -= impulseY;
        b.vx += impulseX;
        b.vy += impulseY;

        return true;
    }

    function rectCircleCollision(circle, rect) {
        const cx = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
        const cy = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
        const dist = Math.hypot(circle.x - cx, circle.y - cy);
        return dist < circle.radius;
    }

    // Ray-cast: did the line from (x1,y1)->(x2,y2) cross through the rect?
    function lineRectIntersection(x1, y1, x2, y2, rect, radius = 6) {
        // Expand rect by ball radius for swept collision
        const r = radius;
        const rx = rect.x - r;
        const ry = rect.y - r;
        const rw = rect.w + r * 2;
        const rh = rect.h + r * 2;

        // Check if line segment intersects expanded rectangle
        const dx = x2 - x1;
        const dy = y2 - y1;

        let tmin = 0, tmax = 1;

        if (Math.abs(dx) > 0.0001) {
            let t1 = (rx - x1) / dx;
            let t2 = (rx + rw - x1) / dx;
            if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
            tmin = Math.max(tmin, t1);
            tmax = Math.min(tmax, t2);
            if (tmin > tmax) return false;
        } else {
            if (x1 < rx || x1 > rx + rw) return false;
        }

        if (Math.abs(dy) > 0.0001) {
            let t1 = (ry - y1) / dy;
            let t2 = (ry + rh - y1) / dy;
            if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
            tmin = Math.max(tmin, t1);
            tmax = Math.min(tmax, t2);
            if (tmin > tmax) return false;
        } else {
            if (y1 < ry || y1 > ry + rh) return false;
        }

        return true;
    }

    function resolveRectCollision(circle, rect) {
        const cx = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
        const cy = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));

        const dx = circle.x - cx;
        const dy = circle.y - cy;
        const dist = Math.hypot(dx, dy);

        if (dist === 0) {
            // Ball center is inside the rect — push out along the shortest axis
            const leftDist  = circle.x - rect.x;
            const rightDist = (rect.x + rect.w) - circle.x;
            const topDist   = circle.y - rect.y;
            const botDist   = (rect.y + rect.h) - circle.y;
            const minDist   = Math.min(leftDist, rightDist, topDist, botDist);

            if (minDist === leftDist) {
                circle.x = rect.x - circle.radius;
                circle.vx = -Math.abs(circle.vx);
            } else if (minDist === rightDist) {
                circle.x = rect.x + rect.w + circle.radius;
                circle.vx = Math.abs(circle.vx);
            } else if (minDist === topDist) {
                circle.y = rect.y - circle.radius;
                circle.vy = -Math.abs(circle.vy);
            } else {
                circle.y = rect.y + rect.h + circle.radius;
                circle.vy = Math.abs(circle.vy);
            }
            circle.vx *= 0.98;
            circle.vy *= 0.98;
            return;
        }

        // Push out
        const overlap = circle.radius - dist;
        const nx = dx / dist;
        const ny = dy / dist;
        circle.x += nx * (overlap + 0.1);
        circle.y += ny * (overlap + 0.1);

        // Reflect velocity
        const dot = circle.vx * nx + circle.vy * ny;
        circle.vx -= 2 * dot * nx;
        circle.vy -= 2 * dot * ny;

        // Damping
        circle.vx *= 0.98;
        circle.vy *= 0.98;
    }

    // Obstacles update
    function updateObstacles() {
        for (const o of obstacles) {
            if (o.vy === 0) continue;
            o.y += o.vy;
            if (o.y <= o.minY || o.y + o.h >= o.maxY + o.h) {
                o.vy *= -1;
            }
        }
        runFeatureUpdateHooks();
    }

    // Particles
    function spawnBounceParticles(x, y) {
        for (let i = 0; i < 6; i++) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                life: 1,
                decay: 0.03 + Math.random() * 0.02,
                color: '#00e5ff',
                size: 2 + Math.random() * 2
            });
        }
    }

    function spawnTargetParticles(x, y) {
        for (let i = 0; i < 20; i++) {
            const angle = (Math.PI * 2 * i) / 20;
            const speed = 2 + Math.random() * 4;
            particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1,
                decay: 0.015 + Math.random() * 0.01,
                color: `hsl(${Math.random() * 60 + 150}, 100%, 60%)`,
                size: 3 + Math.random() * 3
            });
        }
    }

    function spawnPortalParticles(x, y) {
        for (let i = 0; i < 12; i++) {
            const angle = (Math.PI * 2 * i) / 12;
            particles.push({
                x, y,
                vx: Math.cos(angle) * 3,
                vy: Math.sin(angle) * 3,
                life: 1,
                decay: 0.03,
                color: '#ff00ff',
                size: 3
            });
        }
    }

    function spawnDangerParticles(x, y) {
        for (let i = 0; i < 25; i++) {
            const angle = (Math.PI * 2 * i) / 25;
            const speed = 2 + Math.random() * 5;
            particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1,
                decay: 0.02 + Math.random() * 0.01,
                color: `hsl(${Math.random() * 20}, 100%, ${50 + Math.random() * 20}%)`,
                size: 3 + Math.random() * 4
            });
        }
    }

    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.96;
            p.vy *= 0.96;
            p.life -= p.decay;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    // Drawing
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Background grid
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 40) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 40) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        const time = Date.now() / 1000;

        // Draw walls
        for (const w of walls) {
            ctx.fillStyle = '#2a2a5a';
            ctx.fillRect(w.x, w.y, w.w, w.h);
            ctx.strokeStyle = '#4a4a8a';
            ctx.lineWidth = 1;
            ctx.strokeRect(w.x, w.y, w.w, w.h);
        }

        // Draw obstacles (moving)
        for (const o of obstacles) {
            ctx.fillStyle = '#5a2a2a';
            ctx.fillRect(o.x, o.y, o.w, o.h);
            ctx.strokeStyle = '#ff4444';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(o.x, o.y, o.w, o.h);
        }

        // Draw danger walls (red glow — instant death)
        for (const dw of dangerWalls) {
            const pulse = 0.7 + Math.sin(time * 4) * 0.3;
            ctx.fillStyle = `rgba(200, 20, 20, ${0.6 + pulse * 0.2})`;
            ctx.fillRect(dw.x, dw.y, dw.w, dw.h);
            ctx.strokeStyle = `rgba(255, 60, 60, ${pulse})`;
            ctx.lineWidth = 2;
            ctx.strokeRect(dw.x, dw.y, dw.w, dw.h);
            // Red glow
            ctx.shadowColor = '#ff2222';
            ctx.shadowBlur = 12 * pulse;
            ctx.strokeRect(dw.x, dw.y, dw.w, dw.h);
            ctx.shadowBlur = 0;
        }

        // Draw portals
        for (const p of portals) {
            p.phase += 0.05;
            drawPortal(p.x1, p.y1, p.radius, p.phase);
            drawPortal(p.x2, p.y2, p.radius, p.phase + Math.PI);
            // Draw connecting line
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 10]);
            ctx.beginPath();
            ctx.moveTo(p.x1, p.y1);
            ctx.lineTo(p.x2, p.y2);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        runFeatureDrawHooks(time);

        // Draw targets
        for (const t of targets) {
            if (t.hit) continue;
            t.pulsePhase += 0.04;
            const pulse = 1 + Math.sin(t.pulsePhase) * 0.15;
            const r = t.radius * pulse;

            // Glow
            const grad = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, r * 2.5);
            grad.addColorStop(0, 'rgba(0, 229, 255, 0.3)');
            grad.addColorStop(1, 'rgba(0, 229, 255, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(t.x, t.y, r * 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Target ring
            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
            ctx.stroke();

            // Inner dot
            ctx.fillStyle = '#00e5ff';
            ctx.beginPath();
            ctx.arc(t.x, t.y, 3, 0, Math.PI * 2);
            ctx.fill();

            // Crosshair
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.4)';
            ctx.lineWidth = 1;
            const ch = r + 5;
            ctx.beginPath(); ctx.moveTo(t.x - ch, t.y); ctx.lineTo(t.x - r + 5, t.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(t.x + r - 5, t.y); ctx.lineTo(t.x + ch, t.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(t.x, t.y - ch); ctx.lineTo(t.x, t.y - r + 5); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(t.x, t.y + r - 5); ctx.lineTo(t.x, t.y + ch); ctx.stroke();
        }

        // Draw launcher
        const launcherPulse = 1 + Math.sin(time * 3) * 0.1;
        const launcherColor = launcher.special ? '#ffe083' : '#00e5ff';
        ctx.fillStyle = launcherColor;
        ctx.beginPath();
        ctx.arc(launcher.x, launcher.y, 8 * launcherPulse, 0, Math.PI * 2);
        ctx.fill();

        const launcherGrad = ctx.createRadialGradient(launcher.x, launcher.y, 0, launcher.x, launcher.y, 20);
        if (launcher.special) {
            launcherGrad.addColorStop(0, 'rgba(255, 224, 131, 0.4)');
            launcherGrad.addColorStop(1, 'rgba(255, 224, 131, 0)');
        } else {
            launcherGrad.addColorStop(0, 'rgba(0, 229, 255, 0.3)');
            launcherGrad.addColorStop(1, 'rgba(0, 229, 255, 0)');
        }
        ctx.fillStyle = launcherGrad;
        ctx.beginPath();
        ctx.arc(launcher.x, launcher.y, 20, 0, Math.PI * 2);
        ctx.fill();

        if (launcher.special) {
            ctx.strokeStyle = 'rgba(255, 224, 131, 0.95)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(launcher.x, launcher.y, 13, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Draw aim line
        if (state === 'aiming') {
            const dx = mousePos.x - launcher.x;
            const dy = mousePos.y - launcher.y;
            const angle = Math.atan2(dy, dx);
            const power = Math.min(Math.hypot(dx, dy) / 20, 18);
            const len = power * 12;

            // Dotted aim line
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 8]);
            ctx.beginPath();
            ctx.moveTo(launcher.x, launcher.y);
            ctx.lineTo(
                launcher.x + Math.cos(angle) * len,
                launcher.y + Math.sin(angle) * len
            );
            ctx.stroke();
            ctx.setLineDash([]);

            // Power indicator
            const powerPct = power / 18;
            const barW = 60;
            const barH = 4;
            const barX = launcher.x - barW / 2;
            const barY = launcher.y + 25;
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.fillRect(barX, barY, barW, barH);
            const powerColor = powerPct < 0.5 ? '#00e5ff' : powerPct < 0.8 ? '#ffaa00' : '#ff4444';
            ctx.fillStyle = powerColor;
            ctx.fillRect(barX, barY, barW * powerPct, barH);

            // Trajectory preview (simple, no bouncing)
            drawTrajectoryPreview(angle, power);
        }

        // Draw trail
        for (let i = 0; i < trail.length; i++) {
            const t = trail[i];
            t.age++;
            const alpha = Math.max(0, 1 - t.age / 60);
            const size = Math.max(0.5, 3 * alpha);
            ctx.fillStyle = `rgba(0, 229, 255, ${alpha * 0.6})`;
            ctx.beginPath();
            ctx.arc(t.x, t.y, size, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw balls
        for (const currentBall of balls) {
            if (!currentBall.alive) continue;

            const ballGrad = ctx.createRadialGradient(currentBall.x, currentBall.y, 0, currentBall.x, currentBall.y, currentBall.radius * 3);
            ballGrad.addColorStop(0, 'rgba(0, 229, 255, 0.5)');
            ballGrad.addColorStop(1, 'rgba(0, 229, 255, 0)');
            ctx.fillStyle = ballGrad;
            ctx.beginPath();
            ctx.arc(currentBall.x, currentBall.y, currentBall.radius * 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(currentBall.x, currentBall.y, currentBall.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw particles
        for (const p of particles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        drawCreatorOverlay();
    }

    function drawPortal(x, y, radius, phase) {
        // Swirling portal effect
        for (let i = 0; i < 3; i++) {
            const r = radius - i * 4;
            if (r <= 0) continue;
            ctx.strokeStyle = `rgba(255, 0, 255, ${0.6 - i * 0.15})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, r, phase + i * 0.5, phase + i * 0.5 + Math.PI * 1.5);
            ctx.stroke();
        }
        // Center glow
        const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
        grad.addColorStop(0, 'rgba(255, 0, 255, 0.3)');
        grad.addColorStop(1, 'rgba(255, 0, 255, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawTrajectoryPreview(angle, power) {
        const steps = 40;
        let px = launcher.x;
        let py = launcher.y;
        let pvx = Math.cos(angle) * power;
        let pvy = Math.sin(angle) * power;

        ctx.fillStyle = 'rgba(0, 229, 255, 0.15)';
        for (let i = 0; i < steps; i++) {
            pvy += 0.04;
            px += pvx;
            py += pvy;

            // Simple boundary bounce for preview
            if (px <= 0 || px >= canvas.width) pvx *= -1;
            if (py <= 0 || py >= canvas.height) pvy *= -1;
            px = Math.max(0, Math.min(canvas.width, px));
            py = Math.max(0, Math.min(canvas.height, py));

            if (i % 2 === 0) {
                ctx.beginPath();
                ctx.arc(px, py, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    function drawLevelPreview(previewCanvas, level, levelNumber) {
        const previewCtx = previewCanvas.getContext('2d');
        const pw = previewCanvas.width;
        const ph = previewCanvas.height;
        const sx = pw / canvas.width;
        const sy = ph / canvas.height;
        const scale = (v) => v * sx;

        previewCtx.clearRect(0, 0, pw, ph);
        previewCtx.fillStyle = '#0b1222';
        previewCtx.fillRect(0, 0, pw, ph);

        previewCtx.strokeStyle = 'rgba(255,255,255,0.05)';
        for (let gx = 0; gx < pw; gx += 20) {
            previewCtx.beginPath();
            previewCtx.moveTo(gx, 0);
            previewCtx.lineTo(gx, ph);
            previewCtx.stroke();
        }
        for (let gy = 0; gy < ph; gy += 20) {
            previewCtx.beginPath();
            previewCtx.moveTo(0, gy);
            previewCtx.lineTo(pw, gy);
            previewCtx.stroke();
        }

        for (const f of level.features) {
            const plugin = featurePlugins.get(f.type);
            if (plugin && plugin.drawPreview) {
                plugin.drawPreview(f, { ctx: previewCtx, sx, sy, scale, width: pw, height: ph });
                continue;
            }
            if (f.type === 'wall') {
                previewCtx.fillStyle = '#2a2a5a';
                previewCtx.fillRect(f.x * sx, f.y * sy, f.w * sx, f.h * sy);
            } else if (f.type === 'dangerWall') {
                previewCtx.fillStyle = 'rgba(220, 45, 45, 0.8)';
                previewCtx.fillRect(f.x * sx, f.y * sy, f.w * sx, f.h * sy);
            } else if (f.type === 'obstacle') {
                previewCtx.fillStyle = '#7f3838';
                previewCtx.fillRect(f.x * sx, f.y * sy, f.w * sx, f.h * sy);
            } else if (f.type === 'portal') {
                previewCtx.strokeStyle = 'rgba(255, 80, 255, 0.4)';
                previewCtx.lineWidth = 1;
                previewCtx.beginPath();
                previewCtx.moveTo(f.x1 * sx, f.y1 * sy);
                previewCtx.lineTo(f.x2 * sx, f.y2 * sy);
                previewCtx.stroke();
                previewCtx.beginPath();
                previewCtx.arc(f.x1 * sx, f.y1 * sy, scale(f.radius), 0, Math.PI * 2);
                previewCtx.stroke();
                previewCtx.beginPath();
                previewCtx.arc(f.x2 * sx, f.y2 * sy, scale(f.radius), 0, Math.PI * 2);
                previewCtx.stroke();
            }
        }

        previewCtx.fillStyle = level.launcher && level.launcher.special ? '#ffe083' : '#00e5ff';
        previewCtx.beginPath();
        previewCtx.arc(level.launcher.x * sx, level.launcher.y * sy, 4, 0, Math.PI * 2);
        previewCtx.fill();

        previewCtx.strokeStyle = '#00e5ff';
        previewCtx.lineWidth = 1.1;
        for (const t of level.targets) {
            previewCtx.beginPath();
            previewCtx.arc(t.x * sx, t.y * sy, scale(t.radius), 0, Math.PI * 2);
            previewCtx.stroke();
        }

        previewCtx.fillStyle = 'rgba(255,255,255,0.7)';
        previewCtx.font = '11px sans-serif';
        previewCtx.fillText(`#${levelNumber}`, 6, 14);
    }

                    params.set('seedOffset', String(proceduralConfig.seedOffset));
                    params.set('lcgMultiplier', String(proceduralConfig.lcgMultiplier));
                    params.set('lcgModulus', String(proceduralConfig.lcgModulus));

                });

                previewCanvas.height = 180;
                previewCanvas.style.width = '100%';
                previewCanvas.style.border = '1px solid #1f2d56';
                previewCanvas.style.borderRadius = '6px';

                stat.style.marginTop = '6px';

    function cloneCreatorLevel(level) {
        return {
            launcher: {
                ...level.launcher,
                special: !!level.launcher.special,
                orbCount: normalizeSpecialLauncherOrbCount(level.launcher.orbCount)
            },
            maxShots: level.maxShots,
            targets: level.targets.map(t => ({ ...t })),
            features: level.features.map(f => {
                const c = { ...f };
                delete c.plugin;
                return c;
            })
        };
    }

    function refreshCreatorScene(mode = 'creator') {
        applyLevelConfig(normalizeLevelConfig(creatorLevel), mode);
        ui.setLevel('C');
    }

    function getRectFromPoints(a, b) {
        const x = Math.min(a.x, b.x);
        const y = Math.min(a.y, b.y);
        const w = Math.max(12, Math.abs(a.x - b.x));
        const h = Math.max(12, Math.abs(a.y - b.y));
        return { x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h) };
    }

    function featureCenter(f) {
        if (f.type === 'portal') return { x: (f.x1 + f.x2) / 2, y: (f.y1 + f.y2) / 2 };
        if (f.type === 'tube' && Array.isArray(f.points) && f.points.length > 0) {
            let sx = 0;
            let sy = 0;
            for (const p of f.points) {
                sx += p.x;
                sy += p.y;
            }
            return { x: sx / f.points.length, y: sy / f.points.length };
        }
        return { x: f.x + (f.w || 0) / 2, y: f.y + (f.h || 0) / 2 };
    }

    function distancePointToSegment(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const len2 = dx * dx + dy * dy;
        if (len2 < 0.0001) return Math.hypot(px - x1, py - y1);
        const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2));
        const cx = x1 + t * dx;
        const cy = y1 + t * dy;
        return Math.hypot(px - cx, py - cy);
    }

    function removeNearestCreatorObject(x, y) {
        let best = { kind: null, idx: -1, dist: Infinity };
        for (let i = 0; i < creatorLevel.targets.length; i++) {
            const t = creatorLevel.targets[i];
            const d = Math.hypot(x - t.x, y - t.y);
            if (d < best.dist) best = { kind: 'target', idx: i, dist: d };
        }
        for (let i = 0; i < creatorLevel.features.length; i++) {
            const feature = creatorLevel.features[i];
            let d;
            if (feature.type === 'portal') {
                const r = feature.radius || 22;
                const d1 = Math.hypot(x - feature.x1, y - feature.y1) - r;
                const d2 = Math.hypot(x - feature.x2, y - feature.y2) - r;
                const ds = distancePointToSegment(x, y, feature.x1, feature.y1, feature.x2, feature.y2) - 10;
                d = Math.min(d1, d2, ds);
            } else if (feature.type === 'tube' && Array.isArray(feature.points) && feature.points.length > 1) {
                d = Infinity;
                for (let j = 0; j < feature.points.length - 1; j++) {
                    const a = feature.points[j];
                    const b = feature.points[j + 1];
                    const ds = distancePointToSegment(x, y, a.x, a.y, b.x, b.y) - ((feature.thickness || 14) * 0.5 + 8);
                    if (ds < d) d = ds;
                }
            } else {
                const c = featureCenter(feature);
                d = Math.hypot(x - c.x, y - c.y);
            }
            if (d < best.dist) best = { kind: 'feature', idx: i, dist: d };
        }
        if (Math.hypot(x - creatorLevel.launcher.x, y - creatorLevel.launcher.y) < best.dist) {
            best = { kind: 'launcher', idx: -1, dist: Math.hypot(x - creatorLevel.launcher.x, y - creatorLevel.launcher.y) };
        }

        if (best.dist > 40) return;
        if (best.kind === 'target') creatorLevel.targets.splice(best.idx, 1);
        if (best.kind === 'feature') creatorLevel.features.splice(best.idx, 1);
        if (best.kind === 'launcher') creatorLevel.launcher = { x: 100, y: 500, special: false, orbCount: 1 };
    }

    function placeCreatorClick(x, y) {
        const currentOrbCount = normalizeSpecialLauncherOrbCount(creatorLevel.launcher && creatorLevel.launcher.orbCount);
        if (creatorTool === 'launcher') {
            creatorLevel.launcher = { x: Math.round(x), y: Math.round(y), special: false, orbCount: currentOrbCount };
            creatorDirty = true;
            refreshCreatorScene('creator');
            return;
        }
        if (creatorTool === 'specialLauncher') {
            creatorLevel.launcher = { x: Math.round(x), y: Math.round(y), special: true, orbCount: currentOrbCount };
            creatorDirty = true;
            refreshCreatorScene('creator');
            return;
        }
        if (creatorTool === 'gravityWell') {
            creatorLevel.features.push({
                type: 'gravityWell',
                x: Math.round(x),
                y: Math.round(y),
                radius: 120,
                strength: 12000
            });
            creatorDirty = true;
            refreshCreatorScene('creator');
            return;
        }
        if (creatorTool === 'target') {
            creatorLevel.targets.push({ x: Math.round(x), y: Math.round(y), radius: 18 });
            creatorDirty = true;
            refreshCreatorScene('creator');
            return;
        }
        if (creatorTool === 'portal') {
            if (!creatorPortalStart) {
                creatorPortalStart = { x, y };
            } else {
                creatorLevel.features.push({
                    type: 'portal',
                    x1: Math.round(creatorPortalStart.x),
                    y1: Math.round(creatorPortalStart.y),
                    x2: Math.round(x),
                    y2: Math.round(y),
                    radius: 22
                });
                creatorPortalStart = null;
                creatorDirty = true;
                refreshCreatorScene('creator');
            }
            return;
        }
        if (creatorTool === 'erase') {
            removeNearestCreatorObject(x, y);
            creatorDirty = true;
            refreshCreatorScene('creator');
        }
    }

    function finalizeCreatorDrag(endX, endY) {
        if (!creatorDragStart) return;
        const rect = getRectFromPoints(creatorDragStart, { x: endX, y: endY });

        if (creatorTool === 'wall') {
            creatorLevel.features.push({ type: 'wall', ...rect });
        } else if (creatorTool === 'duplicatorWall') {
            creatorLevel.features.push({ type: 'duplicatorWall', ...rect });
        } else if (creatorTool === 'dangerWall') {
            creatorLevel.features.push({ type: 'dangerWall', ...rect });
        } else if (creatorTool === 'orbCatcher') {
            creatorLevel.features.push({ type: 'orbCatcher', ...rect });
        } else if (creatorTool === 'obstacle') {
            creatorLevel.features.push({
                type: 'obstacle',
                ...rect,
                vy: 2,
                minY: Math.max(0, rect.y - 90),
                maxY: Math.min(canvas.height - rect.h, rect.y + 90)
            });
        }

        creatorDragStart = null;
        creatorDirty = true;
        refreshCreatorScene('creator');
    }

    function finalizeTubeDraft() {
        if (!creatorTubeDraft || creatorTubeDraft.length < 3) {
            creatorTubeDraft = null;
            return;
        }
        creatorLevel.features.push({
            type: 'tube',
            points: creatorTubeDraft.map(p => ({ x: Math.round(p.x), y: Math.round(p.y) })),
            thickness: 14
        });
        creatorTubeDraft = null;
        creatorDirty = true;
        refreshCreatorScene('creator');
    }

    function exportCreatorLevel() {
        const payload = {
            launcher: { ...creatorLevel.launcher },
            maxShots: creatorLevel.maxShots,
            targets: creatorLevel.targets.map(t => ({ ...t })),
            features: creatorLevel.features.map(f => ({ ...f }))
        };
        const text = JSON.stringify(payload, null, 2);
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => showMessage('Level JSON copied', 1200));
        } else {
            window.prompt('Copy level JSON:', text);
        }
    }

    function drawCreatorOverlay() {
        if (!creatorMode || state !== 'creator') return;

        if (creatorDragStart) {
            const rect = getRectFromPoints(creatorDragStart, mousePos);
            ctx.strokeStyle = 'rgba(255,255,255,0.85)';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
            ctx.setLineDash([]);
        }

        if (creatorPortalStart) {
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(creatorPortalStart.x, creatorPortalStart.y);
            ctx.lineTo(mousePos.x, mousePos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(creatorPortalStart.x, creatorPortalStart.y, 5, 0, Math.PI * 2);
            ctx.stroke();
        }

        if (creatorTubeDraft && creatorTubeDraft.length > 0) {
            ctx.strokeStyle = 'rgba(120, 220, 255, 0.85)';
            ctx.lineWidth = 14;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(creatorTubeDraft[0].x, creatorTubeDraft[0].y);
            for (let i = 1; i < creatorTubeDraft.length; i++) {
                ctx.lineTo(creatorTubeDraft[i].x, creatorTubeDraft[i].y);
            }
            ctx.stroke();
        }

        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(8, 8, 420, 60);
        ctx.fillStyle = '#cfefff';
        ctx.font = '13px sans-serif';
        ctx.fillText(`Creator • Tool: ${creatorTool} • Targets: ${creatorLevel.targets.length} • Features: ${creatorLevel.features.length}`, 16, 30);
        ctx.fillText('Click place. Drag wall/dupe/danger/catcher/obstacle/tube. Gravity well is click-place. Portal uses 2 clicks.', 16, 50);
    }

    function drawCreatorToolPreview(previewCanvas, tool) {
        const pctx = previewCanvas.getContext('2d');
        const w = previewCanvas.width;
        const h = previewCanvas.height;
        pctx.clearRect(0, 0, w, h);
        pctx.fillStyle = '#0f1a33';
        pctx.fillRect(0, 0, w, h);

        if (tool === 'launcher') {
            pctx.fillStyle = '#00e5ff';
            pctx.beginPath();
            pctx.arc(w / 2, h / 2, 8, 0, Math.PI * 2);
            pctx.fill();
        } else if (tool === 'specialLauncher') {
            pctx.fillStyle = '#ffe083';
            pctx.beginPath();
            pctx.arc(w / 2, h / 2, 8, 0, Math.PI * 2);
            pctx.fill();
            pctx.strokeStyle = 'rgba(255, 224, 131, 0.95)';
            pctx.lineWidth = 2;
            pctx.beginPath();
            pctx.arc(w / 2, h / 2, 12, 0, Math.PI * 2);
            pctx.stroke();
        } else if (tool === 'target') {
            pctx.strokeStyle = '#00e5ff';
            pctx.lineWidth = 2;
            pctx.beginPath();
            pctx.arc(w / 2, h / 2, 10, 0, Math.PI * 2);
            pctx.stroke();
            pctx.fillStyle = '#00e5ff';
            pctx.beginPath();
            pctx.arc(w / 2, h / 2, 2.5, 0, Math.PI * 2);
            pctx.fill();
        } else if (tool === 'wall') {
            pctx.fillStyle = '#2a2a5a';
            pctx.fillRect(14, 11, w - 28, h - 22);
        } else if (tool === 'duplicatorWall') {
            pctx.fillStyle = 'rgba(144,95,255,0.82)';
            pctx.fillRect(14, 11, w - 28, h - 22);
            pctx.strokeStyle = 'rgba(208,188,255,0.95)';
            pctx.lineWidth = 1.5;
            pctx.strokeRect(14, 11, w - 28, h - 22);
        } else if (tool === 'dangerWall') {
            pctx.fillStyle = 'rgba(220,45,45,0.85)';
            pctx.fillRect(14, 11, w - 28, h - 22);
        } else if (tool === 'orbCatcher') {
            pctx.fillStyle = 'rgba(255,130,40,0.82)';
            pctx.fillRect(14, 11, w - 28, h - 22);
            pctx.strokeStyle = 'rgba(255,190,110,0.95)';
            pctx.lineWidth = 1.5;
            pctx.strokeRect(14, 11, w - 28, h - 22);
        } else if (tool === 'gravityWell') {
            const gx = w / 2;
            const gy = h / 2;
            const gr = Math.min(w, h) * 0.38;
            const grad = pctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
            grad.addColorStop(0, 'rgba(255,235,160,0.95)');
            grad.addColorStop(0.3, 'rgba(255,196,70,0.6)');
            grad.addColorStop(1, 'rgba(255,196,70,0)');
            pctx.fillStyle = grad;
            pctx.beginPath();
            pctx.arc(gx, gy, gr, 0, Math.PI * 2);
            pctx.fill();
            pctx.fillStyle = '#ffd27a';
            pctx.beginPath();
            pctx.arc(gx, gy, 3.5, 0, Math.PI * 2);
            pctx.fill();
        } else if (tool === 'obstacle') {
            pctx.fillStyle = '#7f3838';
            pctx.fillRect(22, 8, w - 44, h - 16);
            pctx.strokeStyle = '#ff4444';
            pctx.lineWidth = 1.5;
            pctx.strokeRect(22, 8, w - 44, h - 16);
        } else if (tool === 'portal') {
            pctx.strokeStyle = 'rgba(255,80,255,0.8)';
            pctx.lineWidth = 2;
            pctx.beginPath();
            pctx.moveTo(16, h / 2);
            pctx.lineTo(w - 16, h / 2);
            pctx.stroke();
            pctx.beginPath();
            pctx.arc(16, h / 2, 7, 0, Math.PI * 2);
            pctx.stroke();
            pctx.beginPath();
            pctx.arc(w - 16, h / 2, 7, 0, Math.PI * 2);
            pctx.stroke();
        } else if (tool === 'tube') {
            pctx.strokeStyle = 'rgba(120, 220, 255, 0.95)';
            pctx.lineWidth = 9;
            pctx.lineJoin = 'round';
            pctx.lineCap = 'round';
            pctx.beginPath();
            pctx.moveTo(10, h - 8);
            pctx.lineTo(20, 10);
            pctx.lineTo(34, 13);
            pctx.lineTo(44, h - 9);
            pctx.stroke();
        } else if (tool === 'erase') {
            pctx.fillStyle = '#c0c8d8';
            pctx.fillRect(16, h / 2 - 5, w - 32, 10);
            pctx.strokeStyle = '#0f1a33';
            pctx.lineWidth = 3;
            pctx.beginPath();
            pctx.moveTo(16, 10);
            pctx.lineTo(w - 16, h - 10);
            pctx.stroke();
        }
    }

    function updateCreatorToolSelectionUI() {
        for (const entry of creatorToolButtons) {
            const active = entry.tool === creatorTool;
            entry.button.style.borderColor = active ? '#00e5ff' : '#2b3c66';
            entry.button.style.background = active ? 'rgba(0,229,255,0.14)' : 'rgba(8,14,30,0.9)';
        }
    }

        sidebar.style.zIndex = '70';
        sidebar.style.display = 'flex';
        sidebar.style.flexDirection = 'column';

    function initCreatorMode() {
        state = 'creator';
        ui.setTitle('Bouncing Ball Creator');

        let loadedFromSnapshot = false;
        if (creatorUseLiveSnapshot) {
            try {
                const raw = sessionStorage.getItem(CREATOR_SNAPSHOT_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    creatorLevel = cloneCreatorLevel(normalizeLevelConfig(parsed));
                    loadedFromSnapshot = true;
                }
                sessionStorage.removeItem(CREATOR_SNAPSHOT_KEY);
            } catch {
            }
        }

        if (!loadedFromSnapshot) {
            creatorLevel = cloneCreatorLevel(getLevel(currentLevel));
        }
        if (!creatorLevel.launcher) creatorLevel.launcher = { x: 100, y: 500, special: false };
        creatorLevel.launcher.special = !!creatorLevel.launcher.special;
        creatorLevel.launcher.orbCount = normalizeSpecialLauncherOrbCount(creatorLevel.launcher.orbCount);
        creatorTool = 'target';
        creatorPortalStart = null;
        creatorDragStart = null;
        creatorTubeDraft = null;
        creatorDirty = false;

        const controls = document.getElementById('controls');
        controls.innerHTML = '';
        createCreatorToolSidebar();

        const shotsInput = document.createElement('input');
        shotsInput.type = 'number';
        shotsInput.min = '1';
        shotsInput.value = String(creatorLevel.maxShots);

        shotsInput.title = 'Max shots';
        shotsInput.addEventListener('change', () => {
            creatorLevel.maxShots = Math.max(1, parseInt(shotsInput.value, 10) || 1);
            refreshCreatorScene(state === 'creator' ? 'creator' : 'aiming');
        });

        const orbCountInput = document.createElement('input');
        orbCountInput.type = 'number';
        orbCountInput.min = '1';
        orbCountInput.max = '9';
        orbCountInput.value = String(normalizeSpecialLauncherOrbCount(creatorLevel.launcher.orbCount));
        orbCountInput.style.width = '110px';
        orbCountInput.title = 'Special launcher orbs per click (1-99)';
        orbCountInput.addEventListener('change', () => {
            creatorLevel.launcher.orbCount = normalizeSpecialLauncherOrbCount(orbCountInput.value);
            orbCountInput.value = String(creatorLevel.launcher.orbCount);
            refreshCreatorScene(state === 'creator' ? 'creator' : 'aiming');
        });

        const playBtn = document.createElement('button');
        playBtn.textContent = 'Play Test';
        playBtn.addEventListener('click', () => {
            if (state === 'creator') {
                refreshCreatorScene('aiming');
                playBtn.textContent = 'Back To Edit';
            } else {
                refreshCreatorScene('creator');
                playBtn.textContent = 'Play Test';
            }
        });

        const undoBtn = document.createElement('button');
        undoBtn.textContent = 'Undo Last';
        undoBtn.addEventListener('click', () => {
            if (creatorLevel.features.length > 0) {
                creatorLevel.features.pop();
                creatorDirty = true;
                refreshCreatorScene('creator');
            } else if (creatorLevel.targets.length > 0) {
                creatorLevel.targets.pop();
                creatorDirty = true;
                refreshCreatorScene('creator');
            }
        });

        const clearBtn = document.createElement('button');
        clearBtn.textContent = 'Clear';
        clearBtn.addEventListener('click', () => {
            creatorLevel.targets = [];
            creatorLevel.features = [];
            creatorPortalStart = null;
            creatorDragStart = null;
            creatorTubeDraft = null;
            creatorDirty = true;
            refreshCreatorScene('creator');
        });

        const exportBtn = document.createElement('button');
        exportBtn.textContent = 'Export JSON';
        exportBtn.addEventListener('click', exportCreatorLevel);

        controls.appendChild(shotsInput);
        controls.appendChild(orbCountInput);
        controls.appendChild(playBtn);
        controls.appendChild(undoBtn);
        controls.appendChild(clearBtn);
        controls.appendChild(exportBtn);

        refreshCreatorScene('creator');
    }

    const InputActionType = {
        CANVAS_MOUSE_MOVE: 'CANVAS_MOUSE_MOVE',
        CANVAS_MOUSE_DOWN: 'CANVAS_MOUSE_DOWN',
        CANVAS_MOUSE_UP: 'CANVAS_MOUSE_UP',
        CANVAS_CLICK: 'CANVAS_CLICK',
        KEY_DOWN: 'KEY_DOWN'
    };

    let app = null;

    function dispatchInputAction(action) {
        if (!app || !action) return;
        app.dispatch(action);
    }

    // Input
    ui.bindInputListeners({
        canvas,
        onMouseMove: (event) => dispatchInputAction({ type: InputActionType.CANVAS_MOUSE_MOVE, event }),
        onMouseDown: (event) => dispatchInputAction({ type: InputActionType.CANVAS_MOUSE_DOWN, event }),
        onMouseUp: (event) => dispatchInputAction({ type: InputActionType.CANVAS_MOUSE_UP, event }),
        onClick: (event) => dispatchInputAction({ type: InputActionType.CANVAS_CLICK, event }),
        onKeyDown: (event) => dispatchInputAction({ type: InputActionType.KEY_DOWN, event })
    });

    class GameEngine {
        tick() {
            if (inspectorMode) return;
            if (state !== 'creator') updateObstacles();
            if (state === 'shooting') updateBall();
            updateParticles();
            draw();
        }

        shoot() {
            shoot();
        }
    }

    const engine = new GameEngine();

    class AppController {
        constructor({ engine }) {
            this.engine = engine;
            this.mode = 'play';
            this.loopRunning = false;
            this.boundFrame = () => {
                this.engine.tick();
                requestAnimationFrame(this.boundFrame);
            };
        }

        dispatch(action) {
            if (!action || !action.type) return;
            if (action.type === InputActionType.CANVAS_MOUSE_MOVE) {
                this.handleCanvasMouseMove(action.event);
                return;
            }
            if (action.type === InputActionType.CANVAS_MOUSE_DOWN) {
                this.handleCanvasMouseDown(action.event);
                return;
            }
            if (action.type === InputActionType.CANVAS_MOUSE_UP) {
                this.handleCanvasMouseUp(action.event);
                return;
            }
            if (action.type === InputActionType.CANVAS_CLICK) {
                this.handleCanvasClick(action.event);
                return;
            }
            if (action.type === InputActionType.KEY_DOWN) {
                this.handleKeyDown(action.event);
            }
        }

        getCanvasPoint(event) {
            if (!event) return { x: 0, y: 0 };
            const rect = canvas.getBoundingClientRect();
            return {
                x: event.clientX - rect.left,
                y: event.clientY - rect.top
            };
        }

        handleCanvasMouseMove(event) {
            const point = this.getCanvasPoint(event);
            mousePos.x = point.x;
            mousePos.y = point.y;

            if (creatorMode && state === 'creator' && creatorTool === 'tube' && creatorTubeDraft) {
                const last = creatorTubeDraft[creatorTubeDraft.length - 1];
                const d = Math.hypot(mousePos.x - last.x, mousePos.y - last.y);
                if (d >= 6) {
                    creatorTubeDraft.push({ x: mousePos.x, y: mousePos.y });
                }
            }
        }

        handleCanvasMouseDown(event) {
            if (!creatorMode || state !== 'creator') return;

            if (creatorTool === 'wall' || creatorTool === 'duplicatorWall' || creatorTool === 'dangerWall' || creatorTool === 'orbCatcher' || creatorTool === 'obstacle') {
                const point = this.getCanvasPoint(event);
                creatorDragStart = {
                    x: point.x,
                    y: point.y
                };
                return;
            }

            if (creatorTool === 'tube') {
                const point = this.getCanvasPoint(event);
                creatorTubeDraft = [{
                    x: point.x,
                    y: point.y
                }];
            }
        }

        handleCanvasMouseUp(event) {
            if (!creatorMode || state !== 'creator') return;
            if (creatorTool === 'tube' && creatorTubeDraft) {
                finalizeTubeDraft();
                return;
            }
            if (!creatorDragStart) return;
            const point = this.getCanvasPoint(event);
            finalizeCreatorDrag(point.x, point.y);
        }

        handleCanvasClick(event) {
            if (creatorMode && state === 'creator') {
                const point = this.getCanvasPoint(event);
                placeCreatorClick(point.x, point.y);
                return;
            }
            this.engine.shoot();
        }

        handleKeyDown(event) {
            if (!event) return;
            if (event.key === 'r' || event.key === 'R') resetLevel();
            if (event.key === ' ' && state === 'aiming') {
                event.preventDefault();
                this.engine.shoot();
            }
            if (event.key === 'Enter' && state === 'won') nextLevel();
        }

        bootstrap() {
            currentLevel = parseUrlOptions();
            this.mode = this.resolveModeFromFlags();
            initGlobalModeSwitcher();
            this.switchMode(this.mode);
            this.startLoop();
        }

        resolveModeFromFlags() {
            if (menuMode) return 'menu';
            if (inspectorMode) return 'inspector';
            if (creatorMode) return 'creator';
            return 'play';
        }

        switchMode(nextMode) {
            this.mode = nextMode;
            if (nextMode === 'menu') {
                loadLevel(currentLevel);
                initModeMenu();
                return;
            }
            if (nextMode === 'inspector') {
                initInspectorMode();
                return;
            }
            if (nextMode === 'creator') {
                initCreatorMode();
                return;
            }
            loadLevel(currentLevel);
        }

        startLoop() {
            if (this.loopRunning || this.mode === 'inspector') return;
            this.loopRunning = true;
            this.boundFrame();
        }
    }

    app = new AppController({ engine });
    app.bootstrap();
    </script>
</body>
