<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
        }
        #gameContainer {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 800px;
            padding: 0 10px;
        }
        #header h1 {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #00e5ff;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
        }
        .stat {
            font-size: 14px;
            color: #aaa;
            letter-spacing: 2px;
        }
        .stat span {
            color: #00e5ff;
            font-weight: bold;
            font-size: 18px;
        }
        canvas {
            border: 1px solid #1a1a3a;
            border-radius: 8px;
            cursor: crosshair;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.1);
        }
        #controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        button {
            background: transparent;
            border: 1px solid #00e5ff;
            color: #00e5ff;
            padding: 8px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        button:hover {
            background: rgba(0, 229, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
        }
        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 12px;
            text-transform: uppercase;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            text-shadow: 0 0 30px rgba(0, 229, 255, 0.8);
            z-index: 10;
        }
        #message.show { opacity: 1; }
        .back-link {
            position: fixed;
            top: 15px;
            left: 15px;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 2px;
            transition: color 0.3s;
        }
        .back-link:hover { color: #00e5ff; }
        .mode-switcher {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 60;
            display: flex;
            gap: 6px;
            padding: 6px;
            border: 1px solid #2b3c66;
            background: rgba(8, 14, 30, 0.85);
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }
        .mode-switcher button {
            padding: 6px 10px;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: none;
        }
        .mode-switcher button.active {
            background: rgba(0, 229, 255, 0.2);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.25);
        }
    </style>

<body>
    <a href="../index.html" class="back-link">← BACK</a>
    <div id="gameContainer">
        <div id="header">
            <h1>Bouncing Ball</h1>
            <div style="display:flex; gap:30px;">
                <div class="stat">Level <span id="levelNum">1</span></div>
                <div class="stat">Shots <span id="shotCount">0</span> / <span id="maxShots">1</span></div>
                <div class="stat">Score <span id="score">0</span></div>
            </div>
        </div>
        <canvas id="canvas" width="800" height="600"></canvas>
        <div id="controls">
            <button id="resetBtn" onclick="resetLevel()">Reset</button>
            <button id="nextBtn" onclick="nextLevel()" style="display:none">Next Level →</button>
        </div>
        <div id="message"></div>
    </div>

    <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const message = document.getElementById('message');
    const nextBtn = document.getElementById('nextBtn');

    class UIController {
        constructor() {
            this.message = message;
            this.nextBtn = nextBtn;
            this.title = document.querySelector('#header h1');
            this.levelNum = document.getElementById('levelNum');
            this.shotCount = document.getElementById('shotCount');
            this.maxShots = document.getElementById('maxShots');
            this.score = document.getElementById('score');
        }

        setTitle(text) {
            if (this.title) this.title.textContent = text;
        }

        setLevel(value) {
            this.levelNum.textContent = value;
        }

        setShotCount(value) {
            this.shotCount.textContent = String(value);
        }

        setMaxShots(value, unlimited = false) {
            this.maxShots.textContent = formatMaxShots(value, unlimited);
        }

        setScore(value) {
            this.score.textContent = String(value);
        }

        showNextButton() {
            this.nextBtn.style.display = 'inline-block';
        }

        hideNextButton() {
            this.nextBtn.style.display = 'none';
        }

        showMessage(text, duration = 2000) {
            this.message.textContent = text;
            this.message.className = 'show';
            setTimeout(() => { this.message.className = ''; }, duration);
        }

        bindInputListeners({ canvas, onMouseMove, onMouseDown, onMouseUp, onClick, onKeyDown }) {
            if (canvas) {
                if (onMouseMove) canvas.addEventListener('mousemove', onMouseMove);
                if (onMouseDown) canvas.addEventListener('mousedown', onMouseDown);
                if (onMouseUp) canvas.addEventListener('mouseup', onMouseUp);
                if (onClick) canvas.addEventListener('click', onClick);
            }
            if (onKeyDown) {
                document.addEventListener('keydown', onKeyDown);
            }
        }
    }

    const ui = new UIController();

    // Game state
    const gameState = {
        phase: 'aiming', // aiming, shooting, won, lost
        progress: {
            currentLevel: 0,
            score: 0,
            shotsFired: 0,
            hitTargets: 0,
            totalTargets: 0,
            bounceCount: 0,
            maxBounces: 50,
            activeMaxShots: 1,
            activeUnlimitedShots: false
        },
        scene: {
            ball: null,
            balls: [],
            targets: [],
            walls: [],
            duplicatorWalls: [],
            dangerWalls: [],
            obstacles: [],
            portals: [],
            orbCatchers: [],
            gravityWells: [],
            launcher: { x: 100, y: 500 },
            aimAngle: -Math.PI / 4,
            aimPower: 12,
            mousePos: { x: 400, y: 300 },
            trail: [],
            particles: [],
            levelFeatures: []
        }
    };

    function bindGameStateAlias(name, getter, setter) {
        Object.defineProperty(window, name, {
            configurable: true,
            enumerable: false,
            get: getter,
            set: setter
        });
    }

    bindGameStateAlias('state', () => gameState.phase, (value) => { gameState.phase = value; });
    bindGameStateAlias('currentLevel', () => gameState.progress.currentLevel, (value) => { gameState.progress.currentLevel = value; });
    bindGameStateAlias('score', () => gameState.progress.score, (value) => { gameState.progress.score = value; });
    bindGameStateAlias('shotsFired', () => gameState.progress.shotsFired, (value) => { gameState.progress.shotsFired = value; });
    bindGameStateAlias('hitTargets', () => gameState.progress.hitTargets, (value) => { gameState.progress.hitTargets = value; });
    bindGameStateAlias('totalTargets', () => gameState.progress.totalTargets, (value) => { gameState.progress.totalTargets = value; });
    bindGameStateAlias('bounceCount', () => gameState.progress.bounceCount, (value) => { gameState.progress.bounceCount = value; });
    bindGameStateAlias('maxBounces', () => gameState.progress.maxBounces, (value) => { gameState.progress.maxBounces = value; });
    bindGameStateAlias('activeMaxShots', () => gameState.progress.activeMaxShots, (value) => { gameState.progress.activeMaxShots = value; });
    bindGameStateAlias('activeUnlimitedShots', () => gameState.progress.activeUnlimitedShots, (value) => { gameState.progress.activeUnlimitedShots = value; });

    bindGameStateAlias('ball', () => gameState.scene.ball, (value) => { gameState.scene.ball = value; });
    bindGameStateAlias('balls', () => gameState.scene.balls, (value) => { gameState.scene.balls = value; });
    bindGameStateAlias('targets', () => gameState.scene.targets, (value) => { gameState.scene.targets = value; });
    bindGameStateAlias('walls', () => gameState.scene.walls, (value) => { gameState.scene.walls = value; });
    bindGameStateAlias('duplicatorWalls', () => gameState.scene.duplicatorWalls, (value) => { gameState.scene.duplicatorWalls = value; });
    bindGameStateAlias('dangerWalls', () => gameState.scene.dangerWalls, (value) => { gameState.scene.dangerWalls = value; });
    bindGameStateAlias('obstacles', () => gameState.scene.obstacles, (value) => { gameState.scene.obstacles = value; });
    bindGameStateAlias('portals', () => gameState.scene.portals, (value) => { gameState.scene.portals = value; });
    bindGameStateAlias('orbCatchers', () => gameState.scene.orbCatchers, (value) => { gameState.scene.orbCatchers = value; });
    bindGameStateAlias('gravityWells', () => gameState.scene.gravityWells, (value) => { gameState.scene.gravityWells = value; });
    bindGameStateAlias('launcher', () => gameState.scene.launcher, (value) => { gameState.scene.launcher = value; });
    bindGameStateAlias('aimAngle', () => gameState.scene.aimAngle, (value) => { gameState.scene.aimAngle = value; });
    bindGameStateAlias('aimPower', () => gameState.scene.aimPower, (value) => { gameState.scene.aimPower = value; });
    bindGameStateAlias('mousePos', () => gameState.scene.mousePos, (value) => { gameState.scene.mousePos = value; });
    bindGameStateAlias('trail', () => gameState.scene.trail, (value) => { gameState.scene.trail = value; });
    bindGameStateAlias('particles', () => gameState.scene.particles, (value) => { gameState.scene.particles = value; });
    bindGameStateAlias('levelFeatures', () => gameState.scene.levelFeatures, (value) => { gameState.scene.levelFeatures = value; });

    function resetFeatureBuckets() {
        walls = [];
        duplicatorWalls = [];
        dangerWalls = [];
        obstacles = [];
        portals = [];
        orbCatchers = [];
        gravityWells = [];
    }

    function syncFeatureBucketsFromLevelFeatures() {
        resetFeatureBuckets();

        for (const feature of levelFeatures) {
            const bucket = feature.plugin ? feature.plugin.bucket : null;
            if (bucket === 'walls') walls.push(feature);
            if (bucket === 'duplicatorWalls') duplicatorWalls.push(feature);
            if (bucket === 'dangerWalls') dangerWalls.push(feature);
            if (bucket === 'obstacles') {
                if (!Number.isFinite(feature.originalY)) feature.originalY = feature.y;
                obstacles.push(feature);
            }
            if (bucket === 'portals') {
                if (!Number.isFinite(feature.phase)) feature.phase = 0;
                portals.push(feature);
            }
            if (bucket === 'orbCatchers') orbCatchers.push(feature);
            if (bucket === 'gravityWells') gravityWells.push(feature);
        }
    }

    let inspectorMode = false;
    let creatorMode = false;
    let menuMode = false;
    let inspectorStartLevel = 1;
    let creatorLevel = null;
    let creatorTool = 'target';
    let creatorDragStart = null;
    let creatorPortalStart = null;
    let creatorTubeDraft = null;
    let creatorDirty = false;
    let creatorToolButtons = [];
    let creatorUseLiveSnapshot = false;
    const CREATOR_SNAPSHOT_KEY = 'ricochet_creator_snapshot';

    function formatMaxShots(maxShots, unlimited = false) {
        if (unlimited) return '∞';
        return String(Math.max(1, Math.floor(Number(maxShots) || 1)));
    }

    function normalizeSpecialLauncherOrbCount(rawValue) {
        const count = Math.floor(Number(rawValue));
        if (!Number.isFinite(count)) return 1;
        return Math.max(1, Math.min(99, count));
    }

    const defaultProceduralConfig = {
        seedMultiplier: 7919,
        seedOffset: 1337,
        lcgMultiplier: 16807,
        lcgModulus: 2147483647
    };
    const proceduralConfig = { ...defaultProceduralConfig };

    function parseIntParam(params, key) {
        const raw = params.get(key);
        if (raw === null) return null;
        const value = parseInt(raw, 10);
        return Number.isFinite(value) ? value : null;
    }

    function parseUrlOptions() {
        const params = new URLSearchParams(window.location.search);

        const seedMultiplier = parseIntParam(params, 'seedMultiplier');
        const seedOffset = parseIntParam(params, 'seedOffset');
        const lcgMultiplier = parseIntParam(params, 'lcgMultiplier');
        const lcgModulus = parseIntParam(params, 'lcgModulus');

        if (seedMultiplier !== null) proceduralConfig.seedMultiplier = seedMultiplier;
        if (seedOffset !== null) proceduralConfig.seedOffset = seedOffset;
        if (lcgMultiplier !== null) proceduralConfig.lcgMultiplier = Math.max(2, Math.floor(lcgMultiplier));
        if (lcgModulus !== null) proceduralConfig.lcgModulus = Math.max(3, Math.floor(lcgModulus));

        const mode = (params.get('mode') || '').toLowerCase();
        creatorUseLiveSnapshot = params.get('editCurrent') === '1';

        const inspectorStart = parseIntParam(params, 'inspectorStart');
        if (inspectorStart !== null) {
            inspectorStartLevel = Math.max(1, inspectorStart);
        }

        const levelParam = parseIntParam(params, 'level');
        const idxParam = parseIntParam(params, 'idx');

        inspectorMode = mode === 'inspector';
        creatorMode = mode === 'creator';
        menuMode = mode === 'menu' || (mode === '' && levelParam === null && idxParam === null);

        if (levelParam !== null) {
            return Math.max(0, levelParam - 1);
        }

        if (idxParam !== null) {
            return Math.max(0, idxParam);
        }

        return 0;
    }

    function goToMode(mode) {
        const params = new URLSearchParams();
        params.set('mode', mode);

        const levelValue = String(Math.max(1, currentLevel + 1));
        if (mode === 'play' || mode === 'creator') {
            params.set('level', levelValue);
        }
        if (mode === 'inspector') {
            params.set('inspectorStart', levelValue);
        }

        if (mode === 'creator' && !creatorMode && !inspectorMode && !menuMode) {
            try {
                sessionStorage.setItem(CREATOR_SNAPSHOT_KEY, JSON.stringify(getCurrentSceneLevelConfig()));
                params.set('editCurrent', '1');
            } catch {
            }
        }

        params.set('seedMultiplier', String(proceduralConfig.seedMultiplier));
        params.set('seedOffset', String(proceduralConfig.seedOffset));
        params.set('lcgMultiplier', String(proceduralConfig.lcgMultiplier));
        params.set('lcgModulus', String(proceduralConfig.lcgModulus));

        window.location.search = params.toString();
    }

    function getCurrentSceneLevelConfig() {
        const launcherConfig = {
            x: Math.round(launcher.x),
            y: Math.round(launcher.y)
        };
        if (activeUnlimitedShots) {
            launcherConfig.special = true;
            launcherConfig.orbCount = normalizeSpecialLauncherOrbCount(launcher.orbCount);
        }

        return {
            launcher: launcherConfig,
            maxShots: Math.max(1, activeMaxShots),
            targets: targets.map(t => ({ x: Math.round(t.x), y: Math.round(t.y), radius: t.radius })),
            features: [
                ...walls.map(w => ({ type: 'wall', x: Math.round(w.x), y: Math.round(w.y), w: Math.round(w.w), h: Math.round(w.h) })),
                ...duplicatorWalls.map(w => ({ type: 'duplicatorWall', x: Math.round(w.x), y: Math.round(w.y), w: Math.round(w.w), h: Math.round(w.h) })),
                ...dangerWalls.map(w => ({ type: 'dangerWall', x: Math.round(w.x), y: Math.round(w.y), w: Math.round(w.w), h: Math.round(w.h) })),
                ...orbCatchers.map(c => ({ type: 'orbCatcher', x: Math.round(c.x), y: Math.round(c.y), w: Math.round(c.w), h: Math.round(c.h) })),
                ...gravityWells.map(g => ({
                    type: 'gravityWell',
                    x: Math.round(g.x),
                    y: Math.round(g.y),
                    radius: Number.isFinite(g.radius) ? g.radius : 120,
                    strength: Number.isFinite(g.strength) ? g.strength : 12000
                })),
                ...obstacles.map(o => ({
                    type: 'obstacle',
                    x: Math.round(o.x),
                    y: Math.round(o.y),
                    w: Math.round(o.w),
                    h: Math.round(o.h),
                    vy: Number.isFinite(o.vy) ? o.vy : 0,
                    minY: Number.isFinite(o.minY) ? Math.round(o.minY) : Math.round(o.y),
                    maxY: Number.isFinite(o.maxY) ? Math.round(o.maxY) : Math.round(o.y + (o.h || 0))
                })),
                ...portals.map(p => ({
                    type: 'portal',
                    x1: Math.round(p.x1),
                    y1: Math.round(p.y1),
                    x2: Math.round(p.x2),
                    y2: Math.round(p.y2),
                    radius: Number.isFinite(p.radius) ? p.radius : 22
                }))
            ]
        };
    }

    function initGlobalModeSwitcher() {
        const existing = document.getElementById('modeSwitcher');
        if (existing) existing.remove();

        const wrapper = document.createElement('div');
        wrapper.id = 'modeSwitcher';
        wrapper.className = 'mode-switcher';

        const modes = [
            { id: 'play', label: 'Play' },
            { id: 'inspector', label: 'Inspector' },
            { id: 'creator', label: 'Edit' },
            { id: 'menu', label: 'Menu' }
        ];

        for (const mode of modes) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = mode.label;

            const isActive =
                (mode.id === 'play' && !inspectorMode && !creatorMode && !menuMode) ||
                (mode.id === 'inspector' && inspectorMode) ||
                (mode.id === 'creator' && creatorMode) ||
                (mode.id === 'menu' && menuMode);

            if (isActive) btn.classList.add('active');
            btn.addEventListener('click', () => goToMode(mode.id));
            wrapper.appendChild(btn);
        }

        document.body.appendChild(wrapper);
    }

    function computeProceduralSeed(idx) {
        return idx * proceduralConfig.seedMultiplier + proceduralConfig.seedOffset;
    }

    // Levels
    // Supported entry formats:
    // 1) Full handcrafted level object (launcher/targets/walls/...)
    //    Use launcher.special = true for a special launcher with infinite shots.
    //    You can also use plugin-based features instead of walls/obstacles/portals:
    //    { launcher, maxShots, targets, features: [{ type: 'wall', ... }, { type: 'portal', ... }] }
    // 2) Procedural reference object:
    //    { proceduralLevel: 37 }  -> uses seeded procedural level #37 (1-based)
    //    { proceduralIdx: 36 }    -> uses seeded procedural level index 36 (0-based)
    //    Aliases: seedLevel / seedIdx
    const levels = [
        // Level 1: Simple - one target, straight-ish shot
        {
            launcher: { x: 100, y: 500 },
            maxShots: 3,
            targets: [
                { x: 650, y: 150, radius: 20 }
            ],
            walls: [],
            obstacles: [],
            portals: []
        },
        // Level 2: Bounce off a wall
        {

            targets: [
                { x: 650, y: 500, radius: 20 }
            ],
            walls: [
                { x: 300, y: 100, w: 20, h: 400 }
            ],
            obstacles: [],
            portals: []
        },
        // Level 3: Two targets + danger wall
        {
            launcher: { x: 100, y: 550 },
            maxShots: 2,
            targets: [
                { x: 700, y: 100, radius: 18 },
                { x: 400, y: 80, radius: 18 }
            ],
            walls: [
                { x: 250, y: 200, w: 20, h: 300 }
            ],
            dangerWalls: [
                { x: 500, y: 300, w: 20, h: 200 }
            ],
            obstacles: [],
            portals: []
        },
        // Level 4: Obstacle course with danger
        {
            launcher: { x: 80, y: 520 },
            maxShots: 3,
            targets: [
                { x: 720, y: 520, radius: 18 }
            ],
            walls: [
                { x: 195, y: 0, w: 30, h: 400 },
                { x: 395, y: 200, w: 30, h: 400 },
                { x: 595, y: 0, w: 30, h: 400 }
            ],
            dangerWalls: [
                { x: 295, y: 450, w: 100, h: 20 }
            ],
            obstacles: [],
            portals: []
        },
        // Level 5: Moving obstacle + danger
        {
            launcher: { x: 100, y: 500 },
            maxShots: 3,
            targets: [
                { x: 650, y: 300, radius: 22 }
            ],
            walls: [],
            dangerWalls: [
                { x: 300, y: 0, w: 20, h: 200 },
                { x: 300, y: 400, w: 20, h: 200 }
            ],
            obstacles: [
                { x: 400, y: 100, w: 30, h: 120, vy: 2, minY: 100, maxY: 380 }
            ],
            portals: []
        },
        // Level 6: Portal introduction
        {
            launcher: { x: 100, y: 300 },

                { x: 700, y: 300, radius: 18 }
            ],

                { x: 350, y: 0, w: 20, h: 600 }
            ],

            ]
        },
        // Level 7: Complex maze
        {

            maxShots: 3,
            targets: [
                { x: 400, y: 300, radius: 16 },
                { x: 60, y: 60, radius: 16 }
            ],
            walls: [
                { x: 150, y: 100, w: 24, h: 350 },
                { x: 300, y: 150, w: 24, h: 350 },
                { x: 450, y: 100, w: 24, h: 350 },
                { x: 600, y: 150, w: 24, h: 350 },
                { x: 150, y: 100, w: 150, h: 24 },
                { x: 450, y: 485, w: 150, h: 24 }
            ],
            dangerWalls: [
                { x: 520, y: 250, w: 80, h: 20 }
            ],
            obstacles: [],

        },
        // Level 8: Double portal chaos
        {
            launcher: { x: 400, y: 550 },
            maxShots: 2,
            targets: [
                { x: 100, y: 100, radius: 16 },
                { x: 700, y: 100, radius: 16 }
            ],
            walls: [
                { x: 0, y: 250, w: 300, h: 24 },
                { x: 500, y: 250, w: 300, h: 24 }
            ],
            obstacles: [
                { x: 370, y: 50, w: 60, h: 200, vy: 0, minY: 50, maxY: 50 }
            ],
            portals: [
                { x1: 200, y1: 450, x2: 200, y2: 100, radius: 22 },
                { x1: 600, y1: 450, x2: 600, y2: 100, radius: 22 }
            ]
        },
        // Level 9: Precision
        {
            launcher: { x: 400, y: 550 },
            maxShots: 1,
            targets: [
                { x: 200, y: 100, radius: 14 },
                { x: 600, y: 100, radius: 14 },
                { x: 400, y: 50, radius: 14 }
            ],
            walls: [
                { x: 296, y: 150, w: 24, h: 300 },
                { x: 486, y: 150, w: 24, h: 300 }
            ],
            dangerWalls: [
                { x: 350, y: 300, w: 100, h: 20 }
            ],
            obstacles: [],
            portals: []
        },
        // Level 10: The gauntlet

    function resolveLevelDefinition(levelDef, fallbackIdx) {
        if (!levelDef || typeof levelDef !== 'object') return generateLevel(fallbackIdx);

        const proceduralLevel = levelDef.proceduralLevel ?? levelDef.seedLevel;
        if (Number.isFinite(proceduralLevel)) {
            const proceduralIdx = Math.max(0, Math.floor(proceduralLevel) - 1);
            return generateLevel(proceduralIdx);
        }

        const proceduralIdx = levelDef.proceduralIdx ?? levelDef.seedIdx;
        if (Number.isFinite(proceduralIdx)) {
            return generateLevel(Math.max(0, Math.floor(proceduralIdx)));
        }

        return levelDef;
    }

    function buildLegacyFeatures(level) {
        const out = [];
        for (const w of (level.walls || [])) out.push({ type: 'wall', ...w });
        for (const dw of (level.duplicatorWalls || [])) out.push({ type: 'duplicatorWall', ...dw });
        for (const dw of (level.dangerWalls || [])) out.push({ type: 'dangerWall', ...dw });
        for (const o of (level.obstacles || [])) out.push({ type: 'obstacle', ...o });
        for (const p of (level.portals || [])) out.push({ type: 'portal', ...p });
        for (const c of (level.orbCatchers || [])) out.push({ type: 'orbCatcher', ...c });
        for (const g of (level.gravityWells || [])) out.push({ type: 'gravityWell', ...g });
        return out;
    }

    function normalizeLevelConfig(level) {
        const normalized = {
            launcher: {
                ...(level.launcher || { x: 100, y: 500 }),
                special: !!(level.launcher && level.launcher.special),
                orbCount: normalizeSpecialLauncherOrbCount(level && level.launcher ? level.launcher.orbCount : 1)
            },
            maxShots: Number.isFinite(level.maxShots) ? level.maxShots : 2,
            targets: (level.targets || []).map(t => ({ ...t })),
            features: []
        };

        if (Array.isArray(level.features) && level.features.length > 0) {
            normalized.features = level.features.map(f => ({ ...f }));
        } else {
            normalized.features = buildLegacyFeatures(level);
        }

        return normalized;
    }

    function pointInPolygon(x, y, points) {
        let inside = false;
        for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
            const xi = points[i].x;
            const yi = points[i].y;
            const xj = points[j].x;
            const yj = points[j].y;
            const intersect = ((yi > y) !== (yj > y)) &&
                (x < (xj - xi) * (y - yi) / ((yj - yi) || 0.0001) + xi);
            if (intersect) inside = !inside;
        }
        return inside;
    }

    function closestPointOnSegment(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const len2 = dx * dx + dy * dy;
        if (len2 < 0.0001) {
            return { x: x1, y: y1, t: 0 };
        }
        const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2));
        return { x: x1 + t * dx, y: y1 + t * dy, t };
    }

    function computeTubeGeometry(points) {
        const segmentLengths = [];
        let totalLength = 0;
        for (let i = 0; i < points.length - 1; i++) {
            const a = points[i];
            const b = points[i + 1];
            const len = Math.hypot(b.x - a.x, b.y - a.y);
            segmentLengths.push(len);
            totalLength += len;
        }
        return { segmentLengths, totalLength };
    }

    function pointAtTubeDistance(feature, distance) {
        const points = feature.points || [];
        const lengths = feature.segmentLengths || [];
        if (points.length === 0) return { x: 0, y: 0, tx: 1, ty: 0 };
        if (points.length === 1) return { x: points[0].x, y: points[0].y, tx: 1, ty: 0 };

        let d = Math.max(0, Math.min(feature.totalLength || 0, distance));
        for (let i = 0; i < lengths.length; i++) {
            const segLen = lengths[i] || 0;
            const a = points[i];
            const b = points[i + 1];
            if (d <= segLen || i === lengths.length - 1) {
                const t = segLen < 0.0001 ? 0 : d / segLen;
                const x = a.x + (b.x - a.x) * t;
                const y = a.y + (b.y - a.y) * t;
                const tx = segLen < 0.0001 ? 1 : (b.x - a.x) / segLen;
                const ty = segLen < 0.0001 ? 0 : (b.y - a.y) / segLen;
                return { x, y, tx, ty };
            }
            d -= segLen;
        }

        const last = points[points.length - 1];
        return { x: last.x, y: last.y, tx: 1, ty: 0 };
    }

    function advanceBallTubeTransit(ballObj, dt) {
        if (!ballObj || !ballObj.tubeTransit) return false;
        const transit = ballObj.tubeTransit;
        const feature = transit.feature;
        if (!feature || !feature.points || feature.points.length < 2) {
            ballObj.tubeTransit = null;
            return false;
        }

        const speed = transit.speed;
        transit.distance += transit.dir * speed * dt;

        const reachedStart = transit.distance <= 0;
        const reachedEnd = transit.distance >= feature.totalLength;
        if (!reachedStart && !reachedEnd) {
            const p = pointAtTubeDistance(feature, transit.distance);
            ballObj.x = p.x;
            ballObj.y = p.y;
            ballObj.vx = p.tx * speed * transit.dir;
            ballObj.vy = p.ty * speed * transit.dir;
            return true;
        }

        const edgeDistance = reachedStart ? 0 : feature.totalLength;
        const p = pointAtTubeDistance(feature, edgeDistance);
        const outDir = reachedStart ? -1 : 1;
        ballObj.x = p.x + p.tx * outDir * (ballObj.radius + 4);
        ballObj.y = p.y + p.ty * outDir * (ballObj.radius + 4);
        ballObj.vx = p.tx * speed * outDir;
        ballObj.vy = p.ty * speed * outDir;
        ballObj.tubeTransit = null;
        ballObj.tubeCooldown = 14;
        return true;
    }

    class TubeFeature extends BallFeature {
        draw({ ctx }) {
            if (!this.points || this.points.length < 2) return;
            const outer = this.thickness || 14;
            const inner = Math.max(2, outer - 6);

            ctx.strokeStyle = 'rgba(120, 220, 255, 0.85)';
            ctx.lineWidth = outer;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(this.points[0].x, this.points[0].y);
            for (let i = 1; i < this.points.length; i++) {
                ctx.lineTo(this.points[i].x, this.points[i].y);
            }
            ctx.stroke();

            ctx.save();
            ctx.globalCompositeOperation = 'destination-out';
            ctx.strokeStyle = 'rgba(0,0,0,1)';
            ctx.lineWidth = inner;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(this.points[0].x, this.points[0].y);
            for (let i = 1; i < this.points.length; i++) {
                ctx.lineTo(this.points[i].x, this.points[i].y);
            }
            ctx.stroke();
            ctx.restore();

            ctx.strokeStyle = 'rgba(0, 229, 255, 0.45)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(this.points[0].x, this.points[0].y);
            for (let i = 1; i < this.points.length; i++) {
                ctx.lineTo(this.points[i].x, this.points[i].y);
            }
            ctx.stroke();

            const endRadius = this.endRadius || 22;
            ctx.strokeStyle = 'rgba(180, 245, 255, 0.9)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(this.points[0].x, this.points[0].y, endRadius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(this.points[this.points.length - 1].x, this.points[this.points.length - 1].y, endRadius, 0, Math.PI * 2);
            ctx.stroke();
        }

        onBallStep(context) {
            const points = this.points || [];
            if (points.length < 2 || !context.ball || !context.ball.alive) return null;

            if (context.ball.tubeCooldown > 0) {
                context.ball.tubeCooldown--;
            }
            if (context.ball.tubeTransit) return null;

            const start = points[0];
            const end = points[points.length - 1];
            const catchRadius = this.endRadius || 22;
            const dStart = Math.hypot(context.ball.x - start.x, context.ball.y - start.y);
            const dEnd = Math.hypot(context.ball.x - end.x, context.ball.y - end.y);

            if ((context.ball.tubeCooldown || 0) <= 0) {
                const speed = Math.max(2.5, Math.hypot(context.ball.vx, context.ball.vy));
                if (dStart <= catchRadius + context.ball.radius) {
                    context.ball.tubeTransit = { feature: this, distance: 0, dir: 1, speed };
                    return { stopProcessing: true };
                }
                if (dEnd <= catchRadius + context.ball.radius) {
                    context.ball.tubeTransit = { feature: this, distance: this.totalLength, dir: -1, speed };
                    return { stopProcessing: true };
                }
            }

            let best = { dist: Infinity, point: null, a: null, b: null };
            for (let i = 0; i < points.length - 1; i++) {
                const a = points[i];
                const b = points[i + 1];
                const cp = closestPointOnSegment(context.ball.x, context.ball.y, a.x, a.y, b.x, b.y);
                const dist = Math.hypot(context.ball.x - cp.x, context.ball.y - cp.y);
                if (dist < best.dist) best = { dist, point: cp, a, b };
            }

            const nearHole = dStart <= catchRadius || dEnd <= catchRadius;
            const tubeHalf = (this.thickness || 14) * 0.5;

            if (!nearHole && best.point && best.dist < tubeHalf + context.ball.radius) {
                let nx = context.ball.x - best.point.x;
                let ny = context.ball.y - best.point.y;
                let nlen = Math.hypot(nx, ny);
                if (nlen < 0.0001 && best.a && best.b) {
                    const sx = best.b.x - best.a.x;
                    const sy = best.b.y - best.a.y;
                    nx = -sy;
                    ny = sx;
                    nlen = Math.hypot(nx, ny);
                }
                if (nlen > 0.0001) {
                    nx /= nlen;
                    ny /= nlen;
                    const overlap = tubeHalf + context.ball.radius - best.dist + 0.2;
                    context.ball.x += nx * overlap;
                    context.ball.y += ny * overlap;

                    const dot = context.ball.vx * nx + context.ball.vy * ny;
                    context.ball.vx -= 2 * dot * nx;
                    context.ball.vy -= 2 * dot * ny;
                    context.ball.vx *= 0.98;
                    context.ball.vy *= 0.98;
                    if (context.spawnBounceParticles) {
                        context.spawnBounceParticles(context.ball.x, context.ball.y);
                    }
                }
            }

            return null;
        }
    }

        drawPreview(feature, { ctx, sx, sy }) {
            if (!feature.points || feature.points.length < 2) return;
            const outer = Math.max(2, (feature.thickness || 14) * sx * 0.55);

            ctx.strokeStyle = 'rgba(120, 220, 255, 0.9)';
            ctx.lineWidth = outer;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            for (let i = 1; i < feature.points.length; i++) {
                ctx.lineTo(feature.points[i].x * sx, feature.points[i].y * sy);
            }
            ctx.stroke();

            ctx.strokeStyle = '#0b1222';
            ctx.lineWidth = inner;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(feature.points[0].x * sx, feature.points[0].y * sy);
            for (let i = 1; i < feature.points.length; i++) {
                ctx.lineTo(feature.points[i].x * sx, feature.points[i].y * sy);
            }
            ctx.stroke();

            const r = (feature.endRadius || 22) * sx;
            ctx.strokeStyle = 'rgba(180, 245, 255, 0.95)';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.arc(feature.points[0].x * sx, feature.points[0].y * sy, r, 0, Math.PI * 2);
            ctx.stroke();
            const end = feature.points[feature.points.length - 1];
            ctx.beginPath();
            ctx.arc(end.x * sx, end.y * sy, r, 0, Math.PI * 2);
